        if(D){ C.dekV=1;
          D.setAttribute('material','color:#000000;opacity:1;transparent:true;'+
            'shader:flat;depthWrite:false;depthTest:false'); } } }
    if(demo) SND.zeg('Demo'); else SND.zeg('Launch'); }

  function naarMenu(){
    window.PHASE='menu'; window.PAUSED=false; window.PARADEKLAAR=0;
    try{ document.body.className=''; }catch(e){}      // beschermlaag uit in het menu
    { const rg=document.querySelector('#rig');
      const c=rg&&rg.components&&rg.components.cosmic; if(c) c.besAan=false; }
    const rig=document.querySelector('#rig'), C=rig&&rig.components&&rig.components.cosmic;
    if(C){ C.demoStop(); C.reset(); C.over=false; C.klaar=false; C.paneel(false);
      // elke keer dat je in het menu komt een andere wereld
      C.menuHemel=undefined; C.hemelI=-1;
      try{ C.hemelZet(); C.objZet(); }catch(e){} }
    window.DEMO=false; window.AIM=null;
    const m=document.querySelector('#menu'); if(m) m.setAttribute('visible',true);
    const r=document.querySelector('#richt'); if(r) r.setAttribute('visible',true);
    ['#hudL','#hudR','#hudC','#hudW'].forEach(function(id){
      const e=document.querySelector(id); if(e) e.setAttribute('value',''); });
    laserAan(true); toonScores(); toonVoortgang(); }

  function knoppen(){
    const kl=function(id,fn){ const e=document.querySelector(id); if(e) e.addEventListener('click',fn); };
    kl('#handL',function(){ window.PRIMHAND='left'; handKleur(); SND.gun(0,0); });
    kl('#handR',function(){ window.PRIMHAND='right'; handKleur(); SND.gun(0,0); });
    kl('#btnStart',function(){ startSpel(false); });
    kl('#btnDemo',function(){ startSpel(true); });
    kl('#btnCont',function(){ const v=leesVoortgang(); if(!v) return; startSpel(false,v); });
    let techLv=1, techWv=1;
    const wvToon=function(){
      const t=document.querySelector('#wvTxt');
      if(t) t.setAttribute('value',techWv>GOLVEN?'BOSS':('WAVE '+techWv)); };
    // Het testpaneel EN het hoofdmenu stonden allebei aan: dan kijk je door de
    // ene knoppenrij heen naar de andere. Ze wisselen elkaar nu af.
    // LET OP: #tech zit BINNEN #menu. Het menu onzichtbaar maken nam dus het
    // testpaneel mee, en dan gebeurde er niets zichtbaars. In plaats daarvan
    // verbergen we alleen de losse menu-onderdelen.
    const MENUDEEL=['#btnStart','#btnCont','#btnEasy','#btnNorm','#btnHard',
      '#btnDemo','#btnScores','#btnHelp','#btnTech','#btnVR','#btnShare','#btnStop',
      '#mStart','#mCont','#mEasy','#mNorm','#mHard','#mDemo','#mScores','#mHelp',
      '#mTest','#mVR','#mShare','#mStop','#scoreLijst','#titel','#menuSchip',
      '#handL','#handR','#handLt','#handRt','#handHint'];
    const menuDeelToon=function(aan){
      MENUDEEL.forEach(function(id){
        const e=document.querySelector(id);
        if(e) e.setAttribute('visible',!!aan); }); };
    const techToon=function(aan){
      const t=document.querySelector('#tech');
      if(t) t.setAttribute('visible',!!aan);
      menuDeelToon(!aan); };
    const lvToon=function(){ const t=document.querySelector('#lvTxt');
      if(t) t.setAttribute('value',techLv>16?'PARADE':('LEVEL '+techLv)); };
    kl('#btnNieuw',function(){ versieHerlaad(); });
    // De drie standen staan naast elkaar; de gekozen licht op.
    const moeiToon=function(){
      const rg=document.querySelector('#rig');
      const c2=rg&&rg.components&&rg.components.cosmic;
      [['easy','#btnEasy','#mEasy','EASY'],['mid','#btnNorm','#mNorm','NORMAL'],
       ['hard','#btnHard','#mHard','HARD']].forEach(function(q){
        const aan=(MSTAND===q[0]);
        const b=document.querySelector(q[1]);
        if(b) b.setAttribute('material','color:'+(aan?'#0d3a4c':'#0a1d28')+
          ';shader:flat;opacity:'+(aan?0.95:0.5)+';transparent:true');
        if(c2){ c2['hM'+q[0]]=null;
          try{ c2.letterZet(q[2],q[3],aan?'#eafcff':'#bfe4f2','#1b6f8a',aan?0.092:0.078,0.24); }catch(e){} } }); };
    const zetStand=function(s){
      MSTAND=s; try{ localStorage.setItem('cosmic_moei',s); }catch(e){}
      moeiToon(); SND.boom(0); };
    kl('#btnEasy',function(){ zetStand('easy'); });
    kl('#btnNorm',function(){ zetStand('mid'); });
    kl('#btnHard',function(){ zetStand('hard'); });
    try{ const m2=localStorage.getItem('cosmic_moei');
         if(m2&&MOEILIJK[m2]) MSTAND=m2; }catch(e){}
    moeiToon();
    // Sjoerds andere spel staat op dezelfde plek, alleen eindigt het pad op /VR/
    // Het adres van het spel op het klembord, zodat je het kunt doorsturen.
    // AFSLUITEN. Een browser mag zichzelf zelden sluiten — dat mag alleen als
    // de pagina zelf is geopend met een script. We doen daarom eerst alles wat
    // wél kan: VR verlaten, muziek en geluid stoppen, het spel opruimen. Daarna
    // proberen we de vensterpoging; lukt die niet, dan zie je een afscheidsscherm.
    kl('#btnStop',function(){
      try{ SND.stop&&SND.stop(); }catch(e){}
      try{ const s=document.querySelector('a-scene');
        if(s&&s.is&&s.is('vr-mode')) s.exitVR(); }catch(e){}
      const rg=document.querySelector('#rig');
      const c=rg&&rg.components&&rg.components.cosmic;
      if(c){ try{ c.demoStop(); c.reset(); }catch(e){} }
      window.PHASE='uit'; window.PAUSED=true;
      const d=document.querySelector('#laad');
      if(d){ d.style.display='flex'; d.style.opacity='1';
        d.innerHTML='<div style="text-align:center;color:#8fd8ec;'+
          'font:600 30px Trebuchet MS,sans-serif;line-height:1.6">'+
          'COSMIC SHOOTER<br><span style="font-size:19px;color:#6f8fa2">'+
          'tot de volgende keer</span><br><br>'+
          '<span style="font-size:15px;color:#4d6675">je mag dit venster sluiten</span></div>'; }
      setTimeout(function(){ try{ window.close(); }catch(e){} },400); });

    kl('#btnShare',function(){
      const url=location.origin+location.pathname;
      let ok=false;
      try{ if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url); ok=true; } }catch(e){}
      if(!ok){ try{
        const t=document.createElement('textarea');
        t.value=url; t.style.position='fixed'; t.style.opacity='0';
        document.body.appendChild(t); t.select();
        ok=document.execCommand('copy');
        document.body.removeChild(t); }catch(e){} }
      mTekst('#mShare',ok?'COPIED!':url.replace(/^https?:\/\//,''),
        ok?'#8fd84a':'#cfeeff',ok?0.104:0.052,0.20);
      SND.boom(0);
      // Na een paar tellen weer gewoon SHARE. Dit loopt via menuTick, want de
      // wachtrij van het spel draait niet als je in het menu staat.
      window.__shareT=performance.now()+2600; });

    kl('#btnVR',function(){
      const p=location.pathname.replace(/\/Cosmic\/?$/i,'/VR/');
      location.href=location.origin+(p===location.pathname?'/VR/':p); });
    kl('#btnTech',function(){ techToon(true); lvToon(); });
    kl('#btnTechUit',function(){ techToon(false); });
    kl('#btnLvMin',function(){ techLv=Math.max(1,techLv-1); lvToon(); wvToon(); });
    kl('#btnLvPlus',function(){ techLv=Math.min(17,techLv+1); lvToon(); });
    const techStart=function(w,demo){
      techToon(false);
      if(techLv>16){ startSpel(!!demo,{l:1,w:0});
        // hier bestaat de verkorte C() niet; het spel zit op de rig
        const rg=document.querySelector('#rig');
        const c=rg&&rg.components&&rg.components.cosmic;
        if(c){ c.par9klaar=1; c.paradeStart(); }
        return; }
      startSpel(!!demo,{l:techLv,w:w}); };
    // Sjoerd wilde level ÉN golf kunnen kiezen in plaats van begin/mid/boss.
    // Golf GOLVEN+1 betekent: meteen de baas.
    kl('#btnFaseA',function(){ techWv=Math.max(1,techWv-1); wvToon(); });
    kl('#btnFaseB',function(){ techWv=Math.min(GOLVEN+1,techWv+1); wvToon(); });
    kl('#btnFaseC',function(){ techStart(techWv-1); });
    // Sjoerd wil kunnen meekijken: dezelfde plek, maar dan met de autopiloot.
    kl('#btnTestDemo',function(){ techStart(techWv-1,true); });
    // Met deze knop zet je de meetregel aan: dan zie je IN DE BRIL hoeveel
    // vijandelijk vuur er leeft en hoeveel daarvan zichtbaar is.
    kl('#btnScores',toonScores);
    // CONTROLS deed niets: #scoreLijst is een entity zonder tekst, dus
    // setAttribute('value') kwam nergens terecht. Nu een echt paneel met alle
    // knoppen erop.
    // Alle knoppen van de bril op een rij. Het menu gaat uit zolang dit
    // openstaat, anders kijk je door twee panelen tegelijk.
    let HULPAAN=false;
    const hulpToon=function(aan){
      HULPAAN=!!aan;
      const p=document.querySelector('#hulp');
      if(p) p.setAttribute('visible',HULPAAN);
      menuDeelToon(!HULPAAN);
      if(!HULPAAN) return;
      const rg=document.querySelector('#rig');
      const c=rg&&rg.components&&rg.components.cosmic;
      if(!c) return;
      const rij=[
        ['#hTitel','CONTROLS','#ffb03a',0.115],
        ['#hR1','TRIGGER   -   schieten','#eafcff',0.082],
        ['#hR2','GRIP   -   ultimate','#eafcff',0.082],
        ['#hR3','JOYSTICK OMHOOG   -   raketten','#eafcff',0.078],
        ['#hR4','JOYSTICK RECHTS   -   shotgun','#eafcff',0.078],
        ['#hR5','JOYSTICK OMLAAG   -   laser','#eafcff',0.078],
        ['#hR6','JOYSTICK LINKS   -   electro','#eafcff',0.078],
        ['#hR7','A B X Y   -   terug naar mitrailleur','#8fd8ec',0.072],
        ['#hR8','JOYSTICK INDRUKKEN   -   pauze','#8fd8ec',0.072],
        ['#mHulpUit','BACK','#eafcff',0.120]
      ];
      rij.forEach(function(q){
        try{ c.letterZet(q[0],q[1],q[2],'#2a9fc4',q[3],0.30); }catch(e){} }); };
    kl('#btnHelp',function(){ hulpToon(true); });
    kl('#btnHulpUit',function(){ hulpToon(false); });
    kl('#btnGo',function(){ const rig=document.querySelector('#rig'),
        C=rig&&rig.components&&rig.components.cosmic; if(!C) return;
      if(C.klaar) naarMenu(); else C.verder(); });
    kl('#btnQuit',naarMenu);
    kl('#btnTrack',function(){ AC(); if(!PLAY.length) return; SND.volgende(); });
    handKleur(); toonScores(); toonVoortgang(); }

  // =========================================================
  //  OPSTARTEN
  // =========================================================
  // Kijkt of het bestand op de server een ander versienummer heeft dan wat er
  // nu draait. Alleen de eerste 4 kB ophalen: het nummer staat op byte 2267.
  // Blijft in het menu doorkijken of er een nieuwe versie op de server staat.
  // Zodra die er is verschijnt het paneel met de OK-knop, en stopt het kijken.
  function versieWacht(){
    if(window.__vcTimer) return;
    window.__vcTimer=setInterval(function(){
      if(window.PHASE!=='menu') return;                 // alleen in het menu
      const p=document.querySelector('#nieuw');
      if(p&&p.getAttribute('visible')===true){          // al gevonden: klaar
        clearInterval(window.__vcTimer); window.__vcTimer=0; return; }
      versieCheck(); },VERSIE_ELK); }

  function versieCheck(){
    if(typeof fetch!=='function') return;
    const url=location.pathname+'?vc='+Date.now();
    fetch(url,{cache:'no-store',headers:{'Range':'bytes=0-4095'}})
      .then(function(r){ return r.ok?r.text():null; })
      .then(function(tx){
        if(!tx) return;
        const m=tx.match(/const VERSIE='([^']+)'/);
        if(!m||m[1]===VERSIE) return;
        const p=document.querySelector('#nieuw'), t=document.querySelector('#nieuwTxt');
        if(t) t.setAttribute('value',VERSIE+'   ->   '+m[1]);
        if(p) p.setAttribute('visible',true); })
      .catch(function(){}); }

  // OK: de pagina opnieuw halen zonder cache.
  function versieHerlaad(){
    try{ localStorage.removeItem('cosmic_art'); }catch(e){}
    try{ if(window.caches&&caches.keys) caches.keys().then(function(k){
      k.forEach(function(n){ caches.delete(n); }); }); }catch(e){}
    setTimeout(function(){
      location.replace(location.pathname+'?v='+Date.now()); },120); }

  let aframeWacht=0;
  function boot(){
    if(typeof AFRAME==='undefined'){
      aframeWacht+=1;
      const t=$('#pct');
      if(t&&aframeWacht>8) t.textContent='WAITING FOR A-FRAME... check internet';
      if(aframeWacht<200){ setTimeout(boot,250); return; }
      if(t) t.textContent='A-FRAME FAILED TO LOAD - refresh the page';
      return; }
    registreerCosmic();                     // vangnet: A-Frame kwam pas later binnen
    prog(20,'SCENE');
    document.body.insertAdjacentHTML('beforeend',SCENE_HTML);
    const sc=document.querySelector('a-scene');
    const klaar=function(){
      knoppen();
      const v=document.querySelector('#verTxt'); if(v) v.setAttribute('value',VERSIE);
      padenZoek(function(p){ if(p.art) artScan(p.art);
        musKandidaten=(p.muziekLijst||[]).filter(function(q){ return q!==p.music; });
        if(p.music) musScan(p.music);
        if(!p.art){ const e=document.querySelector('#artTxt');
          if(e) e.setAttribute('value','geen Art-map'); }
        if(!p.music){ const e=document.querySelector('#musTxt');
          if(e) e.setAttribute('value','geen Music-map'); } });
      prog(100,'READY');
      setTimeout(laadVolgen,200); };
    if(sc.hasLoaded) klaar();
    else sc.addEventListener('loaded',klaar);
    sc.addEventListener('renderstart',function(){ setTimeout(laadVolgen,300);
      setTimeout(versieCheck,4000); });        // rustig aan, na het opstarten
    setTimeout(function(){ if(!window.ART.totaal&&!laadOpen) laadKlaar(); },12000);  // geen art? toch door
    // ---- muis en aanraakscherm: zelfde spel zonder headset ----
    const C=function(){ const r=document.querySelector('#rig');
      return r&&r.components&&r.components.cosmic; };
    const tHand=function(){ return document.querySelector('#touchHand'); };
    // Welke kant van het scherm je aanraakt bepaalt welk wapen vuurt. De kant
    // van je gekozen hoofdhand is je hoofdwapen; de andere kant je tweede.
    const tHandVoor=function(ev){
      let x=null;
      if(ev){ if(ev.touches&&ev.touches.length) x=ev.touches[0].clientX;
        else if(ev.changedTouches&&ev.changedTouches.length) x=ev.changedTouches[0].clientX;
        else if(typeof ev.clientX==='number') x=ev.clientX; }
      if(x===null) return tHand();
      const links=(x<(window.innerWidth||640)/2);
      const hoofdLinks=(window.PRIMHAND!=='right');
      const hoofd=(links===hoofdLinks);
      return document.querySelector(hoofd?'#touchHand':'#touchHand2')||tHand(); };
    let raakt=false;
    function aan(ev){
      // Staat het laadscherm nog in beeld, dan is deze tik bedoeld om DAAR
      // doorheen te gaan — nooit om een menuknop in te drukken. De invoer van het
      // spel luistert eerder dan het laadscherm zelf, dus zonder dit slot kwam de
      // tik bij LAUNCH terecht en begon het spel meteen.
      const LS=document.querySelector('#laad');
      if(LS&&LS.style.display!=='none'){ window.NAKLIK=performance.now()+800; return; }
      if(performance.now()<(window.NAKLIK||0)) return;   // net het laadscherm weggetikt
      if(window.PARADEKLAAR){ window.PARADEKLAAR=0; naarMenu(); return; }
      const h=(window.PHASE==='game'&&!window.PAUSED&&!window.DEMO)?tHandVoor(ev):tHand();
      if(!h||!h.object3D) return;
      if(window.PHASE==='menu'||window.PAUSED){ menuKlik(h); return; }
      if(window.DEMO){
        if(performance.now()<(window.DEMOWACHT||0)) return;
        naarMenu(); return; }
      const c=C(); if(!c) return;
      if(!raakt){ raakt=true; if(c.held.indexOf(h)<0) c.held.push(h); }
      c.fire(h); }
    function uit(){ const c=C(); raakt=false; if(!c) return;
      ['#touchHand','#touchHand2'].forEach(function(id){
        const h=document.querySelector(id); if(!h) return;
        const i=c.held.indexOf(h); if(i>=0) c.held.splice(i,1); }); }
    let laatsteTik=0;
    ['touchstart','mousedown'].forEach(function(ev){
      window.addEventListener(ev,function(e){
        if(e.target&&e.target.closest&&e.target.closest('.a-enter-vr')) return;   // VR-knop met rust laten
        // Een tik op een telefoon geeft eerst touchstart en daarna nog een
        // nagebootste mousedown. De tweede binnen 600 ms negeren.
        const nu=performance.now();
        if(ev==='mousedown'&&nu-laatsteTik<600) return;
        laatsteTik=nu;
        // niet passive: zo kunnen we het kopieermenu en de zoom tegenhouden,
        // maar alleen tijdens het spelen — daarbuiten moet de browser vrij zijn
        if(ev==='touchstart'&&window.PHASE==='game'&&e.cancelable) e.preventDefault();
        aan(e); },{passive:false}); });
    // lang vasthouden, rechtermuisknop en knijpzoom leveren geen menu meer op
    ['contextmenu','gesturestart','gesturechange','selectstart','dragstart'].forEach(function(ev){
      window.addEventListener(ev,function(e){
        if(window.PHASE!=='game') return;               // menu en laadscherm vrijlaten
        if(e.target&&e.target.closest&&e.target.closest('.a-enter-vr')) return;
        if(e.cancelable) e.preventDefault(); },{passive:false}); });
    ['mouseup','touchend','touchcancel','blur'].forEach(function(ev){
      window.addEventListener(ev,function(e){
        if(ev==='touchend'&&window.PHASE==='game'&&e&&e.cancelable) e.preventDefault();
        uit(e); },{passive:false}); });
    // ---- de rondjes onderin: ult links, ult rechts, en wisselen ----
    const mobDruk=function(id,fn){
      const el=document.getElementById&&document.getElementById(id);
      if(!el) return;
      ['touchstart','mousedown'].forEach(function(ev){
        el.addEventListener(ev,function(e){
          if(e.cancelable) e.preventDefault();
          e.stopPropagation();                     // niet ook nog schieten
          const nu=performance.now();
          if(nu-(el.__t||0)<400) return; el.__t=nu;
          const c=C(); if(c) fn(c); },{passive:false}); }); };
    const hoofdEl=function(){ return (window.PRIMHAND!=='right')?'mobL':'mobR'; };
    mobDruk('mobL',function(c){
      c.ultimate(c.hands[(hoofdEl()==='mobL')?c.prim:c.spec]); });
    mobDruk('mobR',function(c){
      c.ultimate(c.hands[(hoofdEl()==='mobR')?c.prim:c.spec]); });
    mobDruk('mobW',function(c){ c.wisDeb=0; c.wissel(c.hands[c.spec]); });

    // richtkruis is buiten VR je vizier
    const sc2=document.querySelector('a-scene');
    if(sc2){ sc2.addEventListener('enter-vr',function(){ window.INVR=true;
               const L3=document.querySelector('#laad');
               if(L3) L3.style.display='none';           // hoort niet meer in de weg te zitten
               window.NAKLIK=0; });
             sc2.addEventListener('exit-vr',function(){ window.INVR=false; }); }
  }

  if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(boot,60);
  else window.addEventListener('DOMContentLoaded',function(){ setTimeout(boot,60); });

})();
