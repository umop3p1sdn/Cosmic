<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>COSMIC SHOOTER</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    html,body{margin:0;padding:0;background:#04080f;overflow:hidden;font-family:'Trebuchet MS',sans-serif;}
    #laad{position:fixed;left:0;top:0;width:100%;height:100%;z-index:9999;
      background:radial-gradient(circle at 50% 42%,#0c2036 0%,#04080f 70%);
      color:#9fe4f5;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    #laad h1{font-size:8vw;letter-spacing:0.42em;margin:0 0 0.1em 0;color:#e8f6ff;
      text-shadow:0 0 18px #35e8ff,0 0 46px #1b6f8a;font-weight:300;}
    #laad .sub{letter-spacing:0.5em;font-size:2.6vw;color:#ffb03a;margin-bottom:2.2em;}
    #bar{width:52vw;height:3px;background:#12293e;position:relative;overflow:hidden;}
    #bar i{display:block;height:100%;width:0%;background:#35e8ff;box-shadow:0 0 10px #35e8ff;}
    #pct{margin-top:1em;letter-spacing:0.3em;font-size:2vw;color:#5f9ab5;}
    #ver{position:fixed;right:12px;bottom:10px;color:#2d5b74;letter-spacing:0.2em;font-size:12px;z-index:10000;}
    #err{position:fixed;left:0;bottom:0;width:100%;max-height:38%;overflow:auto;z-index:10001;
      color:#ff6b6b;background:rgba(0,0,0,0.82);font:11px monospace;padding:5px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <div id="laad">
    <h1>COSMIC</h1>
    <div class="sub">SHOOTER</div>
    <div id="bar"><i></i></div>
    <div id="pct">BOOTING 0%</div>
  </div>
  <div id="ver">v1.0</div>
  <div id="err"></div>

<script>
(function(){
  'use strict';
  const VERSIE='v9.9';
  const $=function(s){ return document.querySelector(s); };
  document.getElementById('ver').textContent=VERSIE;

  // ---- foutmelding altijd in beeld (Quest heeft geen console) ----
  const EL=document.getElementById('err');
  function fout(m){ try{ EL.textContent+=m+'\n'; }catch(e){} }
  window.onerror=function(m,u,l){ fout('ERR '+m+' @'+l); };
  const echtLog=console.log.bind(console);
  console.log=function(){ try{ echtLog.apply(null,arguments); }catch(e){} };

  let PROG=0;
  function prog(p,txt){ PROG=Math.max(PROG,p);
    const b=$('#bar i'), t=$('#pct');
    if(b) b.style.width=PROG+'%';
    if(t) t.textContent=(txt||'BOOTING')+' '+Math.round(PROG)+'%'; }
  function laadWeg(){ const l=$('#laad'); if(l) l.style.display='none'; }

  window.PHASE='menu'; window.PAUSED=false; window.PRIMHAND='left';

  // =========================================================
  //  GELUID
  // =========================================================
  let A=null,MASTER=null,DUCK=null,DELAY=null,LIM=null,DRONE=null;
  function AC(){ if(A) return A; A=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=A.createGain(); MASTER.gain.value=0.5;
    LIM=A.createDynamicsCompressor();
    LIM.threshold.value=-10; LIM.knee.value=6; LIM.ratio.value=20;
    LIM.attack.value=0.002; LIM.release.value=0.25;
    const eindG=A.createGain(); eindG.gain.value=0.8;
    const MUUR=A.createWaveShaper();                     // kan wiskundig niet boven 0.92 uitkomen
    { const N=2048, crv=new Float32Array(N), K=1.4, T=Math.tanh(K);
      for(let i=0;i<N;i++){ const x=(i/(N-1))*2-1; crv[i]=0.92*Math.tanh(x*K)/T; }
      MUUR.curve=crv; MUUR.oversample='2x'; }
    MASTER.connect(MUUR);
    LIM.connect(eindG); eindG.connect(MUUR); MUUR.connect(A.destination);
    DUCK=A.createGain(); DUCK.gain.value=1; DUCK.connect(MASTER);
    DELAY=A.createDelay(1.2); DELAY.delayTime.value=0.32;
    const fb=A.createGain(); fb.gain.value=0.40;
    const fl=A.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=3200;
    const dw=A.createGain(); dw.gain.value=0.5;
    DELAY.connect(fl).connect(fb).connect(DELAY); DELAY.connect(dw).connect(DUCK);
    return A; }

  let SFX=null, SFXSEQ=0;
  const SFXT={};
  function sfxOk(max){ const n=performance.now(); SFXT.q=(SFXT.q||[]).filter(function(t){ return n-t<100; });
    if(SFXT.q.length>=max*2) return false; SFXT.q.push(n); return true; }
  function initSFX(){ if(SFX) return SFX; const a=AC();
    SFX=a.createGain(); SFX.gain.value=0.9; SFX.connect(LIM);
    const fas=a.createBiquadFilter(); fas.type='allpass'; fas.frequency.value=800;
    const lfo=a.createOscillator(), lg=a.createGain();
    lfo.frequency.value=0.11; lg.gain.value=620;
    lfo.connect(lg).connect(fas.frequency); lfo.start();
    fas.connect(SFX); SFX.fas=fas;
    return SFX; }
  function pan(p){ const a=AC(); const n=a.createStereoPanner?a.createStereoPanner():null;
    if(n) n.pan.value=Math.max(-1,Math.min(1,p||0)); return n; }
  function naar(node,p){ const S=initSFX(), pp=pan(p);
    if(pp){ node.connect(pp); pp.connect(S.fas); } else node.connect(S.fas); }

  function gunSnd(p,kleur){ if(!sfxOk(3)) return; const a=AC(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
    o.type='sawtooth'; o.frequency.setValueAtTime(340+(kleur||0)*90,t);
    o.frequency.exponentialRampToValueAtTime(58,t+0.11);
    f.type='lowpass'; f.frequency.setValueAtTime(2600,t); f.frequency.exponentialRampToValueAtTime(420,t+0.12);
    g.gain.setValueAtTime(0.34,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(f).connect(g); naar(g,p); o.start(t); o.stop(t+0.17);
    const n=a.createBufferSource(), nb=a.createBuffer(1,1200,a.sampleRate), d=nb.getChannelData(0);
    for(let i=0;i<1200;i++) d[i]=(Math.random()*2-1)*(1-i/1200);
    n.buffer=nb; const ng=a.createGain(); ng.gain.value=0.16;
    n.connect(ng); naar(ng,p); n.start(t); }

  function hitSnd(p,prog2){ if(!sfxOk(5)) return; const a=AC(), t=a.currentTime; SFXSEQ++;
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(180+prog2*260,t);
    o.frequency.exponentialRampToValueAtTime(70,t+0.09);
    g.gain.setValueAtTime(0.20,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.11);
    o.connect(g); naar(g,p); o.start(t); o.stop(t+0.12); }

  function killSnd(p,size){ if(!sfxOk(6)) return; const a=AC(), t=a.currentTime; SFXSEQ++;
    const n=a.createBufferSource(), L=Math.floor(a.sampleRate*0.30), nb=a.createBuffer(1,L,a.sampleRate), d=nb.getChannelData(0);
    for(let i=0;i<L;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.2);
    n.buffer=nb;
    const f=a.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(1500/Math.max(0.6,size),t);
    f.frequency.exponentialRampToValueAtTime(160,t+0.28); f.Q.value=0.8;
    const g=a.createGain(); g.gain.setValueAtTime(0.30*Math.min(2,size),t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
    n.connect(f).connect(g); naar(g,p);
    if(DELAY) g.connect(DELAY);
    n.start(t);
    if(size>1.4){ const o=a.createOscillator(), og=a.createGain();
      o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(28,t+0.4);
      og.gain.setValueAtTime(0.4,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.45);
      o.connect(og); naar(og,p); o.start(t); o.stop(t+0.5); } }

  function boomSnd(p){ if(!sfxOk(4)) return; const a=AC(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(34,t+0.22);
    g.gain.setValueAtTime(0.42,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.26);
    o.connect(g); naar(g,p); o.start(t); o.stop(t+0.28); }

  function lazSnd(p,k,n){ const a=AC(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
    o.type='sawtooth';
    const f0=900+ (k/Math.max(1,n))*1500;                 // kruipt per flits omhoog
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*0.55,t+0.05);
    f.type='bandpass'; f.frequency.value=f0*1.2; f.Q.value=3.5;
    g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(f).connect(g); naar(g,p); o.start(t); o.stop(t+0.07); }

  function alarmSnd(){ const a=AC(), t=a.currentTime;
    for(let k=0;k<2;k++){ const o=a.createOscillator(), g=a.createGain();
      o.type='square'; o.frequency.setValueAtTime(k?300:220,t+k*0.16);
      g.gain.setValueAtTime(0.0001,t+k*0.16);
      g.gain.linearRampToValueAtTime(0.22,t+k*0.16+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+k*0.16+0.20);
      o.connect(g); naar(g,0); o.start(t+k*0.16); o.stop(t+k*0.16+0.22); } }

  const RAT={};
  function ratelAan(id){ const a=AC(); let r=RAT[id];
    if(!r){ const g=a.createGain(); g.gain.value=0; naar(g,0);
      const o=a.createOscillator(); o.type='square'; o.frequency.value=62;
      const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=1.2;
      o.connect(f).connect(g); o.start();
      r=RAT[id]={g:g,tot:0}; }
    const t=a.currentTime;
    r.g.gain.cancelScheduledValues(t);
    r.g.gain.setValueAtTime(0.16,t);
    r.g.gain.setTargetAtTime(0.0001,t+0.02,0.055); }

  function zeg(txt){ try{ const ss=window.speechSynthesis; if(!ss) return;
    const u=new SpeechSynthesisUtterance(txt); u.rate=1.05; u.pitch=0.9; u.volume=0.75;
    ss.cancel(); ss.speak(u); }catch(e){} }

  function startDrone(){ if(DRONE) return; const a=AC();
    DRONE=a.createGain(); DRONE.gain.value=0.0001; DRONE.connect(MASTER);
    DRONE.gain.linearRampToValueAtTime(0.12,a.currentTime+4);
    [55,82.5,110,164.8].forEach(function(fq,i){
      const o=a.createOscillator(); o.type=i>1?'sine':'sawtooth'; o.frequency.value=fq;
      const g=a.createGain(); g.gain.value=i>1?0.10:0.16;
      const lf=a.createOscillator(), lg=a.createGain();
      lf.frequency.value=0.03+i*0.017; lg.gain.value=fq*0.006;
      lf.connect(lg).connect(o.frequency); lf.start();
      const fi=a.createBiquadFilter(); fi.type='lowpass'; fi.frequency.value=520;
      o.connect(g).connect(fi).connect(DRONE); o.start(); }); }

  function wakeAan(){ try{ if(!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function(w){ window.WAKE=w;
      w.addEventListener('release',function(){ window.WAKE=null; }); }).catch(function(){});
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible'&&!window.WAKE&&navigator.wakeLock)
        navigator.wakeLock.request('screen').then(function(w){ window.WAKE=w; }).catch(function(){}); });
  }catch(e){} }

  // ---- muziek uit Cosmic/music van de repo; namen doen er niet toe, volgorde is alfabetisch ----
  let MUSBASE=null, MUSAPI=null;
  let PLAY=[], PIDX=0, CUR=null, ANA=null, ANAD=null, MUSBRON=null;
  function musToon(){ const e=$('#musTxt'); if(!e) return;
    if(!PLAY.length){ e.setAttribute('value','searching...'); e.setAttribute('color','#c08a5a'); return; }
    e.setAttribute('value',PLAY.length+' track'+(PLAY.length>1?'s':'')+': '+PLAY[0].n);
    e.setAttribute('color','#6ad1a0'); }
  function musScan(pad){
    if(!pad) return;
    MUSBASE=basisVoor(pad);
    MUSAPI=API+pad.split('/').map(encodeURIComponent).join('/');
    let cache=null;
    try{ const r=localStorage.getItem('cosmic_music'); if(r) cache=JSON.parse(r); }catch(e){}
    if(cache&&cache.length){ PLAY=cache.map(function(n){ return {n:n,u:MUSBASE+encodeURIComponent(n)}; }); musToon(); }
    if(typeof fetch!=='function') return;
    fetch(MUSAPI).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(!j||!j.length) return;
      const nm=j.filter(function(f){ return /\.(mp3|m4a|wav|ogg|aac)$/i.test(f.name||''); })
                .map(function(f){ return f.name; }).sort();
      if(!nm.length) return;
      try{ localStorage.setItem('cosmic_music',JSON.stringify(nm)); }catch(e){}
      PLAY=nm.map(function(n){ return {n:n,u:MUSBASE+encodeURIComponent(n)}; });
      musToon();
      if(window.PHASE!=='menu'&&!CUR) playAt(0);      // scan kwam pas na de start binnen
    }).catch(function(){}); }
  function playAt(i){
    if(!PLAY.length) return false;
    PIDX=((i%PLAY.length)+PLAY.length)%PLAY.length;
    try{
      if(CUR){ try{ CUR.pause(); }catch(e){} }
      CUR=new Audio(); CUR.crossOrigin='anonymous'; CUR.src=PLAY[PIDX].u;
      CUR.preload='auto'; CUR.volume=1;
      CUR.addEventListener('ended',function(){ playAt(PIDX+1); });
      CUR.addEventListener('error',function(){ if(PLAY.length>1) playAt(PIDX+1); else startDrone(); });
      const a=AC();
      try{ MUSBRON=a.createMediaElementSource(CUR);
        ANA=a.createAnalyser(); ANA.fftSize=256; ANAD=new Uint8Array(ANA.frequencyBinCount);
        MUSBRON.connect(ANA); ANA.connect(MASTER);            // muziek direct op master: schoten drukken hem niet weg
      }catch(e){ /* geen webaudio-route: gewoon afspelen */ }
      if(DRONE){ try{ DRONE.gain.linearRampToValueAtTime(0.0001,a.currentTime+2); }catch(e){} }
      const p=CUR.play(); if(p&&p.catch) p.catch(function(){});
      const e2=$('#musTxt'); if(e2) e2.setAttribute('value','\u25b6 '+PLAY[PIDX].n);
      return true;
    }catch(e){ return false; } }
  function muziekStart(){ AC(); if(!playAt(0)) startDrone(); }
  function beat(){ if(!ANA||!ANAD) return 0;
    try{ ANA.getByteFrequencyData(ANAD);
      let s=0; for(let i=1;i<7;i++) s+=ANAD[i];
      return (s/6)/255; }catch(e){ return 0; } }

  window.SND={gun:gunSnd,hit:hitSnd,kill:killSnd,boom:boomSnd,alarm:alarmSnd,laz:lazSnd,
    ratel:ratelAan,zeg:zeg,AC:AC,initSFX:initSFX,drone:startDrone,wake:wakeAan,
    muziek:muziekStart,beat:beat,
    scan:function(){ padenZoek(function(p){ if(p.music) musScan(p.music); }); },
    volgende:function(){ if(PLAY.length) playAt(PIDX+1); }};
  prog(12,'AUDIO');

  // =========================================================
  //  ART — losse platen uit Cosmic/art van de repo umop3p1sdn/VR
  //  Namen doen er niet toe: herkenning gaat op verhouding.
  //  Panorama (breed) = de nevel achter alles; vierkant = los hemelobject.
  // =========================================================
  const REPO='umop3p1sdn/Cosmic';
  const RAW='https://raw.githubusercontent.com/'+REPO+'/main/';
  const API='https://api.github.com/repos/'+REPO+'/contents/';
  let ARTBASE=null, APIURL=null;

  // Draait het spel op github.io in diezelfde repo, dan is een relatief pad
  // dezelfde herkomst: geen CORS, en het canvas blijft leesbaar voor het opmeten.
  function basisVoor(pad){
    const p=pad.split('/').map(encodeURIComponent).join('/');
    try{ if(location&&/github\.io$/i.test(location.hostname||'')) return p+'/'; }catch(e){}
    return RAW+p+'/'; }

  // Hoofdletters en spaties in mapnamen zijn al twee keer misgegaan.
  // Daarom eerst Cosmic uitlezen en zelf zien hoe de mappen heten.
  function padenZoek(klaar){
    let p=null;
    try{ const r=localStorage.getItem('cosmic_paden'); if(r) p=JSON.parse(r); }catch(e){}
    if(p) klaar(p);
    if(typeof fetch!=='function') return;
    fetch(API).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(!j||!j.length) return;
      const uit={art:null,music:null};
      j.forEach(function(f){ if(f.type!=='dir') return;
        const n=String(f.name||'').trim().toLowerCase();
        if(n==='art') uit.art=f.path;
        if(n==='music') uit.music=f.path; });
      if(!uit.art&&!uit.music) return;
      if(p&&p.art===uit.art&&p.music===uit.music) return;      // niets veranderd
      try{ localStorage.setItem('cosmic_paden',JSON.stringify(uit)); }catch(e){}
      klaar(uit); }).catch(function(){}); }
  window.ART={pano:null,panos:[],objs:[],schepen:[],vondst:'-',bezig:false};

  function artLaad(url,cb){ try{
    const L=new THREE.TextureLoader(); L.setCrossOrigin('anonymous');
    if(L.setPath) L.setPath('');
    L.load(url,function(t){ cb(t); },undefined,function(){ cb(null); });
  }catch(e){ cb(null); } }

  function artVerwerk(lijst){
    let klaar=0; const n=lijst.length;
    if(!n){ window.ART.vondst='geen art'; return; }
    window.ART.vondst='laden '+n;
    lijst.forEach(function(nm){
      artLaad(ARTBASE+encodeURIComponent(nm),function(t){
        klaar++;
        if(t&&t.image&&t.image.width){
          const ar=t.image.width/t.image.height;
          if(ar>=1.7){ window.ART.panos.push(t);
            if(!window.ART.pano||t.image.width>(window.ART.pano.image.width||0)) window.ART.pano=t; }
          else if(ar>=0.55&&ar<=1.05){                       // staande of vierkante plaat = de vloot
            window.ART.schepen.push(t); }
          else window.ART.objs.push(t);
          if(window.ART.nieuw) window.ART.nieuw(); }
        if(klaar>=n) window.ART.vondst=(window.ART.schepen?'fleet ':'')+(window.ART.pano?'sky ':'')+
          window.ART.objs.length+' obj'; }); }); }

  function artScan(pad){
    if(!pad) return;
    ARTBASE=basisVoor(pad);
    APIURL=API+pad.split('/').map(encodeURIComponent).join('/');
    if(window.ART.bezig) return; window.ART.bezig=true;
    let cache=null;
    try{ const raw=localStorage.getItem('cosmic_art'); if(raw) cache=JSON.parse(raw); }catch(e){}
    if(cache&&cache.length){ artVerwerk(cache); }
    if(typeof fetch!=='function') return;
    fetch(APIURL).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(!j||!j.length) return;
      const nm=j.filter(function(f){ return /\.(png|jpg|jpeg|webp)$/i.test(f.name||''); })
                .map(function(f){ return f.name; });
      if(!nm.length) return;
      try{ localStorage.setItem('cosmic_art',JSON.stringify(nm)); }catch(e){}
      if(!cache||cache.join()!==nm.join()){ window.ART.objs.length=0; window.ART.pano=null; artVerwerk(nm); }
    }).catch(function(){}); }
  window.artScan=artScan;

  // =========================================================
  //  DE VLOOT — op canvas getekend, 4x4-atlas 2048px
  //  vak 0-7 = heel, vak 8-15 = beschadigd (zelfde volgorde)
  //  Een geleverde 4x4-plaat kan hier later zo overheen.
  // =========================================================
  const VLOOT=[
    {n:'SCOUT',    c:'#35e8ff', c2:'#0d3f52'},
    {n:'FIGHTER',  c:'#6ce2a0', c2:'#0e402c'},
    {n:'BOMBER',   c:'#ffb03a', c2:'#4a2f0a'},
    {n:'DRONE',    c:'#b06cff', c2:'#2c1650'},
    {n:'SAUCER',   c:'#ff3d81', c2:'#4c0d29'},
    {n:'WASP',     c:'#ffe45c', c2:'#463c08'},
    {n:'HEAVY',    c:'#ff6a3d', c2:'#4a1b0c'},
    {n:'MOTHER',   c:'#e8f6ff', c2:'#123246'}
  ];

  function mkAtlas(){
    const S=512, C=document.createElement('canvas'); C.width=2048; C.height=2048;
    const g=C.getContext('2d');
    g.clearRect(0,0,2048,2048);

    function vorm(pts,cx,cy,R,fill,lijn,lw,dicht){
      g.beginPath();
      for(let i=0;i<pts.length;i++){ const p=pts[i], x=cx+p[0]*R, y=cy+p[1]*R;
        if(i===0) g.moveTo(x,y); else g.lineTo(x,y); }
      if(dicht!==false) g.closePath();
      if(fill){ g.fillStyle=fill; g.fill(); }
      if(lijn){ g.strokeStyle=lijn; g.lineWidth=lw||6; g.shadowColor=lijn; g.shadowBlur=26;
        g.stroke(); g.shadowBlur=0; } }

    function spiegel(pts){ return pts.map(function(p){ return [-p[0],p[1]]; }); }

    function gloedBol(cx,cy,r,col,kern){
      const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
      gr.addColorStop(0,kern||'#ffffff'); gr.addColorStop(0.35,col);
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,r,0,6.2832); g.fill(); }

    function motor(cx,cy,r,col){ gloedBol(cx,cy,r,col,'#ffffff'); }

    // ---- de acht silhouetten, frontaal en iets van boven gezien ----
    const TEKEN=[
      function(cx,cy,R,V){                                   // 0 SCOUT: smalle pijl

    function schade(cx,cy,R,V,zaad){
      let s=zaad*9301+49297;
      function rnd(){ s=(s*9301+49297)%233280; return s/233280; }

      g.globalCompositeOperation='destination-out';                 // echte gaten
      for(let k=0;k<5;k++){ const a=rnd()*6.2832, d=R*(0.25+rnd()*0.55);

      g.restore();

        const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d, r=R*(0.10+rnd()*0.16);
        const gr=g.createRadialGradient(x,y,0,x,y,r);

        gr.addColorStop(0.7,'rgba(220,60,20,0.55)'); gr.addColorStop(1,'rgba(0,0,0,0)');

      for(let k=0;k<3;k++){ const a=rnd()*6.2832;

  function mkGloed(kern,rand,scherp){
    const C=document.createElement('canvas'); C.width=C.height=128;
    const g=C.getContext('2d');
    const gr=g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,kern); gr.addColorStop(scherp||0.30,rand);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(0,0,128,128);
    const t=new THREE.CanvasTexture(C); t.needsUpdate=true; return t; }

  function mkStreep(){                                    // langwerpige kogel: kop + staart
    const C=document.createElement('canvas'); C.width=64; C.height=256;
    const g=C.getContext('2d');
    const gr=g.createLinearGradient(0,0,0,256);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(0.30,'rgba(255,255,255,0.85)');
    gr.addColorStop(0.62,'#ffffff');
    gr.addColorStop(0.80,'rgba(255,255,255,0.55)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.fillRect(18,0,28,256);
    const gz=g.createRadialGradient(32,158,0,32,158,32);
    gz.addColorStop(0,'#ffffff'); gz.addColorStop(0.4,'rgba(255,255,255,0.6)');
    gz.addColorStop(1,'rgba(255,255,255,0)');

    const t=new THREE.CanvasTexture(C); t.needsUpdate=true; return t; }

  function mkSterren(){
    const C=document.createElement('canvas'); C.width=C.height=1024;
    const g=C.getContext('2d');
    g.fillStyle='#02050c'; g.fillRect(0,0,1024,1024);
    for(let i=0;i<1400;i++){ const x=Math.random()*1024, y=Math.random()*1024,
      r=Math.random()<0.93?Math.random()*1.1+0.3:Math.random()*2.4+1.2,
      h=[ '#ffffff','#cfe8ff','#ffe2c0','#a8d8ff' ][Math.floor(Math.random()*4)];
      g.globalAlpha=0.25+Math.random()*0.75; g.fillStyle=h;
      g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill(); }
    g.globalAlpha=1;
    for(let i=0;i<5;i++){                                  // wat verre nevelvlekken
      const x=Math.random()*1024, y=Math.random()*1024, r=140+Math.random()*220;
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      const c=['rgba(40,90,160,0.20)','rgba(120,50,150,0.16)','rgba(30,120,130,0.16)'][i%3];
      gr.addColorStop(0,c); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
    const t=new THREE.CanvasTexture(C); t.needsUpdate=true; return t; }

  let KLIKT=0;
  function menuKlik(h){
    if(!h||!h.object3D) return;
    const nu=performance.now(); if(nu-KLIKT<250) return; KLIKT=nu;
    const o=new THREE.Vector3(), q=new THREE.Quaternion();
    h.object3D.getWorldPosition(o); h.object3D.getWorldQuaternion(q);
    const d=new THREE.Vector3(0,-0.7071,-0.7071).applyQuaternion(q).normalize();
    if(Math.abs(d.z)<0.002) return;
    let best=null, bt=1e9; const wp=new THREE.Vector3();
    document.querySelectorAll('.menu-btn').forEach(function(el){
      if(!el.object3D) return;
      let p=el.object3D, zicht=true;
      while(p){ if(p.visible===false){ zicht=false; break; } p=p.parent; }
      if(!zicht) return;
      const w=parseFloat(el.getAttribute('width'))||1, hh=parseFloat(el.getAttribute('height'))||1;
      el.object3D.getWorldPosition(wp);
      const t=(wp.z-o.z)/d.z; if(t<=0.1||t>=bt) return;
      const px=o.x+d.x*t, py=o.y+d.y*t;
      if(Math.abs(px-wp.x)<=w*0.6&&Math.abs(py-wp.y)<=hh*0.85){ bt=t; best=el; } });
    if(best) best.emit('click'); }

    // ---- banden zoeken in een dekkingsprofiel (aaneengesloten stukken met inkt) ----

    // ---- de plaat zelf opmeten: geen vast raster, maar zoeken waar de inkt staat ----
    meetPlaat:function(tex){
      const img=tex.image; if(!img||!img.width) return null;
      const W=img.width, H=img.height;
      let Wv=W, Hv=H;                                  // maat van de textuur die we uiteindelijk gebruiken
      let kol=null, rij=null, hoe='raster', pix=null;
      try{
        const c=document.createElement('canvas'); c.width=W; c.height=H;
        const g=c.getContext('2d'); g.drawImage(img,0,0);
        const d=g.getImageData(0,0,W,H).data; pix=d;
        const cp=new Uint32Array(W);
        for(let y=0;y<H;y++){ const o=y*W*4;
          for(let x=0;x<W;x++) if(d[o+x*4+3]>100) cp[x]++; }
        const k=this.banden(cp,2,Math.max(6,W*0.02));
        if(k.length>=2){
          // Rijen scheiden vaak niet op de hele plaat: brede vleugels en rook raken
          // de buurman. Daarom per kolom tellen en de kolom nemen die het netst
          // scheidt (meestal de smalle projectielkolom) als liniaal.
          let best=null, bprof=null;
          for(let ci=0;ci<k.length;ci++){
            const rp=new Uint32Array(H);
            for(let y=0;y<H;y++){ const o=y*W*4;
              for(let x=k[ci][0];x<=k[ci][1];x++) if(d[o+x*4+3]>100) rp[y]++; }
            const r=this.banden(rp,0,Math.max(4,H*0.008));
            if(!best||r.length>best.length){ best=r; bprof=rp; } }
          // Op een krappe plaat raken twee rijen elkaar en tellen ze als één band.
          // Een band die veel hoger is dan de mediaan wordt gesplitst op zijn diepste dal.
          if(best&&best.length>=2){
            const hs=best.map(function(b){ return b[1]-b[0]+1; }).sort(function(a2,b2){ return a2-b2; });
            const med=hs[Math.floor(hs.length/2)]||1;
            const los=[];
            for(let i=0;i<best.length;i++){
              const y0=best[i][0], y1=best[i][1], hh=y1-y0+1;
              const n=Math.max(1,Math.floor(hh/med+0.40));
              if(n===1){ los.push([y0,y1]); continue; }
              const gr=[y0];
              for(let q=1;q<n;q++){
                const mid=Math.floor(q*hh/n);
                const lo=Math.max(1,mid-Math.floor(hh*0.14));
                const hi=Math.min(hh-1,mid+Math.floor(hh*0.14));
                let bi=lo, bv=1e9;
                for(let y=lo;y<hi;y++) if(bprof[y0+y]<bv){ bv=bprof[y0+y]; bi=y; }
                gr.push(y0+bi); }
              gr.push(y1);
              for(let q=0;q<gr.length-1;q++) los.push([gr[q]+(q?1:0),gr[q+1]]); }
            best=los; }
          if(best&&best.length>=2){
            // elke rij oprekken tot halverwege de buren, zodat brede schepen er
            // helemaal in vallen; boven en onder even ver als aan de binnenkant
            rij=[];
            for(let i=0;i<best.length;i++){
              const b=best[i];
              const bov=(i===0)?Math.max(0,b[0]-Math.round((best[1][0]-b[1])/2))
                              :Math.round((best[i-1][1]+b[0])/2);
              const ond=(i===best.length-1)?Math.min(H-1,b[1]+Math.round((b[0]-best[i-1][1])/2))
                              :Math.round((b[1]+best[i+1][0])/2);
              rij.push([bov,ond]); }
            kol=k; hoe='gemeten '+k.length+'x'+rij.length; } }
      }catch(e){ /* plaat van een ander domein: dan het vaste raster */ }
      if(!kol){ kol=[]; for(let i=0;i<4;i++) kol.push([Math.round(i*W/4),Math.round((i+1)*W/4)-1]);
                rij=[]; for(let i=0;i<6;i++) rij.push([Math.round(i*H/6),Math.round((i+1)*H/6)-1]); }
      const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:0.06,
        side:THREE.DoubleSide,depthWrite:false});
      const P={tex:tex,mat:mat,rect:{},hoe:hoe,kol:kol,rij:rij,rijen:rij.length,data:pix};
      for(let rr=0;rr<rij.length;rr++){
        const r=rij[rr]; P.rect[rr]=[];
        for(let c=0;c<4;c++){ const k=kol[c];
          const bx=(k[1]-k[0]+1), by=(r[1]-r[0]+1);
          const R={u0:k[0]/W, u1:(k[1]+1)/W, v0:1-(r[1]+1)/H, v1:1-r[0]/H, ar:bx/by};
          if(c===3){
            // Projectielen kunnen liggend of staand getekend zijn. Ligt het plaatje,
            // dan draaien we de uv een kwartslag zodat de neus de vliegrichting op wijst.
            R.draai=(R.ar>1.3)?1:0;
            if(R.draai&&P.data) R.kop=this.kopKant(P.data,W,k,r);
            R.arv=R.draai?(1/R.ar):R.ar; }
          P.rect[rr].push(R); } }
      return P; },

    // ---- een aangeleverde hemel bruikbaar maken, wat er ook binnenkomt ----
    hemelBereid:function(tex){
      const img=tex.image; if(!img||!img.width) return null;
      const W=img.width, H=img.height;
      let Wv=W, Hv=H;                                  // maat van de textuur die we uiteindelijk gebruiken
      let x0=0,x1=W-1,y0=0,y1=H-1, naad=0, buur=1, klaar=tex;
      try{
        const c=document.createElement('canvas'); c.width=W; c.height=H;
        const g=c.getContext('2d'); g.drawImage(img,0,0);
        const d=g.getImageData(0,0,W,H).data;
        const helder=function(x,y){ const o=(y*W+x)*4; return (d[o]+d[o+1]+d[o+2])/3; };
        // zwarte randen wegsnijden (sommige platen hebben een lijst eromheen)
        const rijLicht=new Float32Array(H), kolLicht=new Float32Array(W);
        for(let y=0;y<H;y+=2) for(let x=0;x<W;x+=2){
          const v=helder(x,y); rijLicht[y]+=v; kolLicht[x]+=v; }
        const dr=8;
        while(x0<W*0.3&&kolLicht[x0-(x0%2)]/(H/2)<dr) x0+=2;
        while(x1>W*0.7&&kolLicht[x1-(x1%2)]/(H/2)<dr) x1-=2;
        while(y0<H*0.3&&rijLicht[y0-(y0%2)]/(W/2)<dr) y0+=2;
        while(y1>H*0.7&&rijLicht[y1-(y1%2)]/(W/2)<dr) y1-=2;
        // hoe erg is de naad tussen de linker- en rechterrand?
        let s1=0,s2=0,n=0;
        for(let y=y0;y<=y1;y+=3){
          s1+=Math.abs(helder(x0,y)-helder(x1,y));
          s2+=Math.abs(helder(x0+1,y)-helder(x0,y)); n++; }
        naad=s1/Math.max(1,n); buur=Math.max(0.5,s2/Math.max(1,n));
        if(naad>buur*3&&naad>8){
          // rand overvloeien zodat je de overgang niet ziet
          const bw=x1-x0+1, bh=y1-y0+1, K=Math.max(8,Math.round(bw*0.07));
          const c2=document.createElement('canvas'); c2.width=bw; c2.height=bh;
          const g2=c2.getContext('2d');
          g2.drawImage(img,x0,y0,bw,bh,0,0,bw,bh);
          g2.save(); g2.globalCompositeOperation='source-over';
          for(let i=0;i<K;i++){
            const f=i/(K-1);
            g2.globalAlpha=(1-f)*0.5;
            g2.drawImage(img,x1-K+i,y0,1,bh, i,0,1,bh);          // rechterrand in de linker
            g2.globalAlpha=f*0.5;
            g2.drawImage(img,x0+i,y0,1,bh, bw-K+i,0,1,bh); }     // en omgekeerd
          g2.restore();
          klaar=new THREE.CanvasTexture(c2);
          x0=0; y0=0; x1=bw-1; y1=bh-1;
          Wv=bw; Hv=bh; }                              // de nieuwe plaat is het bijgesneden stuk
      }catch(e){ /* plaat van een ander domein: dan onbewerkt */ }
      const bw=x1-x0+1, bh=y1-y0+1;
      const arb=bw/bh;
      const ru=Math.min(1,2/Math.max(0.5,arb)), rv=Math.min(1,arb/2);
      if(klaar.repeat&&klaar.offset){
        klaar.wrapS=THREE.RepeatWrapping; klaar.wrapT=THREE.ClampToEdgeWrapping;
        klaar.repeat.set((bw/Wv)*ru,(bh/Hv)*rv);
        klaar.offset.set(x0/Wv,(y0/Hv)+(bh/Hv)*(1-rv)/2);
        klaar.needsUpdate=true; }
      return {tex:klaar, breed:(arb>2.4), ar:arb,
              basisU:x0/Wv, spanU:(bw/Wv)*ru, naad:naad, buur:buur,
              rand:(x0>0||y0>0||x1<W-1||y1<H-1)}; },

    // ---- kogel richten: staat altijd met de neus vooruit én naar de camera gekeerd ----
    richtQuad:function(m,p,dir,len,br){
      const R=this.RQ||(this.RQ={x:new THREE.Vector3(),y:new THREE.Vector3(),
        z:new THREE.Vector3(),e:new THREE.Vector3(0,1.6,0),op:new THREE.Vector3(),
        M:new THREE.Matrix4()});
      R.z.subVectors(R.e,p).normalize();
      R.y.copy(dir).normalize();
      // vliegt hij vrijwel recht op je af (of van je weg)? dan is er geen richting
      // om langs te draaien -> rechtop zetten en korter maken i.p.v. laten tollen
      const k=Math.abs(R.y.dot(R.z));
      let vk=0;
      if(k>0.55){ vk=Math.min(1,(k-0.55)/0.35);

      R.x.crossVectors(R.y,R.z);
      if(R.x.lengthSq()<1e-6) R.x.set(1,0,0); else R.x.normalize();

      R.M.makeBasis(R.x,R.y,R.z);
      m.quaternion.setFromRotationMatrix(R.M);
      m.position.copy(p);
      const L=len+(br*1.7-len)*vk;                 // van streep naar kopse kant
      m.scale.set(br,L,1); },

    // ---- de vier seconden zelf ----
    doodBaan:function(e,s){

      // dan zijwaarts langs je heen, loodrecht op de kijklijn

      // hoek blijft binnen +/-90 graden, anders klapt de meting om en flipt hij elk frame
      const hoek=Math.atan2(e.p.x,Math.max(1,-e.p.z));

      e.flipT=(e.flipT||0)-s;
      if(e.flipT<=0&&Math.abs(hoek)>grens){          // te ver opzij: keren, en dichterbij terug

        e.stap=Math.min(2,e.stap+1); e.overs=(e.overs||0)+1; }
      e.bT=(e.bT||0)-s;

    // ---- vaste rondvlucht: van punt naar punt, en dan weer van voren af aan ----
    routeBaan:function(e,s,sp){
      const R=ROUTES[e.route]; if(!R){ e.stijl='halte'; return; }
      const p=R[e.rp%R.length];
      const d=this.RT||(this.RT=new THREE.Vector3());

    // ---- gedragsprofielen: alleen de zijwaartse beweging verschilt ----
    profiel:function(e,s,naar,afst,sp){
      const zij=(e.mode==='nader')?0.55:1.0;
      const P=e.prof;

      if(P==='sluiper'){                              // sluipwesp: sprong, 2s stil, sprong
        e.ex.h=(e.ex.h||0)-s;
        if(e.ex.h<=0){
          if(e.ex.spr){ e.ex.spr=0; e.ex.h=2.0;       // aangekomen: 2 seconden hangen
            e.ex.tel=(e.ex.tel||0)+1;
            if(e.ex.tel%(2+Math.floor(Math.random()*2))===0) this.spuw(e,1,0.05); }
          else { e.ex.spr=1; e.ex.h=0.5;              // nieuwe plek kiezen
            e.ex.dx=(Math.random()-0.5)*46-e.p.x;
            e.ex.dy=(1.6+(Math.random()*16-6))-e.p.y; } }
        if(e.ex.spr){ e.p.x+=e.ex.dx*s/0.5; e.p.y+=e.ex.dy*s/0.5; } }

      else if(P==='formatie'){
        if(e.form&&e.form.lead&&e.form.lead.live){    // vleugel volgt de punt

          e.p.x+=((L.p.x+e.form.ox)-e.p.x)*Math.min(1,s*3.5);
          e.p.y+=((L.p.y+e.form.oy)-e.p.y)*Math.min(1,s*3.5);
          e.p.z+=((L.p.z+e.form.oz)-e.p.z)*Math.min(1,s*3.5);
          e.mode=L.mode; e.stap=L.stap; }
        else { e.form=null; e.p.x+=Math.cos(e.t*0.9)*7*s*zij; } }

      else if(P==='strafer'){ e.p.x+=Math.cos(e.t*0.55+e.i0)*26*s*zij;
                              e.p.y+=Math.sin(e.t*0.7)*5*s*zij; }

      else if(P==='cirkel'){ e.ex.a=(e.ex.a||e.i0)+s*0.85;
                             e.p.x+=Math.cos(e.ex.a)*22*s*zij;
                             e.p.y+=Math.sin(e.ex.a*0.7)*9*s*zij; }

      else if(P==='kruiper'){ e.p.y+=Math.sin(e.t*0.5)*3*s*zij;
                              e.p.x+=Math.cos(e.t*0.35)*4*s*zij; }

      else if(P==='duiker'){                          // valt aan tot vlakbij en trekt terug
        if(!e.ex.f) e.ex.f=1;
        if(e.ex.f===1){ if(afst>10+e.r) e.p.addScaledVector(naar,sp*1.5*s);

        else { e.p.addScaledVector(naar,-sp*1.1*s);
               if(afst>AFST[Math.min(2,e.stap)]+e.r) e.ex.f=1; }
        e.p.x+=Math.sin(e.t*3.0)*7*s; }

      else if(P==='drijver'){ e.p.x+=Math.cos(e.t*0.3)*2.5*s; }

      // ---- manoeuvres uit het echte luchtgevecht ----

      else if(P==='immel'){
        // IMMELMANN: duikt langs je heen, klimt dan steil en komt van bovenaf terug
        e.ex.f=e.ex.f||1;
        if(e.ex.f===1){                                  // langs je heen, laag
          e.p.y-=6*s; e.p.x+=e.i0>3?9*s:-9*s;
          if(afst<20+e.r||e.p.y<this.kop.y-16) e.ex.f=2; }
        else if(e.ex.f===2){                             // steil omhoog, snelheid inruilen voor hoogte
          e.p.y+=14*s; e.p.x*=(1-Math.min(0.9,s*0.5));
          if(e.p.y>this.kop.y+16){ e.ex.f=3; e.cd=0; } }
        else {                                           // van boven weer op je af
          e.p.y-=4*s;
          if(e.p.y<this.kop.y+2){ e.ex.f=1; e.i0=(e.i0>3)?1:5; } } }

      else if(P==='splits'){
        // SPLIT-S: na elke aanval een halve looming omlaag en weg, om je vizier te breken
        e.ex.h=(e.ex.h||0)-s;
        if(e.ex.h<=0){ e.ex.h=3.2+Math.random()*1.6; e.ex.rol=1.4; this.spuw(e,1,0.05); }
        if(e.ex.rol>0){ e.ex.rol-=s;
          e.p.y-=17*s; e.p.x+=(e.i0>3?1:-1)*15*s; }
        else { e.p.y+=6*s*Math.min(1,(this.kop.y-e.p.y)*0.2);
               e.p.x+=Math.cos(e.t*0.6)*6*s; } }

      else if(P==='scissors'){
        // SCISSORS: korte omkeringen om je te laten overschieten

        if(e.ex.sc<=0){ e.ex.sc=0.7+Math.random()*0.5; e.ex.zw=-(e.ex.zw||1); }
        e.p.x+=(e.ex.zw||1)*24*s;
        e.p.y+=(e.ex.zw||1)*7*s; }

      else if(P==='yoyo'){
        // LOW YO-YO: dipt omlaag om snelheid te winnen en klimt er weer uit
        e.ex.a=(e.ex.a||e.i0)+s*1.1;
        e.p.y+=Math.sin(e.ex.a)*13*s;
        e.p.x+=Math.cos(e.ex.a*0.5)*15*s;

      else if(P==='barrel'){
        // BARREL ROLL: schroeft om zijn aanvliegas heen
        e.ex.a=(e.ex.a||e.i0)+s*1.6;
        e.p.x+=Math.cos(e.ex.a)*17*s;
        e.p.y+=Math.sin(e.ex.a)*11*s; }

      else { e.p.x+=Math.sin(e.t*1.4)*5*s*zij; } },

    baan:function(e,s){

      const eye=this.tmp.copy(this.kop);
      const T=TYPE[e.tp];
      const naar=new THREE.Vector3().subVectors(eye,e.p);
      const afst=naar.length(); naar.normalize();
      e.t+=s; e.cd-=s;
      const sp=T.sp;

      // ---- vortex: wie gevangen is verliest zijn eigen koers volledig ----
      const zr=(this.zuigT>0)?(ZUIGR*(0.40+0.60*(1-this.zuigT/6))):0;
      const gez=(this.zuigT>0&&this.zuigP&&e.prof!=='baas'&&
                 e.p.distanceTo(this.zuigP)<zr);
      if(gez){
        const v=this.ZV||(this.ZV=new THREE.Vector3());
        v.subVectors(this.zuigP,e.p);
        const d=Math.max(0.6,v.length());
        v.multiplyScalar(1/d);
        e.p.addScaledVector(v,Math.min(30,4+d*0.9)*s);          // naar binnen
        const t2=this.ZT||(this.ZT=new THREE.Vector3());
        t2.set(-v.z,0,v.x).normalize();
        e.p.addScaledVector(t2,Math.min(22,d*0.8)*s);           // en er omheen draaien

      else if(e.ring){                                // hangt in een baan om de speler

        if(afst>R.r+4) e.p.addScaledVector(naar,sp*(afst>95?3.2:1.4)*s);
        else { R.a+=R.dr*s;
          R.w=(R.w||0)+s;
          if(R.w>7+Math.random()*6){ R.w=0; R.dr*=-1; }        // wisselt af en toe van kant
          const str=R.r+Math.sin(e.t*0.35+e.i0)*6;             // straal ademt in en uit
          const doelx=Math.cos(R.a)*str, doelz=Math.sin(R.a)*str;
          e.p.x+=(doelx-e.p.x)*Math.min(1,s*1.6);
          e.p.z+=(doelz-e.p.z)*Math.min(1,s*1.6);
          e.p.y+=Math.sin(e.t*0.7+e.i0)*4*s;
          e.bT=(e.bT||0)-s;
          if(e.bT<=0){ e.bT=(TYPE[e.tp].cd||3.4)+Math.random()*1.6;
            this.spuw(e,TYPE[e.tp].sal||1,0.06); } } }
      else if(e.prof==='baas'){
        const snelF=(e.hp<e.hpM*0.5)?1.7:1;
        e.p.addScaledVector(naar,(afst-44)*0.35*s*3);
        e.p.x=Math.sin(e.t*0.28)*22;
        e.p.y=1.6+Math.sin(e.t*0.42)*7;
        if(e.cd<=0){ e.cd=(1.9+Math.random())/snelF; this.spuw(e,T.sal,0.22); } }
      else if(e.prof==='duiker'){ this.profiel(e,s,naar,afst,sp);
        if(e.mode==='nader'&&afst>AFST[Math.min(2,e.stap)]+e.r*1.3+1.2) this.halte(e,s,naar,afst,sp*0.4); }
      else if(e.stijl==='route'){ this.routeBaan(e,s,sp); }
      else if(e.stijl==='over'){ this.oversteek(e,s,naar,afst,sp); }
      else { this.halte(e,s,naar,afst,sp); this.profiel(e,s,naar,afst,sp); }
      if(e.ring&&!gez) this.profiel(e,s,naar,afst,sp*0.3);

      // ---- botsing met de speler ----
      const dm=e.p.distanceTo(eye);
      if(dm<e.r+1.4){ this.raakMij(2+e.sc*0.2);

      // ---- sprite bijwerken ----
      if(e.romp){ e.romp.position.copy(e.p); e.romp.rotation.y+=s*1.1; e.romp.rotation.x+=s*0.7; }
      const b=e.bb; if(b){ b.m.position.copy(e.p); b.m.lookAt(eye);

    // =====================================================
    //  GOLVEN
    // =====================================================
    // ---- willekeur met een zaadje: elke golf ziet er elke keer hetzelfde uit ----
    dobbel:function(z){ this.zaad=(this.zaad*1103515245+12345+z)&0x7fffffff;
      return this.zaad/0x7fffffff; },

    // ---- soorten van dit level, gesorteerd van licht naar zwaar ----
    levelSoorten:function(){
      const L=NIVEAU[Math.min(NIVEAU.length-1,this.level-1)].slice();
      L.sort(function(a,b){ return TYPE[a].hp-TYPE[b].hp; });
      return L; },

    // ---- een golf is een lijstje aanvallen: {tp, n, t, form} ----
    golfPlan:function(w){
      const S=this.levelSoorten();
      // op MAAT indelen, niet op taaiheid: de HAULER is taai noch klein maar reusachtig
      const klein=S.filter(function(t){ return TYPE[t].br<=7; });
      const mid  =S.filter(function(t){ return TYPE[t].br>7&&TYPE[t].br<16; });
      const groot=S.filter(function(t){ return TYPE[t].br>=16; });
      const k=function(i){ return klein.length?klein[i%klein.length]:S[0]; };
      const m=function(i){ return mid.length?mid[i%mid.length]:k(i); };
      const g=function(i){ return groot.length?groot[i%groot.length]:m(i); };
      const R=this.dobbel.bind(this);
      const plan=[];
      // hoeveel er hoogstens tegelijk van één soort mogen: hoe groter, hoe minder
      const cap=function(tp,n){ const b=TYPE[tp].br;
        const mx=(b<=7)?22:((b<=12)?9:((b<=17)?4:2));
        return Math.max(1,Math.min(mx,Math.round(n))); };
      const self=this, L=this.level;
      if(!this.lvlGehad||this.lvlGehadL!==L){ this.lvlGehad={}; this.lvlGehadL=L; }
      const kiesVorm=function(seed){
        const lijst=(L<=1)?['rij','wig','slinger']
                  :(L<=3)?['rij','wig','slinger','zuil','tang','ring','ring']
                  :['rij','wig','slinger','zuil','tang','ring','ring','spiraal'];
        return lijst[Math.floor(R(seed*13+7)*lijst.length)%lijst.length]; };
      let vI=0;
      const zet=function(tp,n,t,form){
        plan.push({tp:tp,n:cap(tp,n),t:t,form:form||0,vorm:kiesVorm(++vI)}); };
      const zwaar=1+(this.level-1)*0.18;               // latere levels: meer tegelijk

      // Elke golf schuift een plek op in het rijtje, anders zie je twintig golven
      // lang dezelfde twee soorten.
      const o=(this.level*3+w*2);
      if(w===1){ zet(k(o),10,0); zet(k(o+1),10,6); }
      else if(w===2){ zet(k(o+2),10,0); zet(m(o),2,3.5); }
      else if(w===3){ zet(m(o+1),6,0); zet(m(o+2),4,7); }
      else if(w===4){ zet(g(o),2,0); zet(k(o+3),10,4); }
      else if(w===5){ for(let b=0;b<4;b++) zet(k(o+b),10,b*3.5);
                      zet(m(o+1),2,5); }
      else {
        const n=1+Math.floor(R(w)*3);                  // twee tot vier aanvallen
        for(let a=0;a<=n;a++){
          const r=R(w*7+a);
          const t=a*(2.5+R(w+a)*3.5);
          if(r<0.42) zet(k(o+a+Math.floor(R(a)*5)),(8+w*0.5)*zwaar,t);
          else if(r<0.78){ const tp=m(o+a+Math.floor(R(a+3)*5));
            zet(tp,(3+w*0.25)*zwaar,t,TYPE[tp].prof==='formatie'?1:0); }
          else zet(g(o+a+Math.floor(R(a+5)*5)),(1+w*0.12)*zwaar,t); }
        if(w%5===0) zet(g(o+Math.floor(R(w)*5)),1+Math.floor(w/9),1.5);
      }
      // Wie dit level nog niet is langsgekomen, krijgt vanaf golf 6 voorrang op één
      // aanval. Anders zit er altijd wel een soort twintig golven op de bank.
      if(w>=6&&this.lvlGehad){
        const wacht=S.filter(function(t){ return !self.lvlGehad[t]; });
        if(wacht.length){
          const tp=wacht[Math.floor(R(w*3)*wacht.length)%wacht.length];
          const i2=Math.floor(R(w*5)*plan.length)%plan.length;
          plan[i2].tp=tp; plan[i2].n=cap(tp,plan[i2].n); } }
      for(let i=0;i<plan.length;i++) this.lvlGehad[plan[i].tp]=1;

      // Geen twee aanvallen van dezelfde soort in één golf: een dubbele wordt
      // omgeruild voor een soort uit dezelfde maatklasse die nog niet meedoet.
      const bezet={};
      for(let i=0;i<plan.length;i++){ const a2=plan[i];
        if(!bezet[a2.tp]){ bezet[a2.tp]=1; continue; }
        const br=TYPE[a2.tp].br;
        const eigen=(br<=7)?klein:((br<16)?mid:groot);
        const bak=eigen.concat(mid,klein,groot);     // eerst zijn eigen maat, dan de rest
        for(let q=0;q<bak.length;q++){ const alt=bak[(q+i)%bak.length];
          if(!bezet[alt]){ a2.tp=alt; break; } }
        bezet[a2.tp]=1; }

      // een golf blijft binnen wat het veld aankan
      let tot=0; for(let i=0;i<plan.length;i++) tot+=plan[i].n;
      if(tot>46){ const f=46/tot;
        for(let i=0;i<plan.length;i++) plan[i].n=Math.max(1,Math.round(plan[i].n*f)); }
      return plan; },

    nieuweGolf:function(){
      this.wave++;
      if(this.wave>20){ this.levelKlaar(); return; }
      this.plan=this.golfPlan(this.wave);
      this.planT=0; this.rij=[]; this.veldMax=0; this.gi=0; this.groepT=0;
      for(let i=0;i<this.plan.length;i++) this.plan[i].uit=0;
      this.toonMelding('LEVEL '+this.level+'   WAVE '+this.wave+' / 20','#35e8ff');
      this.state='vechten'; },

    // ---- aanvallen loslaten op hun eigen tijdstip ----
    // groep voor groep: de volgende komt pas als de vorige is opgeruimd
    planTick:function(s,levend){
      if(!this.plan) return true;
      if(this.gi===undefined) this.gi=0;
      if(this.gi>=this.plan.length) return (!this.rij.length&&levend===0);
      const a=this.plan[this.gi];
      if(!a.uit){ this.aanval(a); a.uit=1; this.groepT=0; return false; }
      if(this.rij.length||levend>0){ this.groepT=0; return false; }
      this.groepT=(this.groepT||0)+s;
      if(this.groepT>0.9){ this.gi++; this.groepT=0;
        if(this.gi<this.plan.length) this.toonMelding('WAVE '+this.wave+'  -  GROUP '+(this.gi+1),'#8fd8ec'); }
      return false; },

    aanval:function(a){
      const n=Math.max(1,a.n|0);
      if(a.form){ this.formatie(a.tp,n); this.veldMax+=Math.min(n,6); return; }
      const b=TYPE[a.tp].br;
      const gelijk=Math.min(n,(b<=7)?9:((b<=12)?5:((b<=17)?3:1)));
      this.veldMax+=gelijk;
      this.vorm=a.vorm||'rij'; this.vormI=0; this.vormN=n;
      // elke groep krijgt zijn eigen plek aan de hemel, ver van de vorige
      const vorigeH=(this.vormC&&this.vormC.hoek)||0;
      let hk;
      do { hk=(Math.random()-0.5)*1.7; } while(Math.abs(hk-vorigeH)<0.55);
      this.vormC={hoek:hk, oy:(Math.random()-0.5)*26};
      // ongeveer de helft van de groepen steekt over in plaats van stil te gaan hangen
      this.vormS=(a.vorm==='ring')?'halte'
        :((Math.random()<0.22)?'route'
        :((a.vorm==='slinger'||Math.random()<0.45)?'over':'halte'));
      this.vormZ=(Math.random()<0.5)?-1:1;
      const rl=(this.level<=3)?ROUTEVROEG:ROUTENAMEN;   // vroege levels: alleen banen die voor je blijven
      this.vormR=rl[Math.floor(Math.random()*rl.length)];
      this.vormRs=0.85+Math.random()*0.4;              // de een vliegt een ruimere baan dan de ander
      this.vormRm=(Math.random()<0.5)?-1:1;            // en soms gespiegeld
      for(let i=0;i<gelijk;i++) this.spawnVorm(a.tp);
      for(let i=gelijk;i<n;i++) this.rij.push(a.tp); },   // de rest wacht op een lege plek

    // ---- waar en hoe een schip binnenkomt ----
    spawnVorm:function(tp){

      else if(V==='slinger'){                           // achter elkaar aan, één sliert

      else if(V==='zuil'){                              // boven elkaar, een muur

      else if(V==='tang'){                              // van links en van rechts tegelijk

    // =====================================================

    tick:function(t,dt){ if(this.dead) return; try{

      // ---- laserstreep: twintig tot dertig flitsen in een kwart seconde ----

        if(B.d>=B.md){ B.live=false; B.m.visible=false; } }

      // ---- raketten ----
      for(let i=0;i<this.rockets.length;i++){ const R=this.rockets[i]; if(!R.live) continue;
        R.tot+=s;

        R.m.position.addScaledVector(R.dir,(R.tot<R.swarm?46:78)*s);
        R.m.lookAt(eye); R.m.scale.setScalar(1.7+Math.sin(R.tot*30)*0.25);
        R.tr=(R.tr||0)-s;
        if(R.tr<=0){ R.tr=0.07;
          this.vonk(R.m.position.x,R.m.position.y,R.m.position.z,0xff8a3d,1,1.2,0.28,true); }
        let bum=false;
        for(let a=0;a<this.enemies.length;a++){ const e=this.enemies[a]; if(!e.live) continue;
          if(e.p.distanceTo(R.m.position)<e.r+1.6){ bum=true; break; } }
        if(bum||R.tot>4.5){
          const P=R.m.position;
          if(bum){ SND.boom(P.x*0.02);
            this.vonk(P.x,P.y,P.z,0xffb03a,14,11,1.2);
            for(let a=0;a<this.enemies.length;a++){ const e=this.enemies[a]; if(!e.live) continue;
              if(e.p.distanceTo(P)<R.rad+e.r) this.raak(e,6,P.x,P.y,P.z); }

    // ---- vijandelijk vuur kapotschieten ----
    vijTreffer:function(p,dmg,straal){
      const r2=straal*straal;
      for(let i=0;i<this.vij.length;i++){ const B=this.vij[i]; if(!B.live) continue;
        const q=this.KP2||(this.KP2=new THREE.Vector3());
        q.copy(B.o).addScaledVector(B.dir,B.d);
        const dx=q.x-p.x, dy=q.y-p.y, dz=q.z-p.z;
        if(dx*dx+dy*dy+dz*dz>r2*(B.zwaar?2.6:1)) continue;
        B.hp-=dmg;
        if(B.hp>0){ SND.hit(q.x*0.02,0.3);
          this.vonk(q.x,q.y,q.z,0xffd9a0,3,5,0.4); return 1; }
        B.live=false; B.m.visible=false;
        SND.kill(q.x*0.02,0.5);
        this.vonk(q.x,q.y,q.z,B.zwaar?0xffe45c:0xff8a3d,B.zwaar?12:6,B.zwaar?9:6,B.zwaar?1.1:0.6);
        this.punten+=B.zwaar?60:10;
        return 1; }
      return 0; },

    // segmenttest van een kogel tegen alle vijanden
    treffer:function(o,dir,t0,t1,tol){
      let bt=1e9, be=null;
      for(let a=0;a<this.enemies.length;a++){ const e=this.enemies[a];
        if(!e.live) continue;
        const vx=e.p.x-o.x, vy=e.p.y-o.y, vz=e.p.z-o.z;
        let t=vx*dir.x+vy*dir.y+vz*dir.z;
        if(t<t0-1||t>t1+1||t>=bt) continue;
        t=Math.max(t0,Math.min(t1,t));
        const qx=vx-dir.x*t, qy=vy-dir.y*t, qz=vz-dir.z*t;
        const r=e.r+(tol||0);
        if(qx*qx+qy*qy+qz*qz<r*r){ bt=t; be=e; } }
      if(!be) return null;
      return {e:be,x:o.x+dir.x*bt,y:o.y+dir.y*bt,z:o.z+dir.z*bt}; },

    hud:function(){

        '  tex '+tex+'  art '+((window.ART&&window.ART.vondst)||'-');
      if(d!==this.diagV){ this.diagV=d;
        const e=document.querySelector('#diag'); if(e) e.setAttribute('value',d); }
      if(window.DEMO){ const dd=document.querySelector('#hudC');
        if(dd&&this.meldC<=0){ dd.setAttribute('value','DEMO  -  press trigger to stop');
          dd.setAttribute('color','#6ce2a0'); } }
      if(l!==this.hudLv){ this.hudLv=l;

    menuTick:function(s){

    // welke hemel hoort bij dit level?
    hemelZet:function(){
      if(!this.hemels||!this.hemels.length) return;
      const i=(Math.max(1,this.level||1)-1)%this.hemels.length;
      if(this.hemelI===i&&this.panoAan) return;
      this.hemelI=i; this.panoAan=true;
      const H=this.hemels[i];
      this.panoBreed=H.breed;
      this.hemel.material.map=H.tex; this.hemel.material.needsUpdate=true;
      this.hemel.rotation.y=-Math.PI/2;                 // naad achter je rug

    artVernieuw:function(){
      const self=this;
      if(window.ART.schepen&&window.ART.schepen.length){
        const self2=this;
        window.ART.schepen.forEach(function(t){
          if(t.__gedaan) return; t.__gedaan=true;
          let P=null; try{ P=self2.meetPlaat(t); }catch(e){ P=null; }
          // Een vierkante planeet valt in hetzelfde verhoudingsbereik als een vlootplaat.
          // Alleen wie ECHT gemeten is met 4 kolommen en genoeg rijen telt als vloot;
          // de rest verhuist naar de losse hemelobjecten.
          const echt=P&&P.hoe.indexOf('gemeten')===0&&P.kol.length===4&&P.rijen>=4;
          if(!echt){ window.ART.objs.push(t); return; }
          const ar2=t.image.width/t.image.height;
          if(P.rijen>=10){ if(ar2>=0.85) self2.plaat12=P; else self2.plaat13=P; }
          else self2.plaat6=P;
          window.ART.vondst='fleet '+(self2.plaat6?'6 ':'')+(self2.plaat12?'12a ':'')+
            (self2.plaat13?'12b ':'')+P.hoe; }); }
      if(window.ART.panos&&window.ART.panos.length){
        const zelf=this;
        window.ART.panos.forEach(function(t){
          if(t.__hemel) return; t.__hemel=true;
          let H2=null; try{ H2=zelf.hemelBereid(t); }catch(e){ H2=null; }
          if(H2){ zelf.hemels=zelf.hemels||[]; zelf.hemels.push(H2); zelf.hemelZet(); } }); }
      if(false&&window.ART.pano&&!this.panoAan){ this.panoAan=true;
        const t=window.ART.pano;
        const ar=(t.image&&t.image.width)?t.image.width/t.image.height:2;
        // Een bol wil 2:1. Is de plaat breder, dan tonen we er een 2:1 VENSTER van
        // en schuift dat venster langzaam op: halverwege het level kijk je naar het
        // andere stuk van de plaat. Zo klopt de verhouding en gebruik je alles.
        if(t.repeat&&t.offset){                        // echte textuur, geen terugval
          t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.ClampToEdgeWrapping;
          // Breder dan 2:1 -> een venster in de breedte dat doorschuift.
          // Hoger dan 2:1 -> een venster in de HOOGTE, gecentreerd op de horizon,
          // want anders wordt het beeld verticaal uitgerekt.
          t.repeat.x=Math.min(1,2/Math.max(0.5,ar));
          t.repeat.y=Math.min(1,ar/2);
          t.offset.x=0;
          t.offset.y=(1-t.repeat.y)/2;
          t.needsUpdate=true; }
        this.panoBreed=(ar>2.4);
        // De naad van de bol ligt op x=-300 (90 graden links). Draai hem naar achteren,
        // zodat je er alleen tegenaan kijkt als je je omdraait.
        this.hemel.rotation.y=-Math.PI/2;
        this.hemel.material.map=t; this.hemel.material.needsUpdate=true; }
      window.ART.objs.forEach(function(t){
        if(t.__gebruikt) return; t.__gebruikt=true;
        const ar=(t.image&&t.image.width)?t.image.width/t.image.height:1;
        const h=46+Math.random()*30, w=h*ar;
        const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
          new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
        const a=Math.random()*6.283, d=72+Math.random()*26;          // altijd binnen de sterrenbol
        m.position.set(Math.cos(a)*d,10+Math.random()*34,-Math.abs(Math.sin(a)*d)-30);
        m.renderOrder=-14; self.par.add(m); self.skyObjs.push(m); }); },

    // =====================================================
    //  DEMO — de autopiloot speelt, jij kijkt
    // =====================================================
    demoTick:function(s){
      const hand=document.querySelector('#touchHand');
      if(!hand||!hand.object3D) return;
      this.dT=(this.dT||0)+s;
      if(this.over){                                    // doodgegaan: even wachten, dan door
        this.dOver=(this.dOver||0)+s;
        if(this.dOver>2.2){ this.dOver=0; this.verder(); }
        return; }
      this.dOver=0;
      // doel kiezen: liefst iets dat je nu kunt zien
      let best=null, bs=-1e9;
      const K=this.kijkD, v=this.DV||(this.DV=new THREE.Vector3());
      for(let i=0;i<this.enemies.length;i++){ const e=this.enemies[i];
        if(!e.live||e.dood) continue;
        v.subVectors(e.p,this.kop);
        const d=v.length(); if(d<0.5) continue;
        v.multiplyScalar(1/d);
        const zicht=K?v.dot(K):1;
        const punt=zicht*60-d*0.6+(e.hp<40?12:0);      // in beeld, dichtbij, bijna dood
        if(punt>bs){ bs=punt; best=e; } }
      // dozen hebben voorrang als ze in de buurt zijn
      let doos=null;
      for(let i=0;i<this.dozen.length;i++){ const D=this.dozen[i];
        if(D.live&&D.p.distanceTo(this.kop)<48){ doos=D; break; } }
      // beide handen doen mee: hoofdhand mitrailleur, andere hand het opgepakte wapen.
      // Zonder controllers staan de handen op de vloer; dan valt hij terug op de camera.
      const H1=this.hands[this.prim], H2=this.hands[this.spec];
      const hp=this.DH||(this.DH=new THREE.Vector3());
      const bruikbaar=function(H){ if(!H||!H.object3D) return null;
        H.object3D.getWorldPosition(hp); return (hp.y>0.4)?H:null; };
      const hA=bruikbaar(H1)||hand, hB=bruikbaar(H2)||hand;
      const mik=this.DA||(this.DA=new THREE.Vector3());
      if(doos){ mik.copy(doos.p).sub(this.kop).normalize();
        window.AIM=mik;
        hB.object3D.getWorldPosition(this.ori);
        this.grab(this.ori,mik,hB); }            // dozen pakt hij met de wapenhand
      else if(best){ mik.copy(best.p).sub(this.kop).normalize();
        window.AIM=mik; }
      else { window.AIM=null; return; }
      this.fire(hA);
      this.fire(hB);
      if(this.dT-(this.dW||0)>9){ this.dW=this.dT; this.wisDeb=0; this.wissel(hB); }
      if(this.dT-(this.dU||0)>17&&this.ults>0){ this.dU=this.dT;
        const H=this.hands[(this.dUlt=(this.dUlt||0)+1)%2?this.prim:this.spec];
        if(H) this.ultimate(H); } },

    demoStop:function(){
      window.DEMO=false; window.AIM=null;
      this.dT=0; this.dW=0; this.dU=0; this.dOver=0; },

    // =====================================================
    //  PAUZE / EINDE
    // =====================================================
    pauzeKnop:function(){
      if(window.PHASE!=='game') return;
      const nu=Date.now(); if(nu-(this.pzDeb||0)<350) return; this.pzDeb=nu;
      if(this.over) return;
      window.PAUSED=!window.PAUSED;
      this.paneel(window.PAUSED,'PAUSED','','RESUME'); },

    paneel:function(aan,titel,info,knop){
      const p=document.querySelector('#paneel'); if(!p) return;
      p.setAttribute('visible',!!aan);
      if(!aan) return;
      document.querySelector('#pTitel').setAttribute('value',titel);
      document.querySelector('#pInfo').setAttribute('value',info||'');
      document.querySelector('#goTxt').setAttribute('value',knop||'RESUME'); },

    gameOver:function(){
      this.over=true; window.PAUSED=true;
      SND.zeg('Systems down');
      this.paneel(true,'SYSTEMS DOWN','score '+this.punten+'   wave '+this.wave+
        '\ncontinues used: '+this.contN,'CONTINUE'); },

    verder:function(){
      if(this.over){ this.over=false; this.contN++; this.power=100; this.rood=0;
        for(let i=0;i<this.vij.length;i++){ this.vij[i].live=false; this.vij[i].m.visible=false; } }
      window.PAUSED=false; this.paneel(false); },

    gehaald:function(){
      this.over=true; window.PAUSED=true;
      SND.zeg('Sector cleared');
      bewaarScore(this.punten,this.contN);
      try{ localStorage.removeItem('cosmic_save'); }catch(e){}   // uitgespeeld: schoon beginnen
      this.paneel(true,'ALL SECTORS CLEARED','score '+this.punten+'   kills '+this.gedood+
        '\nbest combo '+this.beste+'   continues '+this.contN,'BACK TO MENU');
      this.klaar=true; }
  });

  // =========================================================
  //  SCOREBORD
  // =========================================================
  function leesScores(){ try{ const r=localStorage.getItem('cosmic_top20');
    return r?JSON.parse(r):[]; }catch(e){ return []; } }
  function bewaarScore(s,c){ try{
    const L=leesScores(); L.push({s:s,c:c||0,d:new Date().toISOString().slice(0,10)});
    L.sort(function(a,b){ return b.s-a.s; });
    localStorage.setItem('cosmic_top20',JSON.stringify(L.slice(0,20)));
  }catch(e){} }
  // ---- voortgang: na elk gehaald level onthouden waar je was ----
  function bewaarVoortgang(lvl,punten,ults,cont){ try{
    localStorage.setItem('cosmic_save',JSON.stringify(
      {l:lvl,s:punten,u:ults,c:cont||0,d:new Date().toISOString().slice(0,10)}));
    toonVoortgang(); }catch(e){} }
  function leesVoortgang(){ try{ const r=localStorage.getItem('cosmic_save');
    const v=r?JSON.parse(r):null;
    return (v&&v.l>1&&v.l<=99)?v:null; }catch(e){ return null; } }
  function toonVoortgang(){
    const v=leesVoortgang();
    const t=document.querySelector('#contTxt'), k=document.querySelector('#btnCont');
    if(!t||!k) return;
    if(v){ t.setAttribute('value','CONTINUE  -  LEVEL '+v.l);
      t.setAttribute('color','#8fd84a');
      k.setAttribute('material','color:#2d4a22;shader:flat'); }
    else { t.setAttribute('value','NO SAVED RUN');
      t.setAttribute('color','#40603a');
      k.setAttribute('material','color:#20301c;shader:flat'); } }

  function toonScores(){
    const L=leesScores(), e=document.querySelector('#scoreLijst'); if(!e) return;
    if(!L.length){ e.setAttribute('value','no runs logged yet'); return; }
    let t='';
    for(let i=0;i<Math.min(5,L.length);i++) t+=(i+1)+'.  '+L[i].s+'   '+L[i].d+(L[i].c?'   C'+L[i].c:'')+'\n';
    e.setAttribute('value',t);
    const b=document.querySelector('#bestTxt'); if(b) b.setAttribute('value','best '+L[0].s); }

  // =========================================================
  //  MENU-KNOPPEN
  // =========================================================
  function handKleur(){
    const l=document.querySelector('#handL'), r=document.querySelector('#handR');
    const lt=document.querySelector('#handLt'), rt=document.querySelector('#handRt');
    const links=(window.PRIMHAND!=='right');
    if(l) l.setAttribute('material','color:'+(links?'#1d6b86':'#0e2c40')+';shader:flat');
    if(r) r.setAttribute('material','color:'+(links?'#0e2c40':'#1d6b86')+';shader:flat');
    if(lt) lt.setAttribute('color',links?'#ffffff':'#5f9ab5');
    if(rt) rt.setAttribute('color',links?'#5f9ab5':'#ffffff'); }

  function laserAan(aan){
    document.querySelectorAll('.menu-laser').forEach(function(l){ l.setAttribute('visible',!!aan); }); }

  function startSpel(demo,vanaf){
    if(window.PHASE!=='menu') return;
    window.DEMO=!!demo;
    AC(); SND.initSFX(); SND.muziek(); SND.wake();
    const m=document.querySelector('#menu'); if(m) m.setAttribute('visible',false);
    const p=document.querySelector('#paneel'); if(p) p.setAttribute('visible',false);
    laserAan(false);
    const r=document.querySelector('#richt'); if(r) r.setAttribute('visible',true);
    const rig=document.querySelector('#rig'), C=rig&&rig.components&&rig.components.cosmic;
    window.PAUSED=false; window.PHASE='game';
    if(C){ C.reset();
      if(vanaf&&vanaf.l>1){ C.level=vanaf.l; C.zaad=C.level*7919;
        C.punten=vanaf.s||0; C.ults=Math.max(2,vanaf.u||2); C.contN=vanaf.c||0;
        C.toonMelding('LEVEL '+C.level,'#8fd84a'); }
      C.state='wacht'; C.golfT=2.2; }
    if(demo) SND.zeg('Demo'); else SND.zeg('Launch'); }

  function naarMenu(){
    window.PHASE='menu'; window.PAUSED=false;
    const rig=document.querySelector('#rig'), C=rig&&rig.components&&rig.components.cosmic;
    if(C){ C.demoStop(); C.reset(); C.over=false; C.klaar=false; C.paneel(false); }
    window.DEMO=false; window.AIM=null;
    const m=document.querySelector('#menu'); if(m) m.setAttribute('visible',true);
    const r=document.querySelector('#richt'); if(r) r.setAttribute('visible',true);
    ['#hudL','#hudR','#hudC','#hudW'].forEach(function(id){
      const e=document.querySelector(id); if(e) e.setAttribute('value',''); });
    laserAan(true); toonScores(); toonVoortgang(); }

  function knoppen(){
    const kl=function(id,fn){ const e=document.querySelector(id); if(e) e.addEventListener('click',fn); };
    kl('#handL',function(){ window.PRIMHAND='left'; handKleur(); SND.gun(0,0); });
    kl('#handR',function(){ window.PRIMHAND='right'; handKleur(); SND.gun(0,0); });
    kl('#btnStart',function(){ startSpel(false); });
    kl('#btnDemo',function(){ startSpel(true); });
    kl('#btnCont',function(){ const v=leesVoortgang(); if(!v) return; startSpel(false,v); });
    kl('#btnScores',toonScores);
    kl('#btnHelp',function(){ const e=document.querySelector('#scoreLijst'); if(!e) return;
      e.setAttribute('value','trigger  fire      grip  ultimate\ntop buttons  switch weapon (other hand)\nstick press  pause'); });
    kl('#btnGo',function(){ const rig=document.querySelector('#rig'),
        C=rig&&rig.components&&rig.components.cosmic; if(!C) return;
      if(C.klaar) naarMenu(); else C.verder(); });
    kl('#btnQuit',naarMenu);
    kl('#btnTrack',function(){ AC(); if(!PLAY.length) return; SND.volgende(); });
    handKleur(); toonScores(); toonVoortgang(); }

  // =========================================================
  //  OPSTARTEN
  // =========================================================
  function boot(){
    prog(20,'SCENE');
    document.body.insertAdjacentHTML('beforeend',SCENE_HTML);
    const sc=document.querySelector('a-scene');
    const klaar=function(){
      knoppen();
      const v=document.querySelector('#verTxt'); if(v) v.setAttribute('value',VERSIE);
      padenZoek(function(p){ if(p.art) artScan(p.art); if(p.music) musScan(p.music);
        if(!p.art){ const e=document.querySelector('#artTxt');
          if(e) e.setAttribute('value','geen Art-map'); }
        if(!p.music){ const e=document.querySelector('#musTxt');
          if(e) e.setAttribute('value','geen Music-map'); } });
      prog(100,'READY');
      setTimeout(laadWeg,400); };
    if(sc.hasLoaded) klaar();
    else sc.addEventListener('loaded',klaar);
    sc.addEventListener('renderstart',function(){ setTimeout(laadWeg,200); });
    // ---- muis en aanraakscherm: zelfde spel zonder headset ----
    const C=function(){ const r=document.querySelector('#rig');
      return r&&r.components&&r.components.cosmic; };
    const tHand=function(){ return document.querySelector('#touchHand'); };
    let raakt=false;
    function aan(ev){
      const h=tHand(); if(!h||!h.object3D) return;
      if(window.PHASE==='menu'||window.PAUSED){ menuKlik(h); return; }
      if(window.DEMO){ naarMenu(); return; }
      const c=C(); if(!c) return;
      if(!raakt){ raakt=true; if(c.held.indexOf(h)<0) c.held.push(h); }
      c.fire(h); }
    function uit(){ const h=tHand(), c=C(); raakt=false;
      if(!h||!c) return; const i=c.held.indexOf(h); if(i>=0) c.held.splice(i,1); }
    ['mousedown','touchstart'].forEach(function(ev){
      window.addEventListener(ev,function(e){
        if(e.target&&e.target.closest&&e.target.closest('.a-enter-vr')) return;   // VR-knop met rust laten
        aan(e); },{passive:true}); });
    ['mouseup','touchend','touchcancel','blur'].forEach(function(ev){
      window.addEventListener(ev,uit,{passive:true}); });
    // richtkruis is buiten VR je vizier
    const sc2=document.querySelector('a-scene');
    if(sc2){ sc2.addEventListener('enter-vr',function(){ window.INVR=true; });
             sc2.addEventListener('exit-vr',function(){ window.INVR=false; }); }
  }

  if(document.readyState==='complete'||document.readyState==='interactive') setTimeout(boot,60);
  else window.addEventListener('DOMContentLoaded',function(){ setTimeout(boot,60); });

})();
</script>
