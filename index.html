    // blokkeert.
    spookTijd:function(e,s){
      // Hij blijft tot je hem sloopt. Verder niets: je vindt hem via zijn
      // salvo's, je eigen treffers en het vuur dat hij oploopt.
      return false;
      this.vonk(e.p.x,e.p.y,e.p.z,0x9fe4f5,10,e.bw*0.4,1.0);
      this.rook(e.p.x,e.p.y,e.p.z,false,3.0,2.0,1);
      this.toonMelding('CONTACT LOST','#9fe4f5');
      this.bbVrij(e.bb); e.bb=null; e.live=false;
      return true; },

    // Het einde van een spook: een witte vuurbal die openbarst, en daarna een
    // brandend wrak dat neerstort met een dikke zwarte rooksliert.
    spookEinde:function(e){
      const p=e.p;
      // de flits: wit, dan geel, dan oranje naar buiten
      this.vonk(p.x,p.y,p.z,0xffffff,20,e.r*0.7,1.4);
      this.vonk(p.x,p.y,p.z,0xfff2c0,26,e.r*1.2,1.6);
      this.vonk(p.x,p.y,p.z,0xffb03a,30,e.r*1.9,1.3);
      this.vonk(p.x,p.y,p.z,0xff5a2a,22,e.r*2.6,1.0);
      this.knal(p,e.sc*1.6);
      this.schokRing(p); this.schokRing(p);
      this.camoGolf(p.x,p.y,p.z);
      // zwarte rook, veel en dik
      for(let i=0;i<10;i++){
        const hk=Math.random()*6.283, af=e.r*(0.2+Math.random()*0.8);
        this.rook(p.x+Math.cos(hk)*af, p.y+Math.sin(hk)*af*0.7,
                  p.z+(Math.random()-0.5)*af, true, 3.2+Math.random()*2.2, 3.0); }
      SND.boom(p.x*0.02,true);
      this.toonMelding('CONTACT DESTROYED','#ffd070'); },

    spookBrand:function(e,s){
      const deel=e.hp/Math.max(1,e.hpM);
      const fase=(deel<=SPOOK_FASE2)?2:((deel<=SPOOK_FASE1)?1:0);
      if(fase!==e.spookFase){
        e.spookFase=fase;
        if(fase>0){
          this.vonk(e.p.x,e.p.y,e.p.z,0xfff2c0,8,e.bw*0.3,0.7);
          this.vonk(e.p.x,e.p.y,e.p.z,0xff5a2a,10,e.bw*0.4,0.9);
          this.rook(e.p.x,e.p.y,e.p.z,fase>1,3.0,2.2,1); } }
      if(!fase) return;
      e.brT3=(e.brT3||0)-s;
      if(e.brT3>0) return;
      e.brT3=(fase>1)?0.05:0.09;
      const n=(fase>1)?3:2;
      for(let i=0;i<n;i++){
        const hk=Math.random()*6.283, af=e.r*(0.25+Math.random()*0.5);
        const px=e.p.x+Math.cos(hk)*af, py=e.p.y+Math.sin(hk)*af*0.7,
              pz=e.p.z+(Math.random()-0.5)*af;
        const gr=(fase>1)?1.7:1.1;
        this.vonk(px,py,pz,0xfff2c0,1,1.8*gr,0.18);
        this.vonk(px,py,pz,0xffb03a,1,2.8*gr,0.30);
        if(Math.random()<0.6) this.vonk(px,py,pz,0xff5a2a,1,3.4*gr,0.42);
        if(Math.random()<(fase>1?0.9:0.5))
          this.rook(px,py,pz,fase>1,(fase>1?2.2:1.5),(fase>1?2.4:1.7),0); } },

    spiraalSalvo:function(e){
      // Level 4 begint met acht; elke twee levels komen er twee bij, tot twaalf.
      const n=Math.min(SPIR_MAX_N,SPIR_N+Math.floor(Math.max(0,this.level-SPIR_VANAF)/2)*2);
      for(let i=0;i<n;i++){
        const hk=(i/n)*6.283;
        const B=this.sigSchot(e,this.sigRicht(e,Math.cos(hk)*SPIR_WIJD,Math.sin(hk)*SPIR_WIJD*0.85),
          {sp:SPIR_SP,hp:5,dmg:SPIR_DMG,zoek:1,draai:SPIR_DRAAI,groot:1.2,
           neus:2,kleur:0xff8020});
        if(B){ B.waaier=SPIR_WAAIER; B.wh=hk;
               B.draaiOm=(i%2?1:-1); B.hoekS=1.15; B.hoek0=hk; B.straal0=1; } }
      this.vonk(e.p.x,e.p.y,e.p.z,0xff8020,8,e.bw*0.4,0.9);
      this.toonMelding('SPIRAL BARRAGE','#ff8a30');
      SND.boom(e.p.x*0.02); },

    // Zijn gedrag: stilstaan en vuren, dan wegsprinten naar een nieuwe plek.
    spiraalTick:function(e,s){
      e.spF=e.spF||'wacht';
      e.spT=(e.spT||0)-s;
      if(e.spF==='wacht'){
        if(e.spT<=0){ e.spF='vuur'; e.spT=0.5;
          this.toonMelding('LOCKING ON','#ffb03a');
          this.vonk(e.p.x,e.p.y,e.p.z,0xffd070,5,e.bw*0.3,0.6); }
        return true; }                          // blijft stilstaan
      if(e.spF==='vuur'){
        if(e.spT<=0){ this.spiraalSalvo(e); e.spF='sprint'; e.spT=SPIR_SPRINT; }
        return true; }                          // ook tijdens het vuren stilstaan
      // sprinten naar een nieuwe plek
      if(e.spT<=0){ e.spF='wacht'; e.spT=SPIR_ELK; return true; }
      const d=this.SPD||(this.SPD=new THREE.Vector3());
      if(!e.spDoel){ e.spDoel=new THREE.Vector3(
        (Math.random()-0.5)*90, this.kop.y+(Math.random()-0.5)*22,
        -(60+Math.random()*70)); }
      d.subVectors(e.spDoel,e.p);
      if(d.length()<6){ e.spDoel=null; e.spT=0; }
      else { d.normalize(); e.p.addScaledVector(d,SPIR_SNEL*s); }
      return true; },

    // ---- ZWERM: 30 tot 40 trage raketten tegelijk ----
    // Ze vliegen langzaam en zijn zo kapot, maar met zovelen moet je kiezen wat
    // je eerst neerhaalt. Dat maakt het een puzzel in plaats van een oefening.
    sigZwerm:function(e,twee){
      const n=twee?ZWERM_N2:ZWERM_N;
      const self=this;
      const lagen=4;
      for(let L=0;L<lagen;L++){
        this.sigNa(L*0.22,function(){
          if(!e.live||e.dood) return;
          const per=Math.round(n/lagen);
          for(let i=0;i<per;i++){
            const hk=(i/per)*6.283+L*0.4;
            const r=0.30+L*0.14;
            self.sigSchot(e,self.sigRicht(e,Math.cos(hk)*r,Math.sin(hk)*r*0.85),
              {sp:ZWERM_SP,hp:1,dmg:4,zoek:1,draai:1.0,groot:0.75,
               neus:(L%3),kleur:ZWERM_KL[L%ZWERM_KL.length]}); } }); }
      this.sigMeld(e,'SWARM','#ff8a30'); },

    // ---- COMBINATIE: twee of drie aanvallen door elkaar ----
    // Eén aanval schiet je zo uit de lucht. Twee tegelijk dwingt je te kiezen,
    // drie maakt het echt een baasgevecht.
    sigCombo:function(e,twee){
      const self=this;
      const bak=[
        function(){ self[SIG[e.baasNaam].fn](e,twee); },
        function(){ self.sigJacht(e,twee); },
        function(){ self.sigZwaar(e,twee); },
        function(){ self.sigSpeciaal(e,twee); },
        function(){ self.sigZwerm(e,twee); }
      ];
      // in zijn tweede vorm drie tegelijk, anders twee
      const hoeveel=twee?3:2;
      const gekozen=[];
      while(gekozen.length<hoeveel){
        const k=Math.floor(Math.random()*bak.length);
        if(gekozen.indexOf(k)<0) gekozen.push(k); }
      gekozen.forEach(function(k,i){
        self.sigNa(i*0.35,function(){ if(e.live&&!e.dood) bak[k](); }); });
      this.toonGroot(hoeveel===3?'FULL ASSAULT':'DOUBLE STRIKE','#ff3d55'); },

    baasZwerm:function(e,fase){
      if(!this.zwermMag(e)) return;
      // elke fase een ander soort, oplopend in zwaarte
      const S=this.levelSoorten();
      const licht=S.filter(function(t){ return TYPE[t].br<=9; });
      const zwaar=S.filter(function(t){ return TYPE[t].br>9; });
      const lijst=(fase%2===0||!zwaar.length)?licht:zwaar;
      if(!lijst.length) return;
      const tp=lijst[fase%lijst.length];
      const n=(TYPE[tp].br<=9)?(4+Math.min(5,fase)):(2+Math.floor(fase/2));
      this.vorm='wig'; this.vormI=0; this.vormN=n;
      this.vormC={hoek:(Math.random()-0.5)*1.4, oy:(Math.random()-0.5)*20};
      this.vormS='halte'; this.vormZ=1;
      for(let i=0;i<n;i++){ const v=this.spawnVorm(tp);
        if(v){ v.p.copy(e.p); v.p.x+=(i-(n-1)/2)*e.sc*0.16;
               v.p.y+=(Math.random()-0.5)*e.sc*0.2; v.p.z+=6; } }
      SND.alarm();
      this.toonMelding('LAUNCHING '+TYPE[tp].n,'#ff8aa6'); },

    baasBalk:function(e){
      if(e.intro) return;
      const A=document.querySelector('#baasBalkA'), B=document.querySelector('#baasBalkB');
      const R=document.querySelector('#baasRand');
      if(!A||!B) return;
      if(!this.balkAan){ this.balkAan=true;
        A.setAttribute('visible',true); B.setAttribute('visible',true);
        if(R) R.setAttribute('visible',true);
        this.hBaas=null;
        this.hudTekst('#mBaasNaam',(e.baasNaam||'BOSS'),'#6cf08a',0.048,0.30,'hBaas'); }
      const d=Math.max(0,e.hp/e.hpM);
      if(Math.abs(d-(this.balkD||0))<0.004) return; this.balkD=d;
      const br=Math.max(0.004,0.68*d);
      B.setAttribute('width',br.toFixed(4));
      B.setAttribute('height','0.024');
      B.setAttribute('position',(-0.345+br/2).toFixed(4)+' 0.575 -1.30');
      this.hudTekst('#mBaasPct',Math.round(d*100)+'%','#ff6a7d',0.034,0.16,'hBaasPct');
      B.setAttribute('material','color:'+(d>0.5?'#ff3d55':(d>0.2?'#ffb03a':'#ffe45c'))+
        ';shader:flat;depthWrite:false;depthTest:false'); },

    // Een beschadigd schip brandt op de plekken die op zijn plaatje branden. De
    // vlam wakkert grillig aan en uit, laat een vuurstreep achter waar hij net
    // was, en daarachter een rookspoor dat langzaam uitdijt.
    brandTick:function(e,s){
      if(!e.plaat||!e.plaat.vuur||e.fase<1||!e.bb) return;
      let pl=e.plaat.vuur[e.rij];
      if(!pl||!pl.length) return;
      // Op een schip van 24 meter valt één pluimpje niet op. Grote schepen
      // krijgen extra brandhaarden, verspreid over de romp.
      if(e.bw>=14&&pl.length<3){
        if(!e.vuurX){
          e.vuurX=pl.slice();
          const n=(e.bw>=22)?4:3;
          for(let q=pl.length;q<n;q++)
            e.vuurX.push({x:(q%2?0.26:-0.26)*(0.6+Math.random()*0.5),
                          y:(q<2?0.10:-0.14)+(Math.random()-0.5)*0.16,n:40}); }
        pl=e.vuurX; }
      if(e.p.distanceTo(this.kop)>BRAND_VER) return;
      e.brT2=(e.brT2||0)-s;
      if(e.brT2>0) return;
      const heftig=(e.fase>=2)?1.7:1;
      e.brT2=(0.045+Math.random()*0.05)/heftig;
      for(let i=0;i<pl.length;i++){
        const P2=pl[i];
        const px=e.p.x+P2.x*e.bw*0.92, py=e.p.y+P2.y*e.bh*0.92, pz=e.p.z+1;
        const fel=0.55+Math.random()*0.95;
        const vg=Math.max(1,Math.min(2.6,e.bw/10));    // een kolos brandt groter
        this.vonk(px,py,pz,0xfff2c0,1,2.2*fel*heftig*vg,0.16);
        this.vonk(px,py,pz,0xffb03a,2,3.4*fel*heftig*vg,0.30);

    // Een gehavende baas rookt en vonkt over zijn hele romp; hoe zwaarder

        a.setXY(0,u0,v0+hh); a.setXY(1,u0+w,v0+hh);

    // ---- oversteken: scheert langs je heen, keert om, komt dichterbij terug ----
    oversteek:function(e,s,naar,afst,sp){
      const T=TYPE[e.tp];
      const band=OVER[Math.min(2,e.stap)];
      // eerst de goede afstand pakken
      if(Math.abs(afst-band)>3) e.p.addScaledVector(naar,(afst>band?1:-1)*sp*(afst>95?3.4:1.1)*s);
      // dan zijwaarts langs je heen, loodrecht op de kijklijn
      const t=this.OT||(this.OT=new THREE.Vector3());
      t.set(-naar.z,0,naar.x).normalize();
      e.p.addScaledVector(t,e.zij*sp*2.4*s);
      e.p.y+=Math.sin(e.t*0.8+e.i0)*4*s;
      // hoever is hij opzij gekomen? voorbij de grens keert hij om en komt dichterbij
      // hoek blijft binnen +/-90 graden, anders klapt de meting om en flipt hij elk frame
      const hoek=Math.atan2(e.p.x,Math.max(1,-e.p.z));
      const grens=1.12;                              // ~64 graden: keren vóór hij naast je hangt
      e.flipT=(e.flipT||0)-s;
      if(e.flipT<=0&&Math.abs(hoek)>grens){          // te ver opzij: keren, en dichterbij terug
        e.zij*=-1; e.flipT=2.5;
        e.stap=Math.min(2,e.stap+1); e.overs=(e.overs||0)+1; }
      // Keren alleen was niet genoeg: de baan duwde hem meteen weer over de grens
      // en dan bleef hij pal naast je hangen. Voorbij de grens wordt hij nu ook
      // echt teruggedraaid naar voren.
      const max2=1.22;
      if(Math.abs(hoek)>max2){
        const R2=Math.hypot(e.p.x,e.p.z)||1;
        const doel=Math.sign(hoek)*max2;
        const nh=hoek+(doel-hoek)*Math.min(1,s*3.0);
        e.p.x=Math.sin(nh)*R2; e.p.z=-Math.cos(nh)*R2; }
      e.bT=(e.bT||0)-s;
      if(e.bT<=0){ e.bT=((T.cd||3.4)*0.7+Math.random()*1.2)*VUURTEMPO;
        this.spuw(e,T.sal||1,0.06); } },

    // ---- vaste rondvlucht: van punt naar punt, en dan weer van voren af aan ----
    routeBaan:function(e,s,sp){
      const R=ROUTES[e.route]; if(!R){ e.stijl='halte'; return; }
      const p=R[e.rp%R.length];
      const d=this.RT||(this.RT=new THREE.Vector3());
      d.set(p[0]*e.rs*e.rm, 1.6+p[1]*e.rs, p[2]*e.rs);
      const naarPunt=this.RT2||(this.RT2=new THREE.Vector3());
      naarPunt.subVectors(d,e.p);
      const afst=naarPunt.length();
      if(afst<14){ e.rp++; e.rondjes=(e.rp>=R.length)?((e.rondjes||0)+1):(e.rondjes||0);
        if(e.rp>=R.length) e.rp=0;
        return; }
      naarPunt.multiplyScalar(1/afst);
      // vloeiend bijsturen in plaats van hoekig omklappen
      if(!e.rv) e.rv=naarPunt.clone();
      e.rv.lerp(naarPunt,Math.min(1,s*1.8)).normalize();
      e.p.addScaledVector(e.rv,sp*2.3*s);
      e.bT=(e.bT||0)-s;
      if(e.bT<=0){ e.bT=((TYPE[e.tp].cd||3.4)*0.8+Math.random()*1.4)*VUURTEMPO;
        this.spuw(e,TYPE[e.tp].sal||1,0.06); } },

    // ---- gedragsprofielen: alleen de zijwaartse beweging verschilt ----
    profiel:function(e,s,naar,afst,sp){
      const zij=(e.mode==='nader')?0.55:1.0;
      const P=e.prof;

      if(P==='sluiper'){                              // sluipwesp: sprong, 2s stil, sprong
        e.ex.h=(e.ex.h||0)-s;
        if(e.ex.h<=0){
          if(e.ex.spr){ e.ex.spr=0; e.ex.h=2.0;       // aangekomen: 2 seconden hangen
            e.ex.tel=(e.ex.tel||0)+1;
            if(e.ex.tel%(2+Math.floor(Math.random()*2))===0) this.spuw(e,1,0.05); }
          else { e.ex.spr=1; e.ex.h=0.5;              // nieuwe plek kiezen
            e.ex.dx=(Math.random()-0.5)*46-e.p.x;
            e.ex.dy=(1.6+(Math.random()*16-6))-e.p.y; } }
        if(e.ex.spr){ e.p.x+=e.ex.dx*s/0.5; e.p.y+=e.ex.dy*s/0.5; } }

      else if(P==='formatie'){
        if(e.form&&e.form.lead&&e.form.lead.live){    // vleugel volgt de punt
          const L=e.form.lead;
          e.p.x+=((L.p.x+e.form.ox)-e.p.x)*Math.min(1,s*3.5);
          e.p.y+=((L.p.y+e.form.oy)-e.p.y)*Math.min(1,s*3.5);
          e.p.z+=((L.p.z+e.form.oz)-e.p.z)*Math.min(1,s*3.5);
          e.mode=L.mode; e.stap=L.stap; }
        else { e.form=null; e.p.x+=Math.cos(e.t*0.9)*7*s*zij; } }

      else if(P==='strafer'){ e.p.x+=Math.cos(e.t*0.55+e.i0)*26*s*zij;
                              e.p.y+=Math.sin(e.t*0.7)*5*s*zij; }

      else if(P==='cirkel'){ e.ex.a=(e.ex.a||e.i0)+s*0.85;
                             e.p.x+=Math.cos(e.ex.a)*22*s*zij;
                             e.p.y+=Math.sin(e.ex.a*0.7)*9*s*zij; }

      else if(P==='kruiper'){ e.p.y+=Math.sin(e.t*0.5)*3*s*zij;
                              e.p.x+=Math.cos(e.t*0.35)*4*s*zij; }

      else if(P==='duiker'){                          // valt aan tot vlakbij en trekt terug
        if(!e.ex.f) e.ex.f=1;
        if(e.ex.f===1){ if(afst>10+e.r) e.p.addScaledVector(naar,sp*1.5*s);
                        else { e.ex.f=2; this.spuw(e,1,0.06); } }
        else { e.p.addScaledVector(naar,-sp*1.1*s);
               if(afst>AFST[Math.min(2,e.stap)]+e.r) e.ex.f=1; }
        e.p.x+=Math.sin(e.t*3.0)*7*s; }

      else if(P==='drijver'){ e.p.x+=Math.cos(e.t*0.3)*2.5*s; }

      // ---- manoeuvres uit het echte luchtgevecht ----

      else if(P==='immel'){
        // IMMELMANN: duikt langs je heen, klimt dan steil en komt van bovenaf terug
        e.ex.f=e.ex.f||1;
        if(e.ex.f===1){                                  // langs je heen, laag
          e.p.y-=6*s; e.p.x+=e.i0>3?9*s:-9*s;
          if(afst<20+e.r||e.p.y<this.kop.y-16) e.ex.f=2; }
        else if(e.ex.f===2){                             // steil omhoog, snelheid inruilen voor hoogte
          e.p.y+=14*s; e.p.x*=(1-Math.min(0.9,s*0.5));
          if(e.p.y>this.kop.y+16){ e.ex.f=3; e.cd=0; } }
        else {                                           // van boven weer op je af
          e.p.y-=4*s;
          if(e.p.y<this.kop.y+2){ e.ex.f=1; e.i0=(e.i0>3)?1:5; } } }

      else if(P==='moeder'){
        // Hangt stil op afstand en vuurt. Bij elke treffer laat hij een broedsel
        // los. LET OP: in deze functie bestaat de afkorting T niet — de andere
        // takken schrijven daarom ook TYPE[e.tp] voluit.
        const M=TYPE[e.tp];
        if(afst>54) e.p.addScaledVector(naar,(M.sp||4)*s*1.4);
        // Wiegen om een ankerpunt. Een optelling per beurt zou hem laten wegdrijven
        // en dan kruipt hij ook steeds dichterbij.
        if(e.ax===undefined){ e.ax=e.p.x; e.az=e.p.z; }
        e.p.x=e.ax+Math.sin(e.t*0.16)*6;
        e.p.y+=((this.kop.y+3)-e.p.y)*Math.min(1,s*0.5);
        e.bT=(e.bT||0)-s;
        if(e.bT<=0){ e.bT=(M.cd||5)+Math.random()*1.2; this.spuw(e,M.sal||3,0.10); } }

      else if(P==='broed'){
        // Het broedsel zelf: recht op je af, en vlak voor je één keer vuren.
        const B2=TYPE[e.tp];
        e.p.addScaledVector(naar,(B2.sp||14)*2.3*s);
        if(afst<34&&!e.ex.gaf){ e.ex.gaf=1; this.spuw(e,1,0.04); }
        if(afst<16){ e.p.y+=9*s; e.p.x+=((e.i0>3)?1:-1)*14*s; } }

      else if(P==='splitser'){
        // SPLIT-S: na elke aanval een halve looming omlaag en weg, om je vizier te breken
        e.ex.h=(e.ex.h||0)-s;
        if(e.ex.h<=0){ e.ex.h=3.2+Math.random()*1.6; e.ex.rol=1.4; this.spuw(e,1,0.05); }
        if(e.ex.rol>0){ e.ex.rol-=s;

        else { e.p.y+=6*s*Math.min(1,(this.kop.y-e.p.y)*0.2);
               e.p.x+=Math.cos(e.t*0.6)*6*s; } }

      else if(P==='scissors'){
        // SCISSORS: korte omkeringen om je te laten overschieten
        e.ex.sc=(e.ex.sc||0)-s;
        if(e.ex.sc<=0){ e.ex.sc=0.7+Math.random()*0.5; e.ex.zw=-(e.ex.zw||1); }
        e.p.x+=(e.ex.zw||1)*24*s;
        e.p.y+=(e.ex.zw||1)*7*s; }

      else if(P==='yoyo'){
        // LOW YO-YO: dipt omlaag om snelheid te winnen en klimt er weer uit
        e.ex.a=(e.ex.a||e.i0)+s*1.1;
        e.p.y+=Math.sin(e.ex.a)*13*s;

        if(Math.sin(e.ex.a)>0.95&&e.cd>0.4) e.cd=0.2; }   // vuurt bovenin de boog

      else if(P==='barrel'){
        // BARREL ROLL: schroeft om zijn aanvliegas heen
        e.ex.a=(e.ex.a||e.i0)+s*1.6;
        e.p.x+=Math.cos(e.ex.a)*17*s;
        e.p.y+=Math.sin(e.ex.a)*11*s; }

      else { e.p.x+=Math.sin(e.t*1.4)*5*s*zij; } },

    // Zet een vijand opnieuw neer, ver vóór je, met een frisse aanvliegroute.
    opnieuwVoor:function(e){
      const hk=(Math.random()-0.5)*1.25;               // binnen je blikveld
      const d=95+Math.random()*45;
      e.p.set(Math.sin(hk)*d, this.kop.y+(Math.random()-0.5)*14, -Math.cos(hk)*d);
      e.zij=(e.p.x>=0)?-1:1;                           // kruist naar het midden
      e.stap=0; e.flipT=0; e.omT=0;
      e.t=Math.random()*3; e.cd=0.5+Math.random()*1.2;
      if(e.ex) e.ex={};
      if(e.bb){ e.bb.m.position.copy(e.p); e.bb.m.rotation.z=0; }
      e.rol=0; },

    baan:function(e,s){
      if(e.dood){ this.doodBaan(e,s); return; }
      // De spiraalwerper stuurt zichzelf: hij staat stil terwijl hij vuurt en
      // sprint daarna weg. Zijn gewone vlieggedrag zou dat overschrijven.
      // een neerstortend spook laat een zwarte sliert achter
      if(e.onzicht&&e.dood&&!e.dood2){
        e.valT=(e.valT||0)-s;
        if(e.valT<=0){ e.valT=0.05;
          this.rook(e.p.x,e.p.y,e.p.z,true,2.6,2.6,0);
          this.vonk(e.p.x,e.p.y,e.p.z,0xff8a3d,2,3.0,0.35); } }
      if(e.spiraal&&!e.dood2){
        // ONZICHTBAAR, punt. Zijn vuur en rook zijn zijn zichtbaarheid.
        if(e.bb&&e.bb.m&&e.bb.m.visible&&!e.dood) e.bb.m.visible=false;
        if(this.spookTijd(e,s)) return;
        this.spookBrand(e,s);
        this.spiraalTick(e,s); return; }
      const eye=this.tmp.copy(this.kop);
      const T=TYPE[e.tp];
      const naar=new THREE.Vector3().subVectors(eye,e.p);
      const afst=naar.length(); naar.normalize();
      e.t+=s; e.cd-=s;
      const sp=T.sp;

      // ---- vortex: wie gevangen is verliest zijn eigen koers volledig ----
      // Hij pakt METEEN alles binnen zijn bereik. Eerst groeide hij van 28 naar
      // 70 m, waardoor de eerste seconde bijna niets gebeurde.
      const zr=(this.zuigT>0)?(ZUIGR*(0.92+0.08*(1-this.zuigT/6))):0;
      const gez=(this.zuigT>0&&this.zuigP&&e.prof!=='baas'&&
                 e.p.distanceTo(this.zuigP)<zr);
      if(gez){
        const v=this.ZV||(this.ZV=new THREE.Vector3());
        v.subVectors(this.zuigP,e.p);
        const d=Math.max(0.6,v.length());
        v.multiplyScalar(1/d);
        e.p.addScaledVector(v,Math.min(52,11+d*1.35)*s);         // met kracht naar binnen
        const t2=this.ZT||(this.ZT=new THREE.Vector3());
        t2.set(-v.z,0,v.x).normalize();
        // een beetje draaikolk mag, maar niet zoveel dat hij blijft cirkelen
        e.p.addScaledVector(t2,Math.min(9,d*0.30)*s);
        e.p.y+=Math.sin(e.t*3+e.i0)*1.4*s;
        e.flash=0.06; }
      else if(e.ring){                                // hangt in een baan om de speler
        const R=e.ring;
        if(afst>R.r+4) e.p.addScaledVector(naar,sp*(afst>95?3.2:1.4)*s);
        else { R.a+=R.dr*s;
          R.w=(R.w||0)+s;
          if(R.w>7+Math.random()*6){ R.w=0; R.dr*=-1; }        // wisselt af en toe van kant
          const str=R.r+Math.sin(e.t*0.35+e.i0)*6;             // straal ademt in en uit
          const doelx=Math.cos(R.a)*str, doelz=Math.sin(R.a)*str;
          e.p.x+=(doelx-e.p.x)*Math.min(1,s*1.6);
          e.p.z+=(doelz-e.p.z)*Math.min(1,s*1.6);
          e.p.y+=Math.sin(e.t*0.7+e.i0)*4*s;
          e.bT=(e.bT||0)-s;
          if(e.bT<=0){ e.bT=((TYPE[e.tp].cd||3.4)+Math.random()*1.6)*VUURTEMPO;
            this.spuw(e,TYPE[e.tp].sal||1,0.06); } } }
      else if(e.prof==='baas'){ this.baasBaan(e,s,naar,afst); }
      else if(e.prof==='duiker'){ this.profiel(e,s,naar,afst,sp);
        if(e.mode==='nader'&&afst>AFST[Math.min(2,e.stap)]+e.r*1.3+1.2) this.halte(e,s,naar,afst,sp*0.4); }
      else if(e.stijl==='route'){ this.routeBaan(e,s,sp); }
      else if(e.stijl==='over'){ this.oversteek(e,s,naar,afst,sp); }
      else if(e.prof==='moeder'||e.prof==='broed'){
        this.profiel(e,s,naar,afst,sp); }        // die twee bepalen hun eigen afstand
      else { this.halte(e,s,naar,afst,sp); this.profiel(e,s,naar,afst,sp); }
      if(e.ring&&!gez) this.profiel(e,s,naar,afst,sp*0.3);

      // ---- botsing met de speler ----
      const dm=e.p.distanceTo(eye);
      // Een schip dat al neerstort doet je niets meer. Zonder dit nam de hele
      // vloot je mee de dood in zodra de baas viel: tien wrakken tegelijk die
      // dwars door je heen tuimelen.
      if(dm<e.r+1.4&&!e.intro&&!e.dood&&!e.dood2&&!e.vrede){ this.raakMij(2+e.sc*0.2);
        e.p.addScaledVector(naar,-(e.r+2.6-dm)*3);

      // ---- sprite bijwerken ----
      if(e.romp){ e.romp.position.copy(e.p); e.romp.rotation.y+=s*1.1; e.romp.rotation.x+=s*0.7; }

    // =====================================================
    //  GOLVEN
    // =====================================================
    // ---- willekeur met een zaadje: elke golf ziet er elke keer hetzelfde uit ----
    dobbel:function(z){ this.zaad=(this.zaad*1103515245+12345+z)&0x7fffffff;
      return this.zaad/0x7fffffff; },

    // ---- soorten van dit level, gesorteerd van licht naar zwaar ----
    levelSoorten:function(){
      const L=NIVEAU[Math.min(NIVEAU.length-1,this.level-1)].slice();
      // Het venster schuift op, dus vanaf level 9 vielen de kleine schepen er
      // helemaal uit en bestond een golf alleen nog uit kolossen. Dan is er niets
      // meer om je aan af te meten en oogt alles even groot. Er blijven daarom
      // altijd een paar snelle kleintjes meedoen.
      const heeftKlein=L.some(function(t){ return TYPE[t].br<=7; });
      if(!heeftKlein){
        const kl=[];
        for(let t=0;t<TYPE.length;t++) if(TYPE[t].br<=7&&TYPE[t].prof!=='baas') kl.push(t);
        kl.sort(function(a,b){ return TYPE[b].hp-TYPE[a].hp; });   // de taaiste kleintjes
        const n=Math.min(3,kl.length);
        for(let i=0;i<n;i++) if(L.indexOf(kl[i])<0) L.push(kl[i]); }
      L.sort(function(a,b){ return TYPE[a].hp-TYPE[b].hp; });
      return L; },

    // ---- een golf is een lijstje aanvallen: {tp, n, t, form} ----
    golfPlan:function(w){
      const S=this.levelSoorten();
      // op MAAT indelen, niet op taaiheid: de HAULER is taai noch klein maar reusachtig
      const klein=S.filter(function(t){ return TYPE[t].br<=7; });
      const mid  =S.filter(function(t){ return TYPE[t].br>7&&TYPE[t].br<16; });
      const groot=S.filter(function(t){ return TYPE[t].br>=16; });
      const k=function(i){ return klein.length?klein[i%klein.length]:S[0]; };
      const m=function(i){ return mid.length?mid[i%mid.length]:k(i); };
      const g=function(i){ return groot.length?groot[i%groot.length]:m(i); };
      const R=this.dobbel.bind(this);
      const plan=[];
      // hoeveel er hoogstens tegelijk van één soort mogen: hoe groter, hoe minder
      const cap=function(tp,n){ const b=TYPE[tp].br;
        const mx=(b<=7)?22:((b<=12)?9:((b<=17)?4:2));
        return Math.max(1,Math.min(mx,Math.round(n))); };
      const self=this, L=this.level;
      if(!this.lvlGehad||this.lvlGehadL!==L){ this.lvlGehad={}; this.lvlGehadL=L; }
      const kiesVorm=function(seed){
        const lijst=(L<=1)?['rij','wig','slinger']
                  :(L<=3)?['rij','wig','slinger','zuil','tang','ring','ring']
                  :['rij','wig','slinger','zuil','tang','ring','ring','spiraal'];
        return lijst[Math.floor(R(seed*13+7)*lijst.length)%lijst.length]; };
      let vI=0;
      const zet=function(tp,n,t,form){
        plan.push({tp:tp,n:cap(tp,n),t:t,form:form||0,vorm:kiesVorm(++vI)}); };
      const zwaar=1+(this.level-1)*0.16;               // latere levels: meer tegelijk

      // Tien golven per level, dus de opbouw moet in tien stappen rond zijn:
      // kennismaken, opvoeren, en vanaf golf 6 vol aan de bak.
      const o=(this.level*3+w*2);
      if(w===1){ zet(k(o),9,0); zet(k(o+1),9,5); }
      else if(w===2){ zet(k(o+2),10,0); zet(m(o),3,3.5); }
      else if(w===3){ zet(m(o+1),6,0); zet(k(o+3),10,5); }
      else if(w===4){ zet(g(o),2,0); zet(m(o+2),5,4); }
      else if(w===5){ for(let b=0;b<3;b++) zet(k(o+b),10,b*3.2);
                      zet(m(o+1),3,5); }
      else {
        // de laatste vijf golven zijn de zware: drie tot vijf aanvallen
        const n=2+Math.floor(R(w)*3);
        for(let a=0;a<=n;a++){
          const r=R(w*7+a);
          const t=a*(2.2+R(w+a)*3.0);
          if(r<0.40) zet(k(o+a+Math.floor(R(a)*5)),(9+w)*zwaar,t);
          else if(r<0.76){ const tp=m(o+a+Math.floor(R(a+3)*5));
            zet(tp,(3.5+w*0.55)*zwaar,t,TYPE[tp].prof==='formatie'?1:0); }
          else zet(g(o+a+Math.floor(R(a+5)*5)),(1+w*0.26)*zwaar,t); }
        if(w>=8) zet(g(o+Math.floor(R(w)*5)),1+Math.floor((w-6)/2),1.5);
      }
      // HET SPOOK hoort gewoon in het golfplan, als laatste groep. Zo komt hij
      // automatisch pas als de rest dood is, staat hij er dus alleen, en wacht de
      // golf op hem — zonder aparte regels of eigen klokje.
      if(this.level>=SPIR_VANAF&&SPIR_GOLVEN.indexOf(w)>=0){
        let tp=-1, best=0;
        for(let t=0;t<TYPE.length;t++){ const T=TYPE[t];
          if(!T||T.prof==='baas') continue;
          if(T.br>best&&T.br<=26){ best=T.br; tp=t; } }
        if(tp>=0) plan.push({tp:tp,n:1,t:1.6,form:0,vorm:'rij',spook:1});
      }
      // Wie dit level nog niet is langsgekomen, krijgt vanaf golf 4 voorrang op één
      // aanval. Met tien golven is er anders geen tijd meer om iedereen te tonen.
      if(w>=4&&this.lvlGehad){
        const wacht=S.filter(function(t){ return !self.lvlGehad[t]; });
        if(wacht.length){
          const tp=wacht[Math.floor(R(w*3)*wacht.length)%wacht.length];
          // NIET de spookgroep overschrijven: die heeft zijn eigen schip nodig
          // en moet de laatste blijven.
          const kandidaat=[];
          for(let q=0;q<plan.length;q++) if(!plan[q].spook) kandidaat.push(q);
          if(kandidaat.length){
            const i2=kandidaat[Math.floor(R(w*5)*kandidaat.length)%kandidaat.length];
            plan[i2].tp=tp; plan[i2].n=cap(tp,plan[i2].n); } } }
      for(let i=0;i<plan.length;i++) this.lvlGehad[plan[i].tp]=1;

      // Geen twee aanvallen van dezelfde soort in één golf: een dubbele wordt
      // omgeruild voor een soort uit dezelfde maatklasse die nog niet meedoet.
      const bezet={};
      for(let i=0;i<plan.length;i++){ const a2=plan[i];
        if(!bezet[a2.tp]){ bezet[a2.tp]=1; continue; }
        const br=TYPE[a2.tp].br;
        const eigen=(br<=7)?klein:((br<16)?mid:groot);
        const bak=eigen.concat(mid,klein,groot);     // eerst zijn eigen maat, dan de rest
        for(let q=0;q<bak.length;q++){ const alt=bak[(q+i)%bak.length];
          if(!bezet[alt]){ a2.tp=alt; break; } }
        bezet[a2.tp]=1; }

      // een golf blijft binnen wat het veld aankan
      let tot=0; for(let i=0;i<plan.length;i++) tot+=plan[i].n;
      if(tot>46){ const f=46/tot;
        for(let i=0;i<plan.length;i++) plan[i].n=Math.max(1,Math.round(plan[i].n*f)); }
      return plan; },

    nieuweGolf:function(){
      this.wave++;
      if(this.wave>GOLVEN){ this.baasKomt(); return; }
      this.plan=this.golfPlan(this.wave);
      this.planT=0; this.rij=[]; this.veldMax=0; this.gi=0; this.groepT=0;
      for(let i=0;i<this.plan.length;i++) this.plan[i].uit=0;
      this.toonMelding('LEVEL '+this.level+'   WAVE '+this.wave+' / '+GOLVEN,'#35e8ff');
      // Vanaf level 4 hangt er in elke golf een spiraalwerper: taai, traag, en
      // hij spuwt om de vijf tellen acht spiralende zoekers. Hoogstens twee.
      // Hij hoort bij een golf, net als elke andere vijand: vanaf golf 3, en niet
      // in elke golf. Hoogstens twee tegelijk in het veld.

      this.state='vechten'; },

    // Op tijd een spiraalwerper neerzetten, als er nog plek is.
    // Een spook neerzetten. Alles wat hij nodig heeft zit hier, zodat het
    // golfplan hem net zo aanroept als elke andere groep.
    // ---- SPECIALE AANVALLEN VAN GROTE SCHEPEN ----
    // Sjoerd: "nu is soms saai recht door; een ufo mag wel een 6x wesp

    grootAanval:function(e){
      const soort=(e.tp||0)%3, self=this;
      if(soort===0){
        // DE WESPENZWERM: zes sluipwespen die schokkend op je af komen
        for(let i=0;i<GROOT_WESP;i++){
          const hk=(i/GROOT_WESP)*6.283;
          this.sigNa(i*0.07,function(){
            if(!e.live||e.dood) return;
            const B=self.sigSchot(e,self.sigRicht(e,Math.cos(hk)*0.42,Math.sin(hk)*0.34),
              {sp:19,hp:WESP_HP,dmg:8,zoek:1,draai:2.6,groot:1.8,
               neus:2,kleur:0xffb03a,stijl:2,sfS:4.2,kop:(e.tp||0)%25});
            if(B){ B.zwaar=1; B.groot2=1.9; } }); }
        this.toonMelding('WASP SWARM','#ffb03a'); return; }
      if(soort===1){
        // DE MOKERSLAG: een enorme kop die je echt moet afbreken
        const B=this.sigSchot(e,this.sigRicht(e,0,0.04),
          {sp:15,hp:REUSRAKHP,dmg:22,zoek:1,draai:1.4,groot:3.4,
           neus:1,kleur:0xff3020,stijl:5,kop:(e.tp||0)%25});
        if(B){ B.zwaar=1; B.groot2=3.4; }
        this.toonMelding('HAMMER','#ff5a3c'); return; }
      // DE DRIETAND: drie zware koppen die samen aankomen
      for(let i=0;i<3;i++){
        const B=this.sigSchot(e,this.sigRicht(e,(i-1)*0.26,0.03),
          {sp:17,hp:GROOTRAKHP+4,dmg:14,zoek:1,draai:2.0,groot:2.4,
           neus:1,kleur:0xff7a30,stijl:3,kop:(e.tp||0)%25});
        if(B){ B.zwaar=1; B.groot2=2.4; } }
      this.toonMelding('TRIDENT','#ff7a30'); },

    spookZet:function(tp){
      const hk=(Math.random()-0.5)*1.2;
      const e=this.spawn(tp,{x:Math.sin(hk)*70, z:-(70+Math.random()*40),
                             y:this.kop.y+(Math.random()-0.5)*16});
      if(!e) return null;
      e.spiraal=1; e.spF='wacht'; e.spT=1.2;
      e.hp=e.hpM=SPIR_HP;
      e.sc*=1.25; e.r*=1.2; e.bw*=1.25; e.bh*=1.25;
      if(e.bb){ this.bbVrij(e.bb); e.bb=null; }
      e.onzicht=1; e.spookFase=0;
      this.toonGroot('WARNING  -  ENEMY NOT ON RADAR','#ff3d55');
      SND.alarm&&SND.alarm(0);

    // ---- aanvallen loslaten op hun eigen tijdstip ----
    // groep voor groep: de volgende komt pas als de vorige is opgeruimd
    planTick:function(s,levend){
      if(!this.plan) return true;
      if(this.gi===undefined) this.gi=0;
      if(this.gi>=this.plan.length) return (!this.rij.length&&levend===0);
      const a=this.plan[this.gi];
      if(!a.uit){ this.aanval(a); a.uit=1; this.groepT=0; return false; }
      if(this.rij.length||levend>0){ this.groepT=0; return false; }
      this.groepT=(this.groepT||0)+s;
      if(this.groepT>0.9){ this.gi++; this.groepT=0;
        if(this.gi<this.plan.length) this.toonMelding('WAVE '+this.wave+'  -  GROUP '+(this.gi+1),'#8fd8ec'); }
      return false; },

    aanval:function(a){
      // Een spookgroep: één schip, maar met zijn eigen gedrag en zonder tekening.
      if(a.spook){ this.spookZet(a.tp); this.veldMax+=1; return; }
      const n=Math.max(1,a.n|0);
      if(a.form){ this.formatie(a.tp,n); this.veldMax+=Math.min(n,6); return; }
      const b=TYPE[a.tp].br;
      const gelijk=Math.min(n,(b<=7)?9:((b<=12)?5:((b<=17)?3:1)));
      this.veldMax+=gelijk;
      this.vorm=a.vorm||'rij'; this.vormI=0; this.vormN=n;
      // elke groep krijgt zijn eigen plek aan de hemel, ver van de vorige
      const vorigeH=(this.vormC&&this.vormC.hoek)||0;
      let hk;
      do { hk=(Math.random()-0.5)*1.7; } while(Math.abs(hk-vorigeH)<0.55);
      this.vormC={hoek:hk, oy:(Math.random()-0.5)*26};
      // ongeveer de helft van de groepen steekt over in plaats van stil te gaan hangen
      this.vormS=(a.vorm==='ring')?'halte'
        :((Math.random()<0.22)?'route'
        :((a.vorm==='slinger'||Math.random()<0.45)?'over':'halte'));
      this.vormZ=(Math.random()<0.5)?-1:1;
      const rl=(this.level<=3)?ROUTEVROEG:ROUTENAMEN;   // vroege levels: alleen banen die voor je blijven
      this.vormR=rl[Math.floor(Math.random()*rl.length)];
      this.vormRs=0.85+Math.random()*0.4;              // de een vliegt een ruimere baan dan de ander
      this.vormRm=(Math.random()<0.5)?-1:1;            // en soms gespiegeld
      for(let i=0;i<gelijk;i++) this.spawnVorm(a.tp);
      for(let i=gelijk;i<n;i++) this.rij.push(a.tp); },   // de rest wacht op een lege plek

    // ---- waar en hoe een schip binnenkomt ----
    spawnVorm:function(tp){
      const i=this.vormI++, n=Math.max(1,this.vormN||1), V=this.vorm||'rij';
      const mid=(n-1)/2, sp=(i-mid);
      let o={};
      if(V==='wig'){                                    // punt vooraan, vleugels erachter
        o={x:sp*8, z:-108-Math.abs(sp)*8, y:1.6+sp*1.6}; }
      else if(V==='rij'){                               // schouder aan schouder
        o={x:sp*9.5, z:-112-Math.random()*8, y:1.6+(Math.random()*7-3.5)}; }
      else if(V==='slinger'){                           // achter elkaar aan, één sliert
        o={x:Math.sin(i*0.9)*11, z:-106-i*10, y:1.6+Math.cos(i*0.7)*5}; }
      else if(V==='zuil'){                              // boven elkaar, een muur
        o={x:(i%2?1:-1)*(5+Math.floor(i/2)*3), z:-114-Math.random()*6,
           y:1.6+(i-mid)*5}; }
      else if(V==='tang'){                              // van links en van rechts tegelijk
        const L=(i%2===0)?-1:1;
        o={x:L*(46+Math.floor(i/2)*5), z:-92-Math.floor(i/2)*9, y:1.6+(Math.random()*9-4)}; }
      else if(V==='ring'){                              // komen om je heen hangen
        const a2=(i/n)*6.2832+Math.random()*0.3;
        o={x:Math.cos(a2)*95, z:Math.sin(a2)*95, y:1.6+(Math.random()*14-5), ring:a2}; }
      else if(V==='spiraal'){                           // draaien naar binnen
        const a2=i*1.15;
        o={x:Math.cos(a2)*(24+i*3), z:-108-i*6, y:1.6+Math.sin(a2)*(12+i*1.2)}; }
      if(V!=='ring'&&this.vormC){                       // de hele formatie draait mee naar zijn hoek
        const c=Math.cos(this.vormC.hoek), sn=Math.sin(this.vormC.hoek);
        const lx=o.x, lz=o.z;
        o.x=lx*c-lz*sn; o.z=lx*sn+lz*c;
        o.y=(o.y||1.6)+this.vormC.oy; }
      if(V!=='ring'&&this.vormS==='over'){ o.stijl='over'; o.zij=this.vormZ; }
      if(V!=='ring'&&this.vormS==='route'){
        o.stijl='route'; o.route=this.vormR; o.rs=this.vormRs; o.rm=this.vormRm;
        o.rp=i%ROUTES[this.vormR].length;              // verspreid over de baan, als kralen
        const q=ROUTES[this.vormR][o.rp];
        o.x=q[0]*this.vormRs*this.vormRm; o.y=1.6+q[1]*this.vormRs; o.z=q[2]*this.vormRs; }
      const e=this.spawn(tp,o);
      if(e&&V==='ring'){ e.ring={a:o.ring,r:34+Math.random()*8,
        dr:(Math.random()<0.5?-1:1)*(0.16+Math.random()*0.14)}; }
      return e; },

    // ---- drie in een driehoek: de punt stuurt, de vleugels volgen ----
    formatie:function(tp,n){
      const groepen=Math.max(1,Math.round(n/3));
      for(let gi=0;gi<groepen;gi++){
        const x0=(Math.random()-0.5)*40, z0=-74-Math.random()*22;
        const lead=this.spawn(tp,{x:x0,z:z0});
        if(!lead) return;
        const br=TYPE[tp].br;
        for(let w=0;w<2;w++){
          const v=this.spawn(tp,{x:x0+(w?br:-br),z:z0-br*0.8});
          if(v) v.form={lead:lead,ox:(w?br:-br),oy:0,oz:-br*0.8}; } } },

    levelKlaar:function(){

      // De baas is dood: een echte overwinning. Je gaat het volgende level dus
      // met volle kracht in — anders sleept een zwaar gevecht je de rest van het
      // spel achterna.
      if(this.power<100){
        this.power=100;
        this.toonGroot('HULL RESTORED','#8fd84a');
        this.vonk(this.kop.x,this.kop.y,this.kop.z-6,0x8fd84a,14,4,1.0); }
      // Alles wat nog vliegt stort neer en al het vijandelijke vuur verdwijnt.
      for(let i=0;i<this.enemies.length;i++){ const e=this.enemies[i];
        if(e.live&&!e.dood&&!e.dood2&&e.prof!=='baas'){ e.vrede=1; this.kill(e); } }
      for(let i=0;i<this.vij.length;i++){ const B=this.vij[i]; if(!B.live) continue;
        this.vijVrij2(B);
        this.vonk(B.m.position.x,B.m.position.y,B.m.position.z,0xffb03a,4,6,0.5); }
      this.state='rust'; this.rustT=RUST_TOTAAL; this.rustFase=0;
      this.wave=0;
      this.toonGroot('ROUND CLEAR','#8fd84a');
      SND.zeg('Round clear'); },

    // welke baas hoort bij dit level?
    baasKeus:function(L){

      if(!B.length) return (this.bazen||[])[0]||null;

    reusKeus:function(){
      const R=(this.bazen||[]).filter(function(b){ return b.gedrag==='reus'; });

    // Elke baas even sterk. Een oplopende kracht maakte de late gevechten

    baasEerder:function(naam){

    baasKomt:function(){

    // ---- de rustpauze zelf ----

    rustTick:function(s){

        this.level++;
        // In het zwart: opruimen wat dit level niet nodig heeft en de rest halen.
        const self=this; this.wachtLaden=1;

        this.hemelZet(); this.objZet();
        this.zaad=this.level*7919;
        if(!window.DEMO) bewaarVoortgang(this.level,this.punten,this.ults,this.contN);

    // =====================================================

    tick:function(t,dt){ if(this.dead) return; try{

        this.kijkD=(this.kijkD||new THREE.Vector3());
        co.getWorldQuaternion(this.kq||(this.kq=new THREE.Quaternion()));
        this.kijkD.set(0,0,-1).applyQuaternion(this.kq).normalize(); }
      if(this.RQ) this.RQ.e.copy(eye);

          ';transparent:true;shader:flat;depthWrite:false;depthTest:false'); }
      if(this.combo&&this.T-this.laatst>2.0) this.combo=0;

        const k=Math.max(0,this.blastT/0.45);

      for(const hid in this.wep){ const W=this.wep[hid]; if(!W.laz) continue;

        const L=W.laz, dt=0.25/L.n;

            e.bb.m.scale.set(e.bw,e.bh,1); } continue; }         // de parade stuurt hem zelf
        // Achter je vliegen mag, blijven hangen niet. Eerst duwde ik hem recht
        // naar voren, maar dat vocht met zijn eigen baan: op de grens hielden ze
        // elkaar in evenwicht en plakte hij ertegenaan. Nu maakt hij zijn rondje
        // AF — hij draait door in de richting waar hij toch al heen ging, achter
        // je langs, en komt er aan de andere kant weer uit.
        const xVoor=e.p.x;
        // Het spook telt NIET mee voor het einde van een golf. Deed hij dat wel,

        // moeilijk te vinden.

        // Het spook hoort bij zijn golf: de golf is pas af als hij ook dood is.
        if(!e.dood&&!e.dood2&&e.prof!=='baas') levend++;
        if(e.fase>=1&&!e.dood2) this.brandTick(e,s);

        // Dit is een spel dat alleen vooruit kijkt. Alles wat achter je zit, te
        // ver opzij, te hoog of te laag hangt heeft daar niets te zoeken: het
        // wordt weggehaald en opnieuw ver vóór je neergezet. Geen rondjes, geen
        // duwen — je houdt gewoon je handen vol aan wat vóór je gebeurt.
        if(!e.dood&&!e.dood2&&e.bb&&e.prof!=='baas'){
          const hk2=Math.atan2(e.p.x,-e.p.z);
          const hoogte=e.p.y-this.kop.y;
          const ver=Math.hypot(e.p.x,e.p.z);
          if(Math.abs(hk2)>WEG_HOEK||Math.abs(hoogte)>WEG_HOOG||ver>WEG_VER)

        // Zoals een vliegtuig een bocht maakt: naar links betekent rechterkant

          // ---- ZWERM-MOEDER: laat onderweg kleintjes vallen ----
          if(B.moeder>0){
            B.moedT=(B.moedT||MOEDER_ELK)-s;
            if(B.moedT<=0){ B.moedT=MOEDER_ELK; B.moeder--;
              const dd=B.dir.clone();
              dd.x+=(Math.random()-0.5)*0.5; dd.y+=(Math.random()-0.5)*0.4;
              dd.normalize();
              const N=this.sigSchot({p:q,plaat:null,rij:0,tp:0},dd,
                {van:q,sp:B.sp*0.85,hp:1,dmg:4,groot:0.6,neus:0,
                 kleur:0xff7a30,kop:B.kopNr,laatZoek:0.5});
              if(N){ N.zoek=1; N.draai=1.6; }
              this.vonk(q.x,q.y,q.z,0xff7a30,3,2.4,0.3); } }
          if(B.duikT>0){
            // tijdens de uitwijking stuurt hij niet naar jou maar opzij
            B.duikT-=s;
            const zij=this.DZ||(this.DZ=new THREE.Vector3());
            const op =this.DZ2||(this.DZ2=new THREE.Vector3());
            zij.set(-B.dir.z,0,B.dir.x).normalize();
            op.crossVectors(B.dir,zij).normalize();
            B.dir.addScaledVector(zij,Math.cos(B.duikH)*DUIK_KRACHT*s);
            B.dir.addScaledVector(op ,Math.sin(B.duikH)*DUIK_KRACHT*s);
            B.dir.normalize();
            B.o.copy(q); B.d=0; }
          else if(q.distanceTo(eye)>ZOEKSTOP){
            // Een echte raket stuurt op de DRAAISNELHEID van de zichtlijn: hij
            // mikt op waar je STRAKS bent, niet op waar je nu staat. Dat leest
            // veel strakker dan een raket die achter je aan hobbelt.
            const naarMij=this.tmp2||(this.tmp2=new THREE.Vector3());
            naarMij.subVectors(eye,q);
            const tijd=Math.min(2.2,naarMij.length()/Math.max(6,B.sp));
            if(this.kopV) naarMij.addScaledVector(this.kopV,tijd*VOORUIT);
            naarMij.normalize();
            // Een salvoraket draait veel strakker bij: hij moet na het uitwaaieren
            // in een boog terugkomen, niet rechtdoor de ruimte in vliegen.
            B.dir.lerp(naarMij,Math.min(1,(B.draai||ZOEKDRAAI)*s)).normalize();
            B.o.copy(q); B.d=0; } }
        else if(B.wieg){
          B.wf=(B.wf||Math.random()*6)+s*3.2;
          B.dir.x+=Math.sin(B.wf)*0.9*s; B.dir.normalize(); }
        // Wijd mag, maar daarna moet hij komen: na zijn vrije vlucht wordt elk
        // baasschot alsnog zoekend.
        // Geen uitzonderingen: elk schot dat nog niet zoekt, gaat het alsnog doen.
        // Wat een raket onderweg ook uitspookt — splijten, uitwijken, wachten —
        // uiteindelijk komt hij op je af.
        if(!B.zoek&&!B.laatZoek) B.laatZoek=LAATZOEK*1.6;
        if(B.laatZoek&&!B.zoek){
          B.leef=(B.leef||0)+s;
          if(B.leef>B.laatZoek){ B.zoek=1; B.draai=B.draai||LAATDRAAI;
            this.vonk(B.o.x+B.dir.x*B.d,B.o.y+B.dir.y*B.d,B.o.z+B.dir.z*B.d,
                      0xff8a3d,2,2.0,0.22); } }
        // ---- VLIEGSTIJLEN: hoe een raket zich door de lucht beweegt ----
        // Elke baas heeft zijn eigen stijl, zodat je aan de baan al ziet wie er
        // schiet. Ze werken bovenop het zoeken, niet ernaast.
        if(B.stijl){
          B.sf=(B.sf||Math.random()*6.283)+s*(B.sfS||3.0);
          if(B.stijl===2){                // SLUIPWESP: schokt, staat stil, schiet weer
            const puls=Math.sin(B.sf);
            B.sp=(B.sp0||B.sp)*(puls>0.2?1.9:(puls<-0.5?0.15:0.8)); }
          else if(B.stijl===3){
            // DE DUIKER: zakt kort weg alsof hij je mist en komt dan van ONDEREN.
            // De uitwijking duurt maar even; daarna telt alleen nog het zoeken,
            // anders schiet hij de ruimte in.
            B.vT=(B.vT||0)+s;
            if(B.vT<DUIKER_T){ B.dir.y-=1.0*s; B.dir.normalize(); }
            else if(B.vT<DUIKER_T*2){ B.dir.y+=1.3*s; B.dir.normalize(); } }
          else if(B.stijl===4){
            // DE VALK: hangt kort hoog en traag, valt dan in één keer omlaag.
            B.vT=(B.vT||0)+s;
            // Hij houdt zich eerst in en versnelt dan hard. Alleen de SNELHEID
            // verandert — een hoogteboog kostte zoveel afstand dat hij je niet
            // meer haalde.
            if(B.vT<VALK_T*2.2) B.sp=(B.sp0||B.sp)*0.72;
            else B.sp=(B.sp0||B.sp)*2.1; }
          else if(B.stijl===5){                // STOOTSGEWIJS: versnelt in vlagen
            B.sp=(B.sp0||B.sp)*(0.45+1.5*Math.max(0,Math.sin(B.sf))); }
        }
        // een ringkogel draait om je heen en klapt dan naar binnen
        if(B.draaiOm){

          // binnen te komen. Nu klapt hij in ruim twee tellen dicht.
          B.straal0=Math.max(0,B.straal0-s*RING_DICHT);
          const nr=this.sigRicht2(B,eye);
          B.dir.lerp(nr,Math.min(1,4.5*s)).normalize();
          // en zodra de cirkel klein is stopt het draaien: dan gaat hij op je af
          if(B.straal0<=0.06){ B.draaiOm=0; B.zoek=1; B.draai=3.0;
            // Nu pas draait hij naar binnen. De dreigingstoets rekent vanaf het
            // beginpunt, dus dat moet zijn HUIDIGE plek worden — anders lijkt hij
            // nog steeds zijwaarts te vliegen en volgt er geen waarschuwing.
            B.o.copy(kp.copy(B.o).addScaledVector(B.dir,B.d)); B.d=0;

        // vaste tijd liet hem ver weg splijten als hij traag was.

          const n=B.splijt; B.splijt=0;
          const q3=kp.copy(B.o).addScaledVector(B.dir,B.d);
          this.vonk(q3.x,q3.y,q3.z,0xff6a2a,7,6,0.7);
          for(let k=0;k<n;k++){
            const hk=(k/n)*6.283;
            const dd=B.dir.clone();
            dd.x+=Math.cos(hk)*0.42; dd.y+=Math.sin(hk)*0.42; dd.normalize();
            // De splijtstukken kregen GEEN zoek mee: die waaierden dus uiteen en
            // kwamen nooit meer terug. Nu zoeken ze allemaal.
            const N2=this.sigSchot({p:q3,plaat:null,rij:0},dd,
              {van:q3,sp:B.sp*1.5,hp:2,dmg:5,groot:0.7,zoek:1,draai:2.6,
               kop:B.kopNr,neus:1,kleur:0xff7a30,
               splijt:B.splijt2||0,sptijd:B.splijt2?1.1:0}); }
          this.vijVrij2(B); continue; }
        // Een rookspoor achter ELK vijandelijk schot: zo zie je hem van ver
        // aankomen en blijft zijn baan nog even hangen.
        if(true){

          if(B.rT<=0){ B.rT=SPOOR_ELK;
            const q2=kp.copy(B.o).addScaledVector(B.dir,B.d);

        const p=kp.copy(B.o).addScaledVector(B.dir,B.d);
        // De gloeiende neus vliegt mee en kijkt je altijd aan — geen gaten meer.
        // Staan Sjoerds getekende koppen klaar, dan hoeft de rode gloedstip niet
        // meer: die was groot en rood en zou zijn ontwerp overstemmen.
        // FOUT die Sjoerd zag: met zijn eigen koppen zette ik de gloed uit, maar
        // de KOP zelf werd in datzelfde blok bijgewerkt — dus die bleef op zijn
        // startplek hangen en je zag alleen rook. De kop staat nu apart.
        if(B.kop2){
          B.kop2.position.copy(p);
          B.kop2.lookAt(eye);
          const dz=p.distanceTo(eye);
          const basis=NEUS_MAAT*(B.groot2||(B.zwaar?1.8:1))*(1+Math.min(1.4,60/Math.max(6,dz))*0.5);
          const kg2=basis*(this.kopVak?KOP_PLAAT:KOP_BOL);

        // een vlammetje vlak achter de kop, zodat hij niet kaal oogt
        B.vT=(B.vT||0)-s;
        if(B.vT<=0){ B.vT=0.05;
          const vx=p.x-B.dir.x*1.6, vy=p.y-B.dir.y*1.6, vz=p.z-B.dir.z*1.6;
          this.vonk(vx,vy,vz,0xffd070,1,1.5*(B.zwaar?1.7:1),0.20,true);
          this.vonk(vx,vy,vz,0xff5a2a,1,2.2*(B.zwaar?1.7:1),0.28,true); }
        if(B.neus&&this.kopVak){ if(B.neus.visible) B.neus.visible=false; }
        else if(B.neus){
          B.neus.position.copy(p);
          B.neus.lookAt(eye);
          // Hij mag ademen — dat leest prettig — maar NOOIT helemaal doven, want
          // dan raak je hem even kwijt. Hij pulseert tussen half en vol.
          B.nf=(B.nf||Math.random()*6.283)+s*NEUS_PULS;
          const puls=NEUS_MIN+(1-NEUS_MIN)*(0.5+0.5*Math.sin(B.nf));
          B.neus.material.opacity=0.95*puls;
          const gr=NEUS_MAAT*(B.groot2||(B.zwaar?1.8:1))
            *(1+Math.min(1.4,60/Math.max(6,p.distanceTo(eye)))*0.5)
            *(0.88+puls*0.18);
          B.neus.scale.set(gr,gr,1);
          }
        // Het projectielplaatje van de VLOOTPLAAT is er helemaal uit: Sjoerds
        // eigen koppen zijn nu de raket. Zo zie je nooit meer het oude raketje
        // uit de atlas ertussen.

        if(B.buis){
          // Het lichaam wijst met zijn lengte langs de vliegrichting en draait niet

          B.buis.position.copy(p);
          B.buis.scale.set(Br,L,Br);
          this.richtAs(B.buis,B.dir);
          B.m.visible=false;
        } else this.richtQuad(B.m,p,B.dir,B.len||2.4,B.br||0.42);
        if(p.distanceTo(eye)<0.80){ this.raakMij(5); this.vijVrij2(B);
          this.vonk(p.x,p.y,p.z,0xff5a3c,6,7,0.6); if(window.PAUSED) return; continue; }
        if(B.d>B.md){ this.vijVrij2(B); } }

      // ---- brokstukken ----
      for(let i=0;i<this.brokken.length;i++){ const B=this.brokken[i]; if(!B.live) continue;
        B.life-=s*0.55;
        B.vy-=17*s;                                   // ze vallen
        B.m.position.x+=B.vx*s; B.m.position.y+=B.vy*s; B.m.position.z+=B.vz*s;
        B.m.rotation.z+=B.rz*s;
        B.m.material.opacity=Math.min(1,B.life*1.6);
        if(B.life<=0){ B.live=false; B.m.visible=false; } }

      this.ringTick(s); this.sigRijTick(s); this.wijzerTickD(s);
      this.camoTick(s);
      this.straalTick(s); this.bomTick(s);
      // ---- rook: drijft op, dijt uit en vervaagt ----
      for(let i=0;i<this.rookP.length;i++){ const R=this.rookP[i]; if(!R.live) continue;
        R.life-=s/Math.max(0.3,R.leven);
        R.m.position.x+=R.vx*s; R.m.position.y+=R.vy*s; R.m.position.z+=R.vz*s;
        R.m.scale.setScalar(R.sz*(1+(1-R.life)*1.8));

        if(R.life<=0){ R.live=false; R.m.visible=false; } }

      // ---- vonken ----
      for(let i=0;i<this.vonken.length;i++){ const F=this.vonken[i]; if(!F.live) continue;
        F.life-=s*1.7;
        F.m.position.x+=F.vx*s; F.m.position.y+=F.vy*s-4*s*(1-F.life); F.m.position.z+=F.vz*s;
        F.m.lookAt(eye);
        F.m.scale.setScalar(Math.max(0.01,F.sz*F.life*2.2));
        F.m.material.opacity=Math.max(0,F.life);
        if(F.life<=0){ F.live=false; this.vonkVrij=(this.vonkVrij||0)+1;
          F.m.visible=false; } }

      // ---- dozen ----
      this.doosT-=s;
      if(this.doosT<=0){ this.doosT=(26+Math.random()*10)/M().doos; this.doosSpawn(); }
      for(let i=0;i<this.dozen.length;i++){ const D=this.dozen[i]; if(!D.live) continue;
        D.t+=s; D.p.z+=D.sp*s;
        D.g.position.copy(D.p);
        D.kern.rotation.y+=s*1.6; D.kern.rotation.x+=s*0.9;
        D.ring.rotation.x=D.t*1.2; D.ring.rotation.y=D.t*0.7;
        D.gloed.lookAt(eye);
        D.gloed.material.opacity=0.55+Math.sin(D.t*4)*0.2;
        if(D.p.z>14){ D.live=false; D.g.visible=false; } }

      // ---- golvenmachine ----
      if(this.state==='parade'){ this.paradeTick(s); }
      else if(this.state==='rust'){ this.rustTick(s); }
      else if(this.state==='baaswacht'){ this.golfT-=s;
        if(this.golfT<=0){ this.toonGroot('',''); 
          this.baasTrio=[];
          const L=this.level, laatste=(L>=LEVELS), voorlaatste=(L===LEVELS-1);
          const kr=this.baasKracht(L);
          if(voorlaatste){                              // drie tegelijk als opmaat naar het einde
            const B=(this.bazen||[]).filter(function(b){ return b.beurt<99; });
            for(let k=0;k<3&&B.length;k++){
              const zj=(Math.random()<0.5?-1:1);

                baas:B[(L+k*4)%B.length], hp:kr*0.42});
              if(b){ b.izij=-zj; b.trioI=k; this.baasTrio.push(b); } }
            this.baas=this.baasTrio[0]||null;
            this.toonGroot('THREE OF THEM','#ff3d55'); }
          else if(!laatste&&(this.baasKeus(L)||{}).delen&&
                  this.baasKeus(L).delen.length>=3){
            // De drie ogen horen bij één gevecht: drie platen tegelijk in beeld.

            if(this.baas) this.baas.baasNaam=keus.naam;

        let leeft=0;

          for(let i=0;i<this.baasTrio.length;i++) if(this.baasTrio[i].live) leeft++;

        else if(this.baas&&this.baas.live) leeft=1;
        if(!leeft){ this.baas=null; this.baasTrio=null;
          this.baasBalkUit(); this.levelKlaar(); } }
      else if(this.state==='wacht'){ this.golfT-=s; if(this.golfT<=0) this.nieuweGolf(); }
      else if(this.state==='vechten'){

        levend=0;                                     // opnieuw tellen: planTick heeft net gespawnd

          if(e.live&&!e.dood) levend++; }

        if(klaar){ this.state='wacht'; this.golfT=1.8; } }

      this.hud();
    }catch(e){ this.dead=true; fout('TICK: '+e.message); } },

    // ---- vijandelijk vuur kapotschieten ----
    vijTreffer:function(p,dmg,straal){
      const r2=straal*straal;
      for(let i=0;i<this.vij.length;i++){ const B=this.vij[i]; if(!B.live) continue;
        const q=this.KP2||(this.KP2=new THREE.Vector3());
        q.copy(B.o).addScaledVector(B.dir,B.d);
        // Een raket is geen punt maar een staaf van een paar meter. Vroeger telde
        // alleen zijn middelpunt, dus je kon er dwars doorheen schieten terwijl je
        // hem zag. Nu wordt de afstand tot zijn hele lengte gemeten.
        const halve=Math.max(0.6,(B.len||2.4)*0.5);
        let ax=p.x-q.x, ay=p.y-q.y, az=p.z-q.z;
        let t=ax*B.dir.x+ay*B.dir.y+az*B.dir.z;
        if(t>halve) t=halve; else if(t<-halve) t=-halve;
        const dx=q.x+B.dir.x*t-p.x, dy=q.y+B.dir.y*t-p.y, dz=q.z+B.dir.z*t-p.z;
        const rr=r2*(B.zwaar?2.6:1.5)+((B.br||0.5)*0.5)*((B.br||0.5)*0.5);
        if(dx*dx+dy*dy+dz*dz>rr) continue;
        B.hp-=dmg;
        if(B.hp>0){ SND.hit(q.x*0.02,0.3);
          this.vonk(q.x,q.y,q.z,0xffd9a0,3,5,0.4);
          // EEN ONTWIJKER slaat na een treffer het roer om: hij zwenkt hard opzij
          // en pakt daarna zijn koers weer op. Je moet hem dus opnieuw pakken.
          if(B.ontwijk&&B.duikT<=0){ this.raketDuik(B,q); }
          return 1; }
        // ook het lichaam vrijgeven: bleef dat bezet, dan waren er na achttien
        // neergeschoten raketten geen lichamen meer en werd alles weer plat.
        // KOPPEL: sneuvelt de een, dan gaat zijn maat er vol op — je moet dus
        // kiezen wie je eerst pakt.
        if(B.maat&&B.maat.live){ const M=B.maat;
          M.sp*=KOPPEL_SNEL; M.draai=(M.draai||1.5)*1.5; M.maat=null;
          const mq=this.KP3||(this.KP3=new THREE.Vector3());
          mq.copy(M.o).addScaledVector(M.dir,M.d);
          this.vonk(mq.x,mq.y,mq.z,0xff3d55,6,3.5,0.5); }
        this.vijVrij2(B);
        SND.kill(q.x*0.02,0.5);
        this.vonk(q.x,q.y,q.z,B.zwaar?0xffe45c:0xff8a3d,B.zwaar?12:6,B.zwaar?9:6,B.zwaar?1.1:0.6);
        this.punten+=B.zwaar?60:10;
        return 1; }
      return 0; },

    // segmenttest van een kogel tegen alle vijanden
    treffer:function(o,dir,t0,t1,tol){
      let bt=1e9, be=null;
      for(let a=0;a<this.enemies.length;a++){ const e=this.enemies[a];
        if(!e.live) continue;
        const vx=e.p.x-o.x, vy=e.p.y-o.y, vz=e.p.z-o.z;
        let t=vx*dir.x+vy*dir.y+vz*dir.z;
        if(t<t0-1||t>t1+1||t>=bt) continue;
        t=Math.max(t0,Math.min(t1,t));
        const qx=vx-dir.x*t, qy=vy-dir.y*t, qz=vz-dir.z*t;
        const r=e.r+(tol||0);
        if(qx*qx+qy*qy+qz*qz<r*r){ bt=t; be=e; } }
      if(!be) return null;
      return {e:be,x:o.x+dir.x*bt,y:o.y+dir.y*bt,z:o.z+dir.z*bt}; },

    // De HUD is een vizier: alles in fosforgroen, rood alleen waar het alarm

    // één hemel per beurt klaarmaken en meteen naar de videokaart sturen,
    // zodat er tijdens het spelen niets meer hoeft te gebeuren
    // Sommige platen bevatten TWEE panorama's boven elkaar, met een zwarte band
    // ertussen. Als je daar één 2:1 venster van maakt zie je beide helften met
    // die streep erdoorheen. Ze worden daarom eerst uit elkaar gehaald.
    hemelSplits:function(tex){
      const img=tex&&tex.image; if(!img||!img.width) return null;
      const W=img.width, H=img.height;
      if(W/H<1.7||W/H>2.4) return null;               // alleen bij een 2:1 plaat
      let d=null, N=160, M=90;
      try{
        const c=document.createElement('canvas'); c.width=N; c.height=M;
        const g=c.getContext('2d'); g.drawImage(img,0,0,N,M);
        d=g.getImageData(0,0,N,M).data;
      }catch(e){ return null; }
      const rij=[];
      for(let y=0;y<M;y++){ let s=0;
        for(let x=0;x<N;x++){ const o=(y*N+x)*4; s+=(d[o]+d[o+1]+d[o+2])/3; }
        rij.push(s/N); }
      // een donkere band rond het midden?
      let a=-1,b=-1;
      for(let y=Math.round(M*0.40);y<=Math.round(M*0.60);y++){
        if(rij[y]<14){ if(a<0) a=y; b=y; } }
      if(a<0||b-a<1) return null;
      // en allebei de helften moeten echt beeld bevatten
      let bov=0,ond=0;
      for(let y=0;y<a;y++) bov+=rij[y];
      for(let y=b+1;y<M;y++) ond+=rij[y];
      bov/=Math.max(1,a); ond/=Math.max(1,M-b-1);
      if(bov<18||ond<18) return null;
      const yA=Math.round(H*(a/M)), yB=Math.round(H*((b+1)/M));
      const uit=[];
      [[0,yA],[yB,H]].forEach(function(p,i){
        const hh=p[1]-p[0]; if(hh<H*0.25) return;
        try{
          const c=document.createElement('canvas'); c.width=W; c.height=hh;
          c.getContext('2d').drawImage(img,0,p[0],W,hh,0,0,W,hh);
          const nt=new THREE.CanvasTexture(c);
          nt.__naam=(tex.__naam||'hemel')+' ['+(i?'onder':'boven')+']';
          nt.needsUpdate=true; uit.push(nt);
        }catch(e){}
      });
      return uit.length===2?uit:null; },

    // Drie neusvormen, zelf getekend: een stip, een stip met kruis, en een stip
    // met dwarsvleugels. Zo herken je aan de kop welk soort raket op je afkomt.
    neusPlaat:function(soort){
      const S=128, c=document.createElement('canvas');
      c.width=S; c.height=S;
      const g=c.getContext('2d'), m=S/2;
      // de gloeiende stip zelf
      const gr=g.createRadialGradient(m,m,0,m,m,S*0.30);
      gr.addColorStop(0,'rgba(255,255,255,1)');
      gr.addColorStop(0.35,'rgba(255,120,90,0.95)');
      gr.addColorStop(1,'rgba(255,40,60,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(m,m,S*0.30,0,6.283); g.fill();
      g.strokeStyle='rgba(255,90,80,0.85)'; g.lineCap='round';
      if(soort===1){                                   // kruis
        g.lineWidth=S*0.055;
        g.beginPath(); g.moveTo(m,S*0.10); g.lineTo(m,S*0.90);
        g.moveTo(S*0.10,m); g.lineTo(S*0.90,m); g.stroke(); }
      else if(soort===2){                              // dwarsvleugels
        g.lineWidth=S*0.075;
        g.beginPath(); g.moveTo(S*0.06,m); g.lineTo(S*0.94,m); g.stroke();
        g.lineWidth=S*0.045;
        g.beginPath(); g.moveTo(S*0.20,m-S*0.13); g.lineTo(S*0.20,m+S*0.13);
        g.moveTo(S*0.80,m-S*0.13); g.lineTo(S*0.80,m+S*0.13); g.stroke(); }
      const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t; },

    // De massieve tegenhanger van elke neusvorm: een bolletje, een kruis van twee
    // balkjes, of een dwarsvleugel. Klein maar ondoorzichtig.
    kopVorm:function(soort){
      if(soort===0) return new THREE.SphereGeometry(0.5,10,8);
      if(soort===1){
        // kruis: een staande en een liggende balk
        const a=new THREE.BoxGeometry(1.5,0.34,0.34);
        const b=new THREE.BoxGeometry(0.34,1.5,0.34);
        return this.samenVoegen([a,b]); }
      // vleugels: één brede dwarsbalk met een kern
      const a=new THREE.BoxGeometry(2.0,0.28,0.28);
      const b=new THREE.BoxGeometry(0.5,0.5,0.5);
      return this.samenVoegen([a,b]); },

    // Twee vormen tot één geheel maken, zonder extra bibliotheek.
    samenVoegen:function(lijst){
      let n=0;
      lijst.forEach(function(g){ n+=g.attributes.position.count; });
      const pos=new Float32Array(n*3);
      const idx=[]; let off=0, po=0;
      lijst.forEach(function(g){
        const p=g.attributes.position.array;
        pos.set(p,po); po+=p.length;
        const ix=g.index?g.index.array:null;
        if(ix) for(let i=0;i<ix.length;i++) idx.push(ix[i]+off);
        off+=g.attributes.position.count; });
      const uit=new THREE.BufferGeometry();
      uit.setAttribute('position',new THREE.BufferAttribute(pos,3));
      if(idx.length) uit.setIndex(idx);
      uit.computeVertexNormals();
      return uit; },

    // Een gloeiende neus die MEEVLIEGT met het schot. Losse vonkjes lieten gaten
    // vallen — dan zag je het schot even niet. Deze is er altijd.
    // Sjoerds plaat opknippen: vijf bij vijf koppen, elk hun eigen vakje. We
    // meten per vak waar de inkt zit, zodat een kop nooit half wordt afgesneden.
    koppenKnip:function(t){
      const img=t&&t.image; if(!img||!img.width) return null;
      const W=img.width, H=img.height;
      let d=null;
      try{
        const c=document.createElement('canvas'); c.width=W; c.height=H;
        const g=c.getContext('2d'); g.drawImage(img,0,0);
        d=g.getImageData(0,0,W,H).data;
      }catch(e){ return null; }
      const rand=function(v0,v1,horizontaal){
        // van buiten naar binnen lopen tot de eerste inkt
        let a=v0, b=v1;
        const leeg=function(k){
          for(let q=0;q<(horizontaal?H:W);q+=2){
            const o=horizontaal?((q*W+k)*4+3):((k*W+q)*4+3);
            if(d[o]>24) return false; }
          return true; };
        while(a<b&&leeg(a)) a++;
        while(b>a&&leeg(b)) b--;
        return [a,b]; };
      const uit=[];
      const bw=W/KOPPEN_KOL, bh=H/KOPPEN_RIJ;
      for(let r=0;r<KOPPEN_RIJ;r++){
        for(let k=0;k<KOPPEN_KOL;k++){
          const x0=Math.round(k*bw), x1=Math.round((k+1)*bw)-1;
          const y0=Math.round(r*bh), y1=Math.round((r+1)*bh)-1;
          // binnen dit vak de echte randen van de kop zoeken
          let mnx=x1,mxx=x0,mny=y1,mxy=y0,gevonden=false;
          for(let y=y0;y<=y1;y+=2) for(let x=x0;x<=x1;x+=2){
            if(d[(y*W+x)*4+3]<=24) continue;
            gevonden=true;
            if(x<mnx)mnx=x; if(x>mxx)mxx=x;
            if(y<mny)mny=y; if(y>mxy)mxy=y; }
          if(!gevonden) continue;
          uit.push({u0:mnx/W, u1:(mxx+1)/W, v0:1-(mxy+1)/H, v1:1-mny/H,
                    ar:(mxx-mnx+1)/(mxy-mny+1)}); } }
      return uit.length?uit:null; },

    // Welke kop hoort bij dit schip? Zijn rij op de vlootplaat plus zijn soort,
    // zodat twee verschillende schepen nooit toevallig dezelfde krijgen.
    kopVoor:function(e){
      const n=(this.kopVak&&this.kopVak.length)?this.kopVak.length:25;
      const rij=(e&&e.rij!==undefined)?e.rij:0;
      const pl=(e&&e.plaat)?(e.plaat.rijen||12):12;
      const tp=(e&&e.tp)||0;
      // rij binnen de plaat, en de plaat zelf verschuift het venster
      return ((rij*2+Math.floor(tp/pl)*7+tp)%n+n)%n; },

    neusPak:function(B,soort,kleur){
      if(!this.neuzen){
        // Sjoerds koppen als ze er zijn; anders mijn eigen getekende vormen.
        this.kopVak=null;
        try{ if(window.ART&&window.ART.koppen)
          this.kopVak=this.koppenKnip(window.ART.koppen); }catch(e){}
        this.neusT=[this.neusPlaat(0),this.neusPlaat(1),this.neusPlaat(2)];
        this.neuzen=[]; this.koppen=[];
        // Een MASSIEVE kop: een echt bolletje dat licht geeft maar waar je niet
        // doorheen kijkt. De gloed eromheen blijft doorzichtig, zodat je nog
        // steeds de vorm en het licht ziet.
        // Drie massieve vormen die bij de drie neuzen horen: een bolletje, een
        // kruis en dwarsvleugels. Ondoorzichtig, dus je kijkt er niet doorheen —
        // de gloed eromheen blijft wel licht geven.
        const vormen=[this.kopVorm(0),this.kopVorm(1),this.kopVorm(2)];
        for(let i=0;i<NEUZEN;i++){
          const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
            new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,
              blending:THREE.AdditiveBlending,opacity:0.95}));
          m.renderOrder=8; m.visible=false; m.frustumCulled=false;
          this.par.add(m); this.neuzen.push(m);
          const k=new THREE.Mesh(vormen[0],new THREE.MeshBasicMaterial({color:0xff3020}));
          k.__vormen=vormen;
          k.renderOrder=7; k.visible=false; k.frustumCulled=false;
          this.par.add(k); this.koppen.push(k); } }
      // We keken of het beeldje ZICHTBAAR was om te weten of het vrij is. Maar bij
      // Sjoerds eigen koppen zetten we de gloed juist onzichtbaar — dus leek elke
      // neus vrij en werd hij meteen aan het volgende schot gegeven. Daardoor
      // sprong een kop van de ene raket naar de andere. Nu een eigen vlag.
      for(let i=0;i<this.neuzen.length;i++){ const m=this.neuzen[i];
        if(m.__bezet) continue;
        m.__bezet=1;
        const nt=this.neusT[soort%3];
        if(m.material.map!==nt){ m.material.map=nt; m.material.needsUpdate=true; }
        m.material.color.setHex(kleur||0xffffff);
        m.visible=true; B.neus=m;
        const k=this.koppen[i]; k.__bezet=1;
        if(this.kopVak&&this.kopVak.length){
          // Sjoerds getekende kop: een plat vlak met zijn eigen plaatje, dat je
          // altijd aankijkt. Ondoorzichtig genoeg om niet doorheen te kijken.
          // vast per scheepssoort: dezelfde vijand geeft altijd dezelfde kop
          const nr=(B.kopNr!==undefined)?B.kopNr:0;
          const R=this.kopVak[nr%this.kopVak.length];
          // eigen vlak per kop: elk vakje heeft zijn eigen uitsnede
          if(!k.__vlak) k.__vlak=new THREE.PlaneGeometry(1,1);
          k.geometry=k.__vlak;
          this.uvRect(k.geometry,R,1);
          // alleen vertalen als de kaart of de instelling ECHT wisselt
          if(k.material.map!==window.ART.koppen||!k.__klaar){
            k.material.map=window.ART.koppen;
            k.material.transparent=true; k.material.alphaTest=0.25;
            k.material.needsUpdate=true; k.__klaar=1; }
          k.material.color.setHex(0xffffff);
          k.__ar=R.ar||1; }
        else { k.geometry=k.__vormen[soort%3];   // terugval: mijn eigen vormen
               if(k.material.map!==null){ k.material.map=null;
                 k.material.needsUpdate=true; k.__klaar=0; }
               k.material.color.setHex(kleur||0xff3020); k.__ar=1; }
        k.visible=true; B.kop2=k;
        return true; }
      return false; },

    // Twee vlakken die samen een L maken. De lengte-as is Y (−0,5 achter,
    // +0,5 voor). De staart ligt in het XY-vlak, de kop staat er haaks op.
    // De tekening wordt over de lengte verdeeld: staart onder, kop boven.
    lVorm:function(kopDeel){
      const k=Math.max(0.08,Math.min(0.6,kopDeel||0.28));
      const y0=-0.5, y1=0.5-k, y2=0.5;          // staart y0..y1, kop y1..y2
      const kb=KOP_BREED*0.5;                   // de kop steekt breder uit
      const g=new THREE.BufferGeometry();
      // Recht van voren staan die twee vlakken op hun kant en zie je ze bijna
      // niet — precies wat er bij de cilinder misging. Daarom een DERDE vlak
      // dwars op de vliegrichting: de neus. Die kijkt je altijd recht aan.
      const yn=y2-k*0.34;
      const p=[
        // staart, plat (normaal langs Z)
        -0.5,y0,0,  0.5,y0,0,  0.5,y1,0,
        -0.5,y0,0,  0.5,y1,0, -0.5,y1,0,
        // kop, haaks erop (normaal langs X) — breder dan de romp
        0,y1,-kb,  0,y1,kb,  0,y2,kb,
        0,y1,-kb,  0,y2,kb,  0,y2,-kb,
        // de neus: dwars op de lengte, dus recht naar je toe
        -kb,yn,-kb,  kb,yn,-kb,  kb,yn,kb,
        -kb,yn,-kb,  kb,yn,kb,  -kb,yn,kb
      ];
      const uv=[
        0,0,  1,0,  1,1-k,
        0,0,  1,1-k, 0,1-k,
        0,1-k, 1,1-k, 1,1,
        0,1-k, 1,1,  0,1,
        0,1-k*0.5, 1,1-k*0.5, 1,1,
        0,1-k*0.5, 1,1,       0,1
      ];
      g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(p),3));
      g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uv),2));
      g.computeVertexNormals();
      return g; },

    // Een plaat echt uit het geheugen van de bril halen.
    losLaten:function(t){
      if(!t) return;
      try{ if(t.dispose) t.dispose(); }catch(e){}
      try{ if(t.image&&t.image.close) t.image.close(); }catch(e){}
      try{ t.image=null; }catch(e){} },

    // Wat heeft dit level nodig, wat staat er al, en wat kan weg? Dit draait
    // tijdens het zwarte scherm, dus je ziet er niets van.
    // LADEN, DAN WISSELEN, DAN PAS OPRUIMEN.
    //
    // Eerst ruimde ik op en laadde daarna — dus tussen die twee momenten was er
    // geen achtergrond en geen baasplaat, en elke hapering daarin gaf een leeg
    // beeld. Nu blijft alles wat in gebruik is gewoon staan tot de vervanger
    // binnen is. Pas als het nieuwe level compleet is, gaat het oude weg.
    rondeLaden:function(L,klaar){
      const self=this;
      const nodig=this.rondeNodig(L);
      if(!nodig.namen.length){ if(klaar) klaar(); return; }
      // wat mist er nog?
      const werk=nodig.lijst.filter(function(w){ return !self.heeftPlaat(w); });
      this.ladenBezig=werk.length;
      const afronden=function(){
        // 1. de nieuwe wereld in beeld zetten
        self.hemelI=-1; self.hemelZet(); self.objZet();
        // 2. en NU pas weggooien wat dit level niet gebruikt
        self.rondeOpruimen(nodig.namen);
        if(klaar) klaar(); };
      if(!werk.length){ afronden(); return; }
      werk.forEach(function(w){
        const lijst=(w.s==='hemel')?KAART.hemels:KAART.bazen;
        const info=lijst.filter(function(x){ return x.naam===w.naam; })[0];
        if(!info){ if(!--self.ladenBezig) afronden(); return; }
        artLaad(info.url,function(t){
          if(t){ t.__naam=info.naam; t.__lijst=info.lijst;
            if(w.s==='hemel') self.hemelVervang(info.naam,t);
            else self.baasVervang(info.naam,t); }
          if(!--self.ladenBezig) afronden(); }); }); },

    // Welke platen heeft dit level nodig?
    rondeNodig:function(L){
      const uit={namen:[],lijst:[]};
      // MOEST MEE met hemelVoorLevel. Deze regel laadde nog de hemel volgens de
      // oude volgorde, terwijl het spel er een andere toont — dus werd de
      // verkeerde plaat geladen en bleef het beeld zwart.
      const hemNaam=(this.hemels&&this.hemels.length)
        ? this.hemels[this.hemelVoorLevel(Math.max(1,L))].naam : null;
      if(hemNaam){ uit.namen.push(hemNaam); uit.lijst.push({s:'hemel',naam:hemNaam}); }
      const zet=function(k){ (k&&k.delen||[]).forEach(function(t){
        if(t&&t.__naam&&uit.namen.indexOf(t.__naam)<0){
          uit.namen.push(t.__naam); uit.lijst.push({s:'baas',naam:t.__naam}); } }); };
      zet(this.baasKeus(L));
      // het voorlaatste level zet DRIE andere bazen in het veld
      if(L===LEVELS-1){
        const B3=(this.bazen||[]).filter(function(b){ return b.beurt<99; });

    // =====================================================

    demoTick:function(s){
      const hand=document.querySelector('#touchHand');
      if(!hand||!hand.object3D) return;
      this.dT=(this.dT||0)+s;
      if(this.over){                                    // doodgegaan: even wachten, dan door
        this.dOver=(this.dOver||0)+s;
        if(this.dOver>2.2){ this.dOver=0; this.verder(); }
        return; }
      this.dOver=0;
      // doel kiezen: liefst iets dat je nu kunt zien
      let best=null, bs=-1e9;
      const K=this.kijkD, v=this.DV||(this.DV=new THREE.Vector3());
      for(let i=0;i<this.enemies.length;i++){ const e=this.enemies[i];
        if(!e.live||e.dood) continue;
        v.subVectors(e.p,this.kop);
        const d=v.length(); if(d<0.5) continue;
        v.multiplyScalar(1/d);
        const zicht=K?v.dot(K):1;
        const punt=zicht*60-d*0.6+(e.hp<40?12:0);      // in beeld, dichtbij, bijna dood
        if(punt>bs){ bs=punt; best=e; } }
      // dozen hebben voorrang als ze in de buurt zijn
      let doos=null;
      for(let i=0;i<this.dozen.length;i++){ const D=this.dozen[i];
        if(D.live&&D.p.distanceTo(this.kop)<48){ doos=D; break; } }
      // beide handen doen mee: hoofdhand mitrailleur, andere hand het opgepakte wapen.
      // Zonder controllers staan de handen op de vloer; dan valt hij terug op de camera.
      const H1=this.hands[this.prim], H2=this.hands[this.spec];
      const hp=this.DH||(this.DH=new THREE.Vector3());
      const bruikbaar=function(H){ if(!H||!H.object3D) return null;
        H.object3D.getWorldPosition(hp); return (hp.y>0.4)?H:null; };
      const hA=bruikbaar(H1)||hand, hB=bruikbaar(H2)||hand;
      // ---- voorhouden: raakt hij niets terwijl hij op hetzelfde doel mikt,
      //      dan mikt hij steeds verder vóór het schip uit ----
      if(best!==this.dDoel){ this.dDoel=best; this.dHou=0; this.dTijd=0;
        this.dVorig=best?best.p.clone():null; }
      else if(best){
        this.dTijd+=s;
        if(this.dTijd>0.5){ this.dTijd=0;
          if(this.dRaak) this.dHou=Math.max(0,this.dHou-0.25);   // het lukt: minder voorhouden
          else this.dHou=Math.min(1.2,this.dHou+0.22);           // het lukt niet: meer
          this.dRaak=0; } }
      const mik=this.DA||(this.DA=new THREE.Vector3());
      if(doos){ mik.copy(doos.p).sub(this.kop).normalize();
        window.AIM=mik;
        hB.object3D.getWorldPosition(this.ori);
        this.grab(this.ori,mik,hB); }            // dozen pakt hij met de wapenhand
      else if(best){
        // snelheid van het schip schatten en daarop voorhouden
        const v=this.DV2||(this.DV2=new THREE.Vector3());
        if(this.dVorig){ v.subVectors(best.p,this.dVorig).multiplyScalar(1/Math.max(0.004,s)); }
        else v.set(0,0,0);
        this.dVorig=this.dVorig||new THREE.Vector3(); this.dVorig.copy(best.p);
        const vlieg=best.p.distanceTo(this.kop)/150;             // reistijd van de kogel
        // Altijd volledig voorhouden op de gemeten snelheid — zijwaartse snelle
        // schepen werden anders pas geraakt nadat het misser-mechanisme was
        // opgelopen. dHou is nu alleen nog de correctie daarbovenop.
        mik.copy(best.p).addScaledVector(v,vlieg*(1.0+this.dHou)).sub(this.kop).normalize();
        window.AIM=mik; }
      else { window.AIM=null; return; }
      this.fire(hA);
      this.fire(hB);
      // ---- ook op de raketten schieten die op je afkomen ----
      if(!doos){
        this.dKog=(this.dKog||0)-s;
        if(this.dKog<=0){
          let bB=null,bd=1e9;
          for(let i=0;i<this.vij.length;i++){ const B=this.vij[i]; if(!B.live) continue;
            const d=B.o.distanceTo(this.kop);
            if(d<70&&d<bd){ bd=d; bB=B; } }
          if(bB){ this.dKog=0.5;
            const w=this.DK||(this.DK=new THREE.Vector3());
            w.copy(bB.o).addScaledVector(bB.dir,bB.d).sub(this.kop).normalize();
            window.AIM=w; this.fire(hA); this.fire(hB); } } }
      if(this.dT-(this.dW||0)>9){ this.dW=this.dT; this.wisDeb=0; this.wissel(hB); }
      let druk=0;
      for(let i=0;i<this.enemies.length;i++)
        if(this.enemies[i].live&&!this.enemies[i].dood) druk++;
      const ultNu=(this.dT-(this.dU||0)>11)||(druk>=12&&this.dT-(this.dU||0)>7);
      if(ultNu&&this.ults>0){ this.dU=this.dT;
        const H=this.hands[(this.dUlt=(this.dUlt||0)+1)%2?this.prim:this.spec];
        if(H) this.ultimate(H); } },

    paradeTick:function(s){
      const P=this.par9; if(!P) return;
      // ---- niemand in beeld: de volgende komt op ----
      if(!P.e){
        P.i++;
        if(P.i>=P.lijst.length){ this.paradeEind(s); return; }
        const it=P.lijst[P.i];
        let e=null;
        if(it.baas){ e=this.spawn(BAAS,{x:-220,y:this.kop.y,z:-90,baas:it.baas,hp:0.001});
          if(e){ e.intro=0; e.rijst=0; e.dood2=0; } }
        else e=this.spawn(it.tp,{x:-220,y:this.kop.y,z:-60});
        if(!e){ return; }
        e.parade=1; e.hp=e.hpM=999999;                 // hij hoort niet te sneuvelen
        e.rol=0;
        P.e=e; P.fase='in'; P.t=0;
        // Iedereen komt eerst op DEZELFDE korte afstand — zo voel je hoe groot
        // ze zijn. Daarna zakken ze terug tot ze helemaal in beeld passen; die
        // afstand schaalt met hun breedte en hoogte.
        P.dichtbij=PARADE_AFSTAND;
        P.ver=Math.max(PARADE_AFSTAND+10,
              Math.min(PARADE_VERMAX, Math.max(e.bw,e.bh*0.8)*1.35+10));
        P.d=P.dichtbij;
        P.naam=(it.baas?(it.baas.naam+'   -   BOSS'):TYPE[it.tp].n);
        this.toonGroot(P.naam,it.baas?'#ff8aa6':'#9fe4f5');
        return; }

      const e=P.e; P.t+=s;
      e.cd=99; e.dood=0;                                // niet schieten, niet sterven
      const doelX=(P.fase==='uit')?260:0;
      const stil=(P.fase==='stil'||P.fase==='ver');
      const snel=stil?0:78;
      e.p.x+=Math.max(-snel,Math.min(snel,(doelX-e.p.x)*1.4))*s;
      // terugzakken doet hij rustig, dat leest prettiger dan wegschieten
      e.p.z+=((-P.d)-e.p.z)*Math.min(1,s*(P.fase==='terug'?0.9:1.6));

      const hoog=(e.bh>40)?(this.kop.y-e.bh*0.34):this.kop.y;
      e.p.y+=(hoog-e.p.y)*Math.min(1,s*1.6);

      if(P.fase==='in'&&Math.abs(e.p.x)<1.5&&Math.abs(e.p.z+P.d)<2.5){ P.fase='stil'; P.t=0; }
      else if(P.fase==='stil'&&P.t>=PARADE_DICHT_T){    // even van dichtbij

      else if(P.fase==='terug'&&Math.abs(e.p.z+P.d)<3.0){ P.fase='ver'; P.t=0; }
      else if(P.fase==='ver'&&P.t>=PARADE_VER_T){ P.fase='uit'; P.t=0; this.toonGroot('',''); }
      else if(P.fase==='uit'&&e.p.x>150){
        e.live=false; if(e.bb){ this.bbVrij(e.bb); e.bb=null; }
        if(e.romp){ e.romp.visible=false; e.romp=null; }
