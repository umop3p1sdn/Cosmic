<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>COSMIC SHOOTER</title>
  <style>
    html,body{margin:0;padding:0;background:#04080f;overflow:hidden;font-family:'Trebuchet MS',sans-serif;
      -webkit-tap-highlight-color:transparent;}
    /* Vinger op het scherm = schieten, geen tekst selecteren en geen kopieermenu.
       ALLEEN tijdens het spelen: op het laadscherm en in het menu moet de browser
       zijn gang kunnen gaan, anders komt de vraag om beweging- en sensortoegang
       er niet doorheen. */
    body.spelen{-webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
      user-select:none; -webkit-touch-callout:none;
      touch-action:none; overscroll-behavior:none;}
    body.spelen canvas,body.spelen a-scene,body.spelen #mob{
      touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
    #laad{position:fixed;left:0;top:0;width:100%;height:100%;z-index:9999;
      background:radial-gradient(circle at 50% 42%,#0c2036 0%,#04080f 70%);
      color:#9fe4f5;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    #laad h1{font-size:8vw;letter-spacing:0.42em;margin:0 0 0.1em 0;color:#e8f6ff;
      text-shadow:0 0 18px #35e8ff,0 0 46px #1b6f8a;font-weight:300;}
    #laad .sub{letter-spacing:0.5em;font-size:2.6vw;color:#ffb03a;margin-bottom:0.5em;}
    #vLaad{letter-spacing:0.34em;font-size:1.5vw;color:#4f88a4;margin-bottom:2.0em;}
    #bar{width:52vw;height:3px;background:#12293e;position:relative;overflow:hidden;}
    #bar i{display:block;height:100%;width:0%;background:#35e8ff;box-shadow:0 0 10px #35e8ff;}
    #pct{margin-top:1em;letter-spacing:0.3em;font-size:2vw;color:#5f9ab5;}
    #enter{margin-top:2.2em;letter-spacing:0.42em;font-size:2.6vw;color:#35e8ff;
      opacity:0;text-shadow:0 0 16px #1b6f8a;}
    #enter.aan{cursor:pointer;}
    #laad.klaar{cursor:pointer;}
    #mob{display:none;position:fixed;left:0;bottom:0;width:100%;height:34%;z-index:9000;
      pointer-events:none;}
    #mob.aan{display:flex;}
    #mob .knop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
      padding-bottom:2.2vh;color:#9fe4f5;letter-spacing:0.18em;}
    #mob .knop b{font-size:2.2vh;font-weight:400;opacity:0.85;}
    #mob .knop i{display:block;width:12vh;height:12vh;border-radius:50%;margin-top:1vh;
      border:2px solid rgba(53,232,255,0.42);background:rgba(20,60,80,0.18);
      pointer-events:auto;}                      /* dit zijn nu echte knoppen */
    #mob .knop i:active{background:rgba(53,232,255,0.30);}
    #mobL i{border-color:rgba(255,138,61,0.75);}   /* raketten */
    #mobR i{border-color:rgba(160,108,255,0.75);}  /* void */
    #mob .knop u{display:block;margin-top:1.2vh;padding:0.5vh 2.2vh;text-decoration:none;
      font-size:1.9vh;letter-spacing:0.24em;color:#9fe4f5;pointer-events:auto;
      border:1px solid rgba(53,232,255,0.42);background:rgba(20,60,80,0.18);}
    #mob .knop u:active{background:rgba(53,232,255,0.30);}
    #mob .knop.leeg i{opacity:0.30;}
    #ver{position:fixed;right:12px;bottom:10px;color:#2d5b74;letter-spacing:0.2em;font-size:12px;z-index:10000;}
    #err{position:fixed;left:0;bottom:0;width:100%;max-height:38%;overflow:auto;z-index:10001;
      color:#ff6b6b;background:rgba(0,0,0,0.82);font:11px monospace;padding:5px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <div id="laad">
    <h1>COSMIC</h1>
    <div class="sub">SHOOTER</div>
    <div id="vLaad">v?</div>
    <div id="bar"><i></i></div>
    <div id="pct">BOOTING 0%</div>
    <div id="enter">TAP TO BEGIN</div>
  </div>
  <div id="ver">v1.0</div>
  <div id="err"></div>
  <div id="mob">
    <div class="knop" id="mobL"><b></b><i></i></div>
    <div class="knop" id="mobR"><b></b><i></i><u id="mobW">SWAP</u></div>
  </div>

  <!-- A-Frame staat bewust ONDER het laadscherm: de browser tekent eerst het
       donkere scherm met de titel, en blokkeert pas daarna op het CDN. Stond hij
       in de head, dan bleef de pagina wit tot het CDN antwoordde. -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<script>
(function(){
  'use strict';
  const VERSIE='v12.74';
  const $=function(s){ return document.querySelector(s); };
  document.getElementById('ver').textContent=VERSIE;
  { const v=document.getElementById('vLaad'); if(v) v.textContent=VERSIE; }

  // ---- foutmelding altijd in beeld (Quest heeft geen console) ----
  const EL=document.getElementById('err');
  window.addEventListener('error',function(){
    try{ document.body.style.background='#04080f'; }catch(e2){} });
  function fout(m){ try{ EL.textContent+=m+'\n'; }catch(e){} }
  window.onerror=function(m,u,l){ fout('ERR '+m+' @'+l); };
  const echtLog=console.log.bind(console);
  console.log=function(){ try{ echtLog.apply(null,arguments); }catch(e){} };

  let PROG=0;
  function prog(p,txt){ PROG=Math.max(PROG,p);
    const b=$('#bar i'), t=$('#pct');
    if(b) b.style.width=PROG+'%';
    if(t) t.textContent=(txt||'BOOTING')+' '+Math.round(PROG)+'%'; }
  let laadOpen=false;
  // Hoe lang COSMIC SHOOTER minimaal in beeld blijft voordat een tik telt.
  const TITELMIN=1400;
  function laadKlaar(){
    if(laadOpen) return; laadOpen=true;
    const l=$('#laad'), e=$('#enter');
    if(l) l.className='klaar';
    // Het knipperen wordt hier geteld in plaats van met een CSS-animatie. Die start
    // namelijk niet als alles al in de cache zit en dit scherm meteen klaar is.
    if(e){ e.className='aan';
      let f=0;
      try{
      if(window.__pols) clearInterval(window.__pols);
      window.__pols=setInterval(function(){
        f+=0.09;
        const o=0.42+0.58*(0.5+0.5*Math.sin(f*3.4));
        e.style.opacity=o.toFixed(3);
        const L2=$('#laad');
        if(!L2||L2.style.display==='none'){ clearInterval(window.__pols); window.__pols=0; }
      },40);
      }catch(err){ e.style.opacity=1; } }
    const weg=function(ev){
      // Een tik die hoort bij het wegklikken van een browservenster (de vraag om
      // beweging- en sensortoegang) telde mee als "verder". Daardoor schoot het
      // titelscherm voorbij. Zulke tikken vlak na het terugkeren negeren we.
      if(performance.now()-(window.__focusT||0)<700) return;
      if(performance.now()<(window.__titelT||0)) return;
      // Het opstartscherm klapte er in één beeldje uit. Nu gaat het net als de
      // overgang tussen twee levels: eerst dooft de tekst weg naar zwart, dan
      // trekt het zwart op en staat het menu er. Aan het eind ECHT display:none,
      // want anders slikt dit scherm in de bril de knopdrukken in.
      const L=$('#laad');
      if(L&&!L.__gaatWeg){
        L.__gaatWeg=1;
        L.style.transition='opacity 0.55s ease';
        const kids=L.children;
        for(let i=0;i<kids.length;i++){
          kids[i].style.transition='opacity 0.5s ease';
          kids[i].style.opacity='0'; }
        setTimeout(function(){ L.style.opacity='0'; },520);
        setTimeout(function(){ L.style.display='none'; },1180); }
      // Deze tik is bedoeld om verder te gaan, niet om al een knop in te drukken.
      // Zonder deze dovetijd komt hij ook bij het menu binnen en start het spel.
      window.NAKLIK=performance.now()+800;
      try{ AC(); SND.initSFX(); SND.muziek(); SND.wake(); }catch(err){}   // jouw tik is het startsein voor geluid
      window.removeEventListener('mousedown',weg); window.removeEventListener('touchstart',weg);
      window.removeEventListener('keydown',weg);
      if(window.__pols){ clearInterval(window.__pols); window.__pols=0; } };
    // Alleen een korte dovetijd, zodat de tik waarmee je de pagina opende hem
    // niet meteen wegdrukt. Verder mag je er direct doorheen.
    // COSMIC SHOOTER staat minimaal even in beeld voordat een tik telt.
    window.__titelT=performance.now()+TITELMIN;
    window.addEventListener('focus',function(){ window.__focusT=performance.now(); });
    window.addEventListener('visibilitychange',function(){ window.__focusT=performance.now(); });
    setTimeout(function(){
      window.addEventListener('mousedown',weg); window.addEventListener('touchstart',weg);
      window.addEventListener('keydown',weg);
      if(l) l.addEventListener("click",weg); },350); }

  // het laadscherm blijft staan tot alle platen binnen zijn
  function laadVolgen(){
    const A=window.ART||{};
    const rig=document.querySelector('#rig');
    const C=rig&&rig.components&&rig.components.cosmic;
    const rij=(C&&C.hemelRij)?C.hemelRij.length:0;
    const tot=A.totaal||0, af=A.klaar||0;
    const deel=tot?Math.max(0,Math.min(1,(af-rij*0.35)/tot)):0;
    const pc=Math.round(20+deel*80);
    const b=$('#bar i'), t=$('#pct');
    if(b) b.style.width=pc+'%';
    if(t) t.textContent=(A.af&&tot>0)?'READY':(tot?('LOADING  '+af+' / '+tot):'LOADING');
    // Geen voorwaarden: de knop staat er meteen en drukken mag altijd.
    // Wat nog niet binnen is laadt in het menu gewoon door.
    laadKlaar();
    if(!laadOpen) setTimeout(laadVolgen,220); }

  function laadWeg(){ /* het scherm gaat nu pas weg als jij erop tikt */ }

  window.PHASE='menu'; window.PAUSED=false; window.PRIMHAND='left';

  // =========================================================
  //  GELUID
  // =========================================================
  let A=null,MASTER=null,DUCK=null,DELAY=null,LIM=null,DRONE=null,BEZIG=false;
  function AC(){ if(A) return A; A=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=A.createGain(); MASTER.gain.value=0.5;
    LIM=A.createDynamicsCompressor();
    LIM.threshold.value=-10; LIM.knee.value=6; LIM.ratio.value=20;
    LIM.attack.value=0.002; LIM.release.value=0.25;
    const eindG=A.createGain(); eindG.gain.value=0.8;
    const MUUR=A.createWaveShaper();                     // kan wiskundig niet boven 0.92 uitkomen
    { const N=2048, crv=new Float32Array(N), K=1.4, T=Math.tanh(K);
      for(let i=0;i<N;i++){ const x=(i/(N-1))*2-1; crv[i]=0.92*Math.tanh(x*K)/T; }
      MUUR.curve=crv; MUUR.oversample='2x'; }
    MASTER.connect(MUUR);
    LIM.connect(eindG); eindG.connect(MUUR); MUUR.connect(A.destination);
    DUCK=A.createGain(); DUCK.gain.value=1; DUCK.connect(MASTER);
    DELAY=A.createDelay(1.2); DELAY.delayTime.value=0.32;
    const fb=A.createGain(); fb.gain.value=0.40;
    const fl=A.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=3200;
    const dw=A.createGain(); dw.gain.value=0.5;
    DELAY.connect(fl).connect(fb).connect(DELAY); DELAY.connect(dw).connect(DUCK);
    return A; }

  let SFX=null, SFXSEQ=0;
  const SFXT={};
  function sfxOk(max){ const n=performance.now(); SFXT.q=(SFXT.q||[]).filter(function(t){ return n-t<100; });
    if(SFXT.q.length>=max*2) return false; SFXT.q.push(n); return true; }
  function initSFX(){ if(SFX) return SFX; const a=AC();
    SFX=a.createGain(); SFX.gain.value=0.9; SFX.connect(LIM);
    const fas=a.createBiquadFilter(); fas.type='allpass'; fas.frequency.value=800;
    const lfo=a.createOscillator(), lg=a.createGain();
    lfo.frequency.value=0.11; lg.gain.value=620;
    lfo.connect(lg).connect(fas.frequency); lfo.start();
    fas.connect(SFX); SFX.fas=fas;
    return SFX; }
  function pan(p){ const a=AC(); const n=a.createStereoPanner?a.createStereoPanner():null;
    if(n) n.pan.value=Math.max(-1,Math.min(1,p||0)); return n; }
  function naar(node,p){ const S=initSFX(), pp=pan(p);
    if(pp){ node.connect(pp); pp.connect(S.fas); } else node.connect(S.fas); }

  function gunSnd(p,kleur){ if(!sfxOk(3)) return; const a=AC(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
    o.type='sawtooth'; o.frequency.setValueAtTime(340+(kleur||0)*90,t);
    o.frequency.exponentialRampToValueAtTime(58,t+0.11);
    f.type='lowpass'; f.frequency.setValueAtTime(2600,t); f.frequency.exponentialRampToValueAtTime(420,t+0.12);
    g.gain.setValueAtTime(0.34,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(f).connect(g); naar(g,p); o.start(t); o.stop(t+0.17);
    const n=a.createBufferSource(), nb=a.createBuffer(1,1200,a.sampleRate), d=nb.getChannelData(0);
    for(let i=0;i<1200;i++) d[i]=(Math.random()*2-1)*(1-i/1200);
    n.buffer=nb; const ng=a.createGain(); ng.gain.value=0.16;
    n.connect(ng); naar(ng,p); n.start(t); }

  function hitSnd(p,prog2){ if(!sfxOk(5)) return; const a=AC(), t=a.currentTime; SFXSEQ++;
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(180+prog2*260,t);
    o.frequency.exponentialRampToValueAtTime(70,t+0.09);
    g.gain.setValueAtTime(0.20,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.11);
    o.connect(g); naar(g,p); o.start(t); o.stop(t+0.12); }

  function killSnd(p,size){ if(!sfxOk(6)) return; const a=AC(), t=a.currentTime; SFXSEQ++;
    const n=a.createBufferSource(), L=Math.floor(a.sampleRate*0.30), nb=a.createBuffer(1,L,a.sampleRate), d=nb.getChannelData(0);
    for(let i=0;i<L;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.2);
    n.buffer=nb;
    const f=a.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(1500/Math.max(0.6,size),t);
    f.frequency.exponentialRampToValueAtTime(160,t+0.28); f.Q.value=0.8;
    const g=a.createGain(); g.gain.setValueAtTime(0.30*Math.min(2,size),t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
    n.connect(f).connect(g); naar(g,p);
    if(DELAY) g.connect(DELAY);
    n.start(t);
    if(size>1.4){ const o=a.createOscillator(), og=a.createGain();
      o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(28,t+0.4);
      og.gain.setValueAtTime(0.4,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.45);
      o.connect(og); naar(og,p); o.start(t); o.stop(t+0.5); } }

  // Een ontploffing is geen zuivere toon. Drie lagen over elkaar: de klap die je
  // in je borst voelt, een korte scheur van ruis, en een lage nagalm die uitrolt.
  function boomSnd(p,zwaar){ if(!sfxOk(4)) return; const a=AC(), t=a.currentTime;
    const gr=zwaar?1.5:1;                                   // grote schepen dreunen zwaarder
    // 1. de dreun zelf, dieper en langer dan eerst
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(150*(zwaar?0.8:1),t);
    o.frequency.exponentialRampToValueAtTime(26,t+0.34*gr);
    g.gain.setValueAtTime(0.46,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.42*gr);
    o.connect(g); naar(g,p); o.start(t); o.stop(t+0.44*gr);
    // 2. de scheur: ruis die meteen wegvalt — dat geeft de klap zijn rand
    try{
      const n=Math.floor(a.sampleRate*0.30*gr);
      const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++){ const k=1-i/n; d[i]=(Math.random()*2-1)*k*k; }
      const s=a.createBufferSource(); s.buffer=buf;
      const f=a.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(1800,t);
      f.frequency.exponentialRampToValueAtTime(180,t+0.28*gr);
      const g2=a.createGain();
      g2.gain.setValueAtTime(0.34,t);
      g2.gain.exponentialRampToValueAtTime(0.001,t+0.32*gr);
      s.connect(f).connect(g2); naar(g2,p); s.start(t); s.stop(t+0.32*gr);
    }catch(e){}
    // 3. de nagalm: een diepe toon die er nog even onder blijft hangen
    const o3=a.createOscillator(), g3=a.createGain();
    o3.type='triangle';
    o3.frequency.setValueAtTime(58,t+0.02);
    o3.frequency.exponentialRampToValueAtTime(19,t+0.55*gr);
    g3.gain.setValueAtTime(0.0001,t);
    g3.gain.exponentialRampToValueAtTime(0.20,t+0.05);
    g3.gain.exponentialRampToValueAtTime(0.001,t+0.60*gr);
    o3.connect(g3); naar(g3,p); o3.start(t); o3.stop(t+0.62*gr); }

  function lazSnd(p,k,n){ const a=AC(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
    o.type='sawtooth';
    const f0=900+ (k/Math.max(1,n))*1500;                 // kruipt per flits omhoog
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*0.55,t+0.05);
    f.type='bandpass'; f.frequency.value=f0*1.2; f.Q.value=3.5;
    g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(f).connect(g); naar(g,p); o.start(t); o.stop(t+0.07); }

  function alarmSnd(){ const a=AC(), t=a.currentTime;
    for(let k=0;k<2;k++){ const o=a.createOscillator(), g=a.createGain();
      o.type='square'; o.frequency.setValueAtTime(k?300:220,t+k*0.16);
      g.gain.setValueAtTime(0.0001,t+k*0.16);
      g.gain.linearRampToValueAtTime(0.22,t+k*0.16+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+k*0.16+0.20);
      o.connect(g); naar(g,0); o.start(t+k*0.16); o.stop(t+k*0.16+0.22); } }

  const RAT={};
  function ratelAan(id){ const a=AC(); let r=RAT[id];
    if(!r){ const g=a.createGain(); g.gain.value=0; naar(g,0);
      const o=a.createOscillator(); o.type='square'; o.frequency.value=62;
      const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=1.2;
      o.connect(f).connect(g); o.start();
      r=RAT[id]={g:g,tot:0}; }
    const t=a.currentTime;
    r.g.gain.cancelScheduledValues(t);
    r.g.gain.setValueAtTime(0.16,t);
    r.g.gain.setTargetAtTime(0.0001,t+0.02,0.055); }

  function zeg(txt){ try{ const ss=window.speechSynthesis; if(!ss) return;
    const u=new SpeechSynthesisUtterance(txt); u.rate=1.05; u.pitch=0.9; u.volume=0.75;
    ss.cancel(); ss.speak(u); }catch(e){} }

  function startDrone(){ if(DRONE) return; const a=AC();
    DRONE=a.createGain(); DRONE.gain.value=0.0001; DRONE.connect(MASTER);
    DRONE.gain.linearRampToValueAtTime(0.12,a.currentTime+4);
    [55,82.5,110,164.8].forEach(function(fq,i){
      const o=a.createOscillator(); o.type=i>1?'sine':'sawtooth'; o.frequency.value=fq;
      const g=a.createGain(); g.gain.value=i>1?0.10:0.16;
      const lf=a.createOscillator(), lg=a.createGain();
      lf.frequency.value=0.03+i*0.017; lg.gain.value=fq*0.006;
      lf.connect(lg).connect(o.frequency); lf.start();
      const fi=a.createBiquadFilter(); fi.type='lowpass'; fi.frequency.value=520;
      o.connect(g).connect(fi).connect(DRONE); o.start(); }); }

  function wakeAan(){ try{ if(!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function(w){ window.WAKE=w;
      w.addEventListener('release',function(){ window.WAKE=null; }); }).catch(function(){});
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible'&&!window.WAKE&&navigator.wakeLock)
        navigator.wakeLock.request('screen').then(function(w){ window.WAKE=w; }).catch(function(){}); });
  }catch(e){} }

  // ---- muziek uit Cosmic/music van de repo; namen doen er niet toe, volgorde is alfabetisch ----
  let MUSBASE=null, MUSAPI=null;
  let PLAY=[], PIDX=0, CUR=null, ANA=null, ANAD=null, MUSBRON=null;
  function musToon(){ const e=$('#musTxt'); if(!e) return;
    if(!PLAY.length){ e.setAttribute('value','searching...'); e.setAttribute('color','#c08a5a'); return; }
    e.setAttribute('value',PLAY.length+' track'+(PLAY.length>1?'s':'')+': '+PLAY[0].n);
    e.setAttribute('color','#6ad1a0'); }
  let musKandidaten=[];
  function musVolgende(){ if(musKandidaten.length) musScan(musKandidaten.shift()); }
  function musScan(pad){
    if(!pad) return;
    MUSBASE=basisVoor(pad);
    MUSAPI=API+pad.split('/').map(encodeURIComponent).join('/');
    let cache=null;
    try{ const r=localStorage.getItem('cosmic_music'); if(r) cache=JSON.parse(r); }catch(e){}
    if(cache&&cache.length){ PLAY=cache.map(function(n){ return {n:n,u:MUSBASE+encodeURIComponent(n)}; }); musToon();
      if(!CUR&&window.__geluidVrij) playAt(0); }        // uit de cache: meteen spelen
    if(typeof fetch!=='function') return;

      if(!j||!j.length) return;
      const nm=j.filter(function(f){ return /\.(mp3|m4a|wav|ogg|aac)$/i.test(f.name||''); })
                .map(function(f){ return f.name; }).sort();
      if(!nm.length){ musVolgende(); return; }        // lege map: probeer de andere
      try{ localStorage.setItem('cosmic_music',JSON.stringify(nm)); }catch(e){}
      PLAY=nm.map(function(n){ return {n:n,u:MUSBASE+encodeURIComponent(n)}; });
      musToon();
      // De lijst komt meestal binnen terwijl je nog in het MENU staat. Hier stond
      // dat hij dan juist niet moest starten — daardoor bleef de muziek stil tot

  function playAt(i){
    if(!PLAY.length) return false;
    // DUBBELE MUZIEK. Het opnieuw proberen loopt elke halve seconde, maar CUR
    // wordt pas gezet als het nummer is aangemaakt. Twee pogingen kort na elkaar
    // zagen dus allebei "er speelt niets" en startten allebei een nummer. Deze
    // grendel staat meteen aan het begin.
    if(BEZIG) return false;
    BEZIG=true;
    setTimeout(function(){ BEZIG=false; },900);
    PIDX=((i%PLAY.length)+PLAY.length)%PLAY.length;
    try{
      if(CUR){ try{ CUR.pause(); }catch(e){} }
      CUR=new Audio(); CUR.crossOrigin='anonymous'; CUR.src=PLAY[PIDX].u;
      CUR.preload='auto'; CUR.volume=1;
      CUR.addEventListener('ended',function(){ playAt(PIDX+1); });
      CUR.addEventListener('error',function(){ if(PLAY.length>1) playAt(PIDX+1); else startDrone(); });
      const a=AC();
      try{ MUSBRON=a.createMediaElementSource(CUR);
        ANA=a.createAnalyser(); ANA.fftSize=256; ANAD=new Uint8Array(ANA.frequencyBinCount);
        MUSBRON.connect(ANA); ANA.connect(MASTER);            // muziek direct op master: schoten drukken hem niet weg
      }catch(e){ /* geen webaudio-route: gewoon afspelen */ }
      if(DRONE){ try{ DRONE.gain.linearRampToValueAtTime(0.0001,a.currentTime+2); }catch(e){} }
      // De browser kan het afspelen WEIGEREN (geluid nog niet vrijgegeven, of de
      // audio staat nog op pauze). Dan moeten we CUR weer leegmaken, anders denkt
      // de rest dat er muziek speelt en wordt het nooit meer geprobeerd.
      const p=CUR.play();
      if(p&&p.then) p.then(function(){ BEZIG=false; });
      if(p&&p.catch) p.catch(function(){
        try{ if(CUR){ CUR.pause(); } }catch(e2){}
        CUR=null; BEZIG=false;         // meteen weer vrij: de volgende poging mag
        const e3=$('#musTxt'); if(e3) e3.setAttribute('value',''); });
      const e2=$('#musTxt'); if(e2) e2.setAttribute('value','\u25b6 '+PLAY[PIDX].n);
      return true;
    }catch(e){ return false; } }
  function muziekStart(){ AC();

  const REPO='umop3p1sdn/Cosmic';

  function padenZoek(klaar){

      if(!j||!j.length) return;

      j.forEach(function(f){ if(f.type!=='dir') return;
        const n=String(f.name||'').trim().toLowerCase();

        if(n==='music'){ uit.muziekLijst.push(f.path);
          // een map zonder spatie in de naam is de waarschijnlijkste
          if(!uit.music||f.name===f.name.trim()) uit.music=f.path; } });
      if(!uit.art&&!uit.music) return;
      if(p&&p.art===uit.art&&p.music===uit.music) return;      // niets veranderd
      try{ localStorage.setItem('cosmic_paden',JSON.stringify(uit)); }catch(e){}

  // Een achtergrond vult je hele blikveld en heeft dus nooit doorzichtige plekken.
  // Een schip, station of planeet juist wel. Dat is een betrouwbaarder onderscheid
  // dan de verhouding: een brede baas van 1,7 zou anders als hemel om je heen komen.
  function doorzichtig(img){
    try{
      const c=document.createElement('canvas'); c.width=96; c.height=96;

      g.drawImage(img,0,0,96,96);

      let leeg=0;
      for(let i=3;i<d.length;i+=4) if(d[i]<40) leeg++;
      return leeg/(96*96);
    }catch(e){ return 0; } }

  function nummerVan(naam){
    const m=String(naam||'').match(/(\d{4})(?!.*\d{4})/);
    if(!m) return null;
    for(let i=0;i<NUMMERS.length;i++) if(NUMMERS[i].nr===m[1]) return NUMMERS[i];
    return null; }

  // Een planeet is rond en vult zijn kader; een satelliet of station is grillig
  // en laat veel leeg. Gemeten: planeten 0,78-0,79, een station 0,46.
  function rondheid(img){
    try{
      const N=128;
      const c=document.createElement('canvas'); c.width=N; c.height=N;
      const g=c.getContext('2d'); g.clearRect(0,0,N,N);
      g.drawImage(img,0,0,N,N);
      const d=g.getImageData(0,0,N,N).data;
      let x0=N,x1=-1,y0=N,y1=-1,vol=0;
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){
        if(d[(y*N+x)*4+3]>128){ vol++;
          if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
      if(x1<0) return 0;
      return vol/Math.max(1,(x1-x0+1)*(y1-y0+1));
    }catch(e){ return 0; } }

  function artVerwerk(lijst){
    let klaar=0; const n=lijst.length;
    window.ART.totaal=n; window.ART.klaar=0;
    if(!n){ window.ART.vondst='geen art'; window.ART.af=true; return; }
    window.ART.vondst='laden '+n;
    lijst.forEach(function(item){
      const nm=(typeof item==='string')?item:item.n;
      const soort=(typeof item==='string')?null:item.s;
      const url=ARTBASE+nm.split('/').map(encodeURIComponent).join('/');
      artLaad(url,function(t){
        klaar++; window.ART.klaar=klaar;
        // METEEN afvinken. Stond dit onderaan, dan sprongen bazen en planeten er
        // met een return overheen en bleef 'alles binnen' op onwaar staan — en
        // dan weigeren LAUNCH, DEMO en TEST allemaal.
        if(klaar>=n){ window.ART.af=true;
          window.ART.vondst=window.ART.panos.length+' sky '+window.ART.objs.length+' obj'; }
        if(t&&t.image&&t.image.width){
          t.__naam=nm;                                       // naam bewaren voor de volgorde
          t.__url=url;                                       // en waar hij vandaan komt
          const ar=t.image.width/t.image.height;
          const leeg=doorzichtig(t.image);
          t.__leeg=leeg; t.__soort=soort; t.__rond=rondheid(t.image);
          const N=nummerVan(nm);
          if(N){ t.__lijst=N;                                  // de nummerlijst gaat voor
            if(N.rol==='baas'){ t.__baas=1; window.ART.objs.push(t);
              KAART.bazen.push({naam:nm,url:url,lijst:N});
              if(window.ART.nieuw) window.ART.nieuw(); return; }
            if(N.rol==='object'||N.rol==='planeet'){ t.__baas=0; window.ART.objs.push(t);
              if(window.ART.nieuw) window.ART.nieuw(); return; } }
          // de koppenplaat gaat niet naar de vloot of de hemels
          if(String(nm).indexOf(KOPPEN_BESTAND)===0){
            t.__koppen=1; window.ART.koppen=t;
            if(window.ART.nieuw) window.ART.nieuw(); return; }
          if(soort==='hemel'){ window.ART.panos.push(t);
            KAART.hemels.push({naam:nm,url:url,lijst:N||null});
            if(!window.ART.pano) window.ART.pano=t; }
          else if(soort==='vloot') window.ART.schepen.push(t);
          else if(soort==='baas'){ t.__baas=1; window.ART.objs.push(t);
            KAART.bazen.push({naam:nm,url:url,lijst:N||null}); }
          else if(soort==='object'){ t.__baas=0; window.ART.objs.push(t); }
          else if(ar>=1.7&&leeg<0.12){ window.ART.panos.push(t);   // vol beeld = achtergrond
            KAART.hemels.push({naam:nm,url:url,lijst:N||null});
            if(!window.ART.pano||t.image.width>(window.ART.pano.image.width||0)) window.ART.pano=t; }
          else if(ar>=0.55&&ar<=1.05&&leeg>=0.05){            // staande of vierkante plaat = de vloot
            window.ART.schepen.push(t); }
          else window.ART.objs.push(t);
          if(window.ART.nieuw) window.ART.nieuw(); }
        }); }); }

  // De naam van een onderliggende map zegt wat er in zit. Staat een bestand los
  // in Art, dan raadt de code het zelf op verhouding en doorzichtigheid.
  function mapSoort(naam){
    const n=String(naam||'').trim().toLowerCase();
    if(/achtergrond|hemel|sky|background/.test(n)) return 'hemel';
    if(/vijand|schepen|fleet|enem/.test(n))        return 'vloot';
    if(/baas|boss/.test(n))                        return 'baas';
    if(/object|planeet|planet|prop/.test(n))       return 'object';
    return null; }

  function artScan(pad){
    if(!pad) return;
    ARTBASE=basisVoor(pad);
    APIURL=API+pad.split('/').map(encodeURIComponent).join('/');
    if(window.ART.bezig) return; window.ART.bezig=true;
    let cache=null;
    try{ const raw=localStorage.getItem('cosmic_art'); if(raw) cache=JSON.parse(raw); }catch(e){}
    if(cache&&cache.length){ artVerwerk(cache); }
    if(typeof fetch!=='function') return;
    const plaatje=function(f){ return /\.(png|jpg|jpeg|webp)$/i.test(f.name||''); };
    fetch(APIURL).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(!j||!j.length) return;
      const uit=j.filter(plaatje).map(function(f){ return {n:f.name,s:null}; });
      const mappen=j.filter(function(f){ return f.type==='dir'; });
      let wacht=mappen.length;
      const af=function(){
        if(!uit.length) return;
        try{ localStorage.setItem('cosmic_art',JSON.stringify(uit)); }catch(e){}
        const nieuw=uit.map(function(o){ return o.n+'|'+o.s; }).join();
        const oud=(cache||[]).map(function(o){ return (o.n||o)+'|'+(o.s||null); }).join();
        if(nieuw!==oud){ window.ART.objs.length=0; window.ART.panos.length=0;
          window.ART.schepen.length=0; window.ART.pano=null; artVerwerk(uit); } };
      if(!wacht){ af(); return; }
      mappen.forEach(function(d){
        const soort=mapSoort(d.name);
        fetch(API+d.path.split('/').map(encodeURIComponent).join('/'))
          .then(function(r){ return r.ok?r.json():null; })
          .then(function(k){
            if(k&&k.length) k.filter(plaatje).forEach(function(f){
              uit.push({n:d.name+'/'+f.name,s:soort}); });
            if(--wacht<=0) af(); })
          .catch(function(){ if(--wacht<=0) af(); }); });
    }).catch(function(){}); }
  window.artScan=artScan;

  function mkAtlas(){
    const S=512, C=document.createElement('canvas'); C.width=2048; C.height=2048;
    const g=C.getContext('2d');
    g.clearRect(0,0,2048,2048);

    function vorm(pts,cx,cy,R,fill,lijn,lw,dicht){
      g.beginPath();
      for(let i=0;i<pts.length;i++){ const p=pts[i], x=cx+p[0]*R, y=cy+p[1]*R;
        if(i===0) g.moveTo(x,y); else g.lineTo(x,y); }
      if(dicht!==false) g.closePath();
      if(fill){ g.fillStyle=fill; g.fill(); }
      if(lijn){ g.strokeStyle=lijn; g.lineWidth=lw||6; g.shadowColor=lijn; g.shadowBlur=26;
        g.stroke(); g.shadowBlur=0; } }

    function spiegel(pts){ return pts.map(function(p){ return [-p[0],p[1]]; }); }

    function gloedBol(cx,cy,r,col,kern){
      const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
      gr.addColorStop(0,kern||'#ffffff'); gr.addColorStop(0.35,col);
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,r,0,6.2832); g.fill(); }

    function motor(cx,cy,r,col){ gloedBol(cx,cy,r,col,'#ffffff'); }

    // ---- de acht silhouetten, frontaal en iets van boven gezien ----
    const TEKEN=[
      function(cx,cy,R,V){                                   // 0 SCOUT: smalle pijl
        const wing=[[0.09,-0.14],[0.98,0.44],[0.80,0.60],[0.07,0.30]];
        vorm(wing,cx,cy,R,V.c2,V.c,7); vorm(spiegel(wing),cx,cy,R,V.c2,V.c,7);
        vorm([[0,-0.92],[0.17,0.12],[0,0.62],[-0.17,0.12]],cx,cy,R,'#0a1a24',V.c,8);
        vorm([[0,-0.55],[0.08,-0.10],[0,0.06],[-0.08,-0.10]],cx,cy,R,V.c,null);

  function mkSterren(){

    g.fillStyle='#02050c'; g.fillRect(0,0,1024,1024);
    for(let i=0;i<1400;i++){ const x=Math.random()*1024, y=Math.random()*1024,
      r=Math.random()<0.93?Math.random()*1.1+0.3:Math.random()*2.4+1.2,

  // =========================================================
  let KLIKT=0;
  // Waar wijs je heen? Eerst met je hand. Raakt die niets, dan telt je
  // KIJKRICHTING — dan werkt "kijk naar de knop en knijp" altijd, ongeacht hoe je
  // je controller houdt. Dat was de reden dat de knoppen soms niets deden.
  function menuKlik(h){
    if(!h||!h.object3D) return;
    const nu=performance.now(); if(nu-KLIKT<250) return; KLIKT=nu;
    if(menuMik(h)) return;
    const cam=document.querySelector('#cam');
    if(cam&&cam.object3D&&cam!==h) menuMik(cam,true); }

  function menuMik(h,kijk){
    const o=new THREE.Vector3(), q=new THREE.Quaternion();
    h.object3D.getWorldPosition(o); h.object3D.getWorldQuaternion(q);
    const d=(kijk?new THREE.Vector3(0,0,-1):new THREE.Vector3(0,-0.7071,-0.7071))
      .applyQuaternion(q).normalize();
    if(Math.abs(d.z)<0.002) return false;
    let best=null, bt=1e9; const wp=new THREE.Vector3();
    document.querySelectorAll('.menu-btn').forEach(function(el){
      if(!el.object3D) return;
      let p=el.object3D, zicht=true;
      while(p){ if(p.visible===false){ zicht=false; break; } p=p.parent; }
      if(!zicht) return;
      const w=parseFloat(el.getAttribute('width'))||1, hh=parseFloat(el.getAttribute('height'))||1;
      el.object3D.getWorldPosition(wp);
      const t=(wp.z-o.z)/d.z; if(t<=0.1||t>=bt) return;
      const px=o.x+d.x*t, py=o.y+d.y*t;
      if(Math.abs(px-wp.x)<=w*0.62&&Math.abs(py-wp.y)<=hh*1.05){ bt=t; best=el; } });
    if(best){ best.emit('click'); return true; }
    return false; }

        const aan=prof[i]>drempel;
        if(aan&&s===null) s=i;
        if(!aan&&s!==null){ if(i-s>=minLen) uit.push([s,i-1]); s=null; } }
      if(s!==null&&prof.length-s>=minLen) uit.push([s,prof.length-1]);

    // ---- de plaat zelf opmeten: geen vast raster, maar zoeken waar de inkt staat ----
    // Dezelfde letters als op het titelscherm. A-Frame tekent zijn eigen letters:
    // dun, hoekig en zonder gloed. Hier tekenen we de tekst zelf op een doekje —
    // Trebuchet, ruime letterafstand en een echte gloed eromheen — en hangen dat
    // in de scene. Zo ziet het menu eruit als het openingsscherm.
    letterDoek:function(tekst,kl,gloed,px,sp){
      const H=128, marge=Math.round(H*0.55);
      const c=document.createElement('canvas');
      const g0=c.getContext('2d');
      const font='500 '+px+'px "Trebuchet MS", sans-serif';   // dikker: dun las slecht in de bril
      c.width=16; c.height=16; g0.font=font;
      const sperr=sp*px;
      const letters=String(tekst).split('');
      let br=0; letters.forEach(function(t){ br+=g0.measureText(t).width+sperr; });
      c.width=Math.max(16,Math.ceil(br+marge*2));
      c.height=Math.ceil(px*1.9);
      const g=c.getContext('2d');
      g.font=font; g.textBaseline='middle'; g.textAlign='left';
      const y=c.height/2;
      let x=marge;
      // twee gloedlagen, daarna de letter zelf — net als text-shadow in het menu
      [[gloed,34,0.75],[gloed,16,0.90],[gloed,7,1.0]].forEach(function(laag){
        g.shadowColor=laag[0]; g.shadowBlur=laag[1];
        g.globalAlpha=laag[2]; g.fillStyle=kl;
        let xx=marge;
        letters.forEach(function(t){ g.fillText(t,xx,y); xx+=g.measureText(t).width+sperr; }); });
      // Een donkere rand om elke letter. Zonder dat verdwijnt lichte tekst in een
      // lichte achtergrond — en in de bril is dat het verschil tussen lezen en raden.
      g.shadowBlur=0; g.globalAlpha=1;
      g.lineJoin='round'; g.miterLimit=2;
      g.lineWidth=Math.max(3,px*0.13);
      g.strokeStyle='rgba(2,8,14,0.92)';
      let xr=marge;
      letters.forEach(function(t){ g.strokeText(t,xr,y); xr+=g.measureText(t).width+sperr; });
      g.fillStyle=kl;
      letters.forEach(function(t){ g.fillText(t,x,y); x+=g.measureText(t).width+sperr; });
      const t=new THREE.CanvasTexture(c);
      t.needsUpdate=true;
      return {tex:t, ar:c.width/c.height}; },

    // Zet zo'n doekje op een vlak in de scene, op de plek van een a-text.
    letterZet:function(id,tekst,kl,gloed,hoog,sp){

      if(!m){

    // Waar staat dit schip in brand? We leggen het hele plaatje naast het

    vuurPlek:function(P,rij,d,W){
      const k0=P.kol[0], k1=P.kol[1], r=P.rij[rij];
      if(!k0||!k1||!r) return [];
      const bw=Math.min(k0[1]-k0[0],k1[1]-k1[0])+1, bh=r[1]-r[0]+1;
      const brandt=function(o){
        const R=d[o],G=d[o+1],B=d[o+2],A=d[o+3];
        return A>60&&R>170&&G>70&&B<130&&R>B+80; };
      const merk=new Uint8Array(bw*bh);
      const plek=[];
      const st=new Int32Array(bw*bh);
      for(let y=0;y<bh;y+=2) for(let x=0;x<bw;x+=2){
        const i=y*bw+x; if(merk[i]) continue;
        const oB=((r[0]+y)*W+(k1[0]+x))*4, oH=((r[0]+y)*W+(k0[0]+x))*4;
        if(!brandt(oB)||brandt(oH)) continue;
        let sp=0; st[sp++]=i; merk[i]=1; let n=0,cx=0,cy=0;
        while(sp>0){ const j=st[--sp]; const jx=j%bw, jy=(j/bw)|0;

    // Per vak alles wegpoetsen wat niet aan het hoofdschip vastzit.

    // zolang ze groot genoeg zijn.
    plaatSchoon:function(img,W,H,kol,rij,d,naam){
      const c=document.createElement('canvas'); c.width=W; c.height=H;
      const g=c.getContext('2d'); g.drawImage(img,0,0);
      const bd=g.getImageData(0,0,W,H);
      const px=bd.data;
      const DR=24;                                     // vanaf hier telt het als inkt
      let weg=0, blobs=0;
      const merk=new Int32Array(W*H);                  // 0 = nog niet bekeken
      const stapel=new Int32Array(W*H);
      for(let rr=0;rr<rij.length;rr++){
        const r=rij[rr];
        for(let cc=0;cc<kol.length;cc++){
          const k=kol[cc];
          const x0=k[0], x1=k[1], y0=r[0], y1=r[1];
          // 1. alle losse gebieden in dit vak zoeken
          const gebieden=[];
          for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
            const i=y*W+x;
            if(merk[i]||px[i*4+3]<DR) continue;
            let sp=0; stapel[sp++]=i; merk[i]=gebieden.length+1;
            let n=0, cx=0, cy=0;
            while(sp>0){ const j=stapel[--sp];
              const jx=j%W, jy=(j/W)|0;
              n++; cx+=jx; cy+=jy;
              if(jx>x0&&!merk[j-1]&&px[(j-1)*4+3]>=DR){ merk[j-1]=gebieden.length+1; stapel[sp++]=j-1; }
              if(jx<x1&&!merk[j+1]&&px[(j+1)*4+3]>=DR){ merk[j+1]=gebieden.length+1; stapel[sp++]=j+1; }
              if(jy>y0&&!merk[j-W]&&px[(j-W)*4+3]>=DR){ merk[j-W]=gebieden.length+1; stapel[sp++]=j-W; }
              if(jy<y1&&!merk[j+W]&&px[(j+W)*4+3]>=DR){ merk[j+W]=gebieden.length+1; stapel[sp++]=j+W; } }
            gebieden.push({id:gebieden.length+1,n:n,cx:cx/n,cy:cy/n}); }
          // De vierde kolom bevat de projectielen. Daar hoort een raket met een
          // losse vlam te staan: die zou het opruimen als 'los stukje' zien.
          if(cc>=SCHOON_KOL) continue;
          if(gebieden.length<2) continue;              // niets losstaands: klaar
          blobs+=gebieden.length-1;
          let grootste=gebieden[0];
          for(const G of gebieden) if(G.n>grootste.n) grootste=G;
          // 2. te kleine losse stukjes wegpoetsen
          const drempel=grootste.n*SCHOON_DEEL;
          const houd={}; houd[grootste.id]=1;
          for(const G of gebieden) if(G.n>=drempel) houd[G.id]=1;
          let vakWeg=0;
          for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
            const i=y*W+x, m=merk[i];
            if(m&&!houd[m]){ px[i*4+3]=0; weg++; vakWeg++; } }
          if(vakWeg){
            // Verslag: welke plaat, welk vak, hoeveel. Zo is later na te gaan wat
            // er precies is weggehaald en wijst het nooit naar de verkeerde plaat.
            window.ART.schoonLog=window.ART.schoonLog||[];
            window.ART.schoonLog.push({
              plaat:naam||'?', rij:rr, kolom:cc,
              vak:'x'+x0+'-'+x1+' y'+y0+'-'+y1,
              gebieden:gebieden.length, grootste:grootste.n, weg:vakWeg }); } } }
      if(!weg) return null;
      g.putImageData(bd,0,0);
      const nt=new THREE.CanvasTexture(c);
      nt.__naam=(img.__naam||'')+' [schoon]';
      nt.needsUpdate=true;
      window.ART.geknipt=(window.ART.geknipt||0)+weg;
      return nt; },

    meetPlaat:function(tex){
      const img=tex.image; if(!img||!img.width) return null;
      const W=img.width, H=img.height;
      let Wv=W, Hv=H;                                  // maat van de textuur die we uiteindelijk gebruiken

      try{
        const c=document.createElement('canvas'); c.width=W; c.height=H;
        const g=c.getContext('2d'); g.drawImage(img,0,0);
        const d=g.getImageData(0,0,W,H).data; pix=d;
        const cp=new Uint32Array(W);
        for(let y=0;y<H;y++){ const o=y*W*4;
          for(let x=0;x<W;x++) if(d[o+x*4+3]>100) cp[x]++; }

            for(let y=0;y<H;y++){ const o=y*W*4;
              for(let x=k[ci][0];x<=k[ci][1];x++) if(d[o+x*4+3]>100) rp[y]++; }
            const r=this.banden(rp,0,Math.max(4,H*0.008));
            if(!best||r.length>best.length){ best=r; bprof=rp; } }
          // Op een krappe plaat raken twee rijen elkaar en tellen ze als één band.
          // Een band die veel hoger is dan de mediaan wordt gesplitst op zijn diepste dal.
          if(best&&best.length>=2){
            const hs=best.map(function(b){ return b[1]-b[0]+1; }).sort(function(a2,b2){ return a2-b2; });
            const med=hs[Math.floor(hs.length/2)]||1;
            const los=[];
            for(let i=0;i<best.length;i++){
              const y0=best[i][0], y1=best[i][1], hh=y1-y0+1;
              const n=Math.max(1,Math.floor(hh/med+0.40));
              if(n===1){ los.push([y0,y1]); continue; }
              const gr=[y0];
              for(let q=1;q<n;q++){
                const mid=Math.floor(q*hh/n);
                const lo=Math.max(1,mid-Math.floor(hh*0.14));
                const hi=Math.min(hh-1,mid+Math.floor(hh*0.14));
                let bi=lo, bv=1e9;
                for(let y=lo;y<hi;y++) if(bprof[y0+y]<bv){ bv=bprof[y0+y]; bi=y; }
                // Schepen staan meestal netjes op gelijke afstand. Wijk alleen van

                // een toevallige lichte plek dwars door een schip heen.
                const opMid=bprof[y0+mid];

          if(best&&best.length>=2){

            // helemaal in vallen; boven en onder even ver als aan de binnenkant
            // Elke rij oprekken zodat brede schepen er helemaal in vallen — maar
            // NIET tot halverwege de buurman: dan komt er een vleugelpunt van het

            for(let i=0;i<best.length;i++){

              let bov=(i===0)?Math.max(0,b[0]-marge):Math.round((best[i-1][1]+b[0])/2);

                rij=[]; for(let i=0;i<6;i++) rij.push([Math.round(i*H/6),Math.round((i+1)*H/6)-1]); }
      // Losse stukjes weg werken: binnen elk vak hoort maar één schip te staan.
      // Alles wat er niet aan vastzit — een vleugelpunt van de buurman, een
      // afgesneden hoekje — wordt uit de plaat gepoetst. Zo hoef je niet te
      // vertrouwen op precies snijden: wat toch meekomt, verdwijnt gewoon.
      let schoon=tex;
      if(pix&&kol&&rij&&hoe.indexOf('gemeten')===0){
        try{ schoon=this.plaatSchoon(img,W,H,kol,rij,pix,tex.__naam)||tex; }catch(e){ schoon=tex; } }
      const mat=new THREE.MeshBasicMaterial({map:schoon,transparent:true,alphaTest:0.06,
        side:THREE.DoubleSide,depthWrite:false});
      const P={tex:tex,mat:mat,rect:{},hoe:hoe,kol:kol,rij:rij,rijen:rij.length,data:pix,vuur:{}};
      // waar brandt elk schip? één keer uitrekenen, daarna gratis
      if(pix&&kol.length>=2){
        for(let vr=0;vr<rij.length;vr++){

      for(let rr=0;rr<rij.length;rr++){
        const r=rij[rr]; P.rect[rr]=[];

    // ---- een aangeleverde hemel bruikbaar maken, wat er ook binnenkomt ----
    // Een plaat van 2720x1536 kost 21 MB in de bril, en er staan er zeventien
    // tegelijk in het geheugen. Voor een hemel op tientallen meters afstand zie
    // je het verschil niet, maar de haperingen wel. Daarom eerst verkleinen.
    hemelKlein:function(tex){
      const img=tex.image;
      if(!img||!img.width||img.width<=HEMEL_MAX) return tex;
      try{
        const sch=HEMEL_MAX/img.width;
        const w=HEMEL_MAX, hh=Math.max(2,Math.round(img.height*sch));
        const c=document.createElement('canvas'); c.width=w; c.height=hh;
        const g=c.getContext('2d');
        if(g.imageSmoothingQuality) g.imageSmoothingQuality='high';
        g.drawImage(img,0,0,w,hh);
        const nt=new THREE.CanvasTexture(c);
        nt.__naam=tex.__naam; nt.__lijst=tex.__lijst; nt.__gesplitst=tex.__gesplitst;
        nt.needsUpdate=true;
        return nt;
      }catch(e){ return tex; } },

    hemelBereid:function(tex){
      tex=this.hemelKlein(tex);
      const img=tex.image; if(!img||!img.width) return null;
      const W=img.width, H=img.height;
      let Wv=W, Hv=H;                                  // maat van de textuur die we uiteindelijk gebruiken
      let x0=0,x1=W-1,y0=0,y1=H-1, naad=0, buur=1, klaar=tex, hel=60;
      try{
        const c=document.createElement('canvas'); c.width=W; c.height=H;
        const g=c.getContext('2d'); g.drawImage(img,0,0);
        const d=g.getImageData(0,0,W,H).data;
        const helder=function(x,y){ const o=(y*W+x)*4; return (d[o]+d[o+1]+d[o+2])/3; };
        // zwarte randen wegsnijden (sommige platen hebben een lijst eromheen)
        const rijLicht=new Float32Array(H), kolLicht=new Float32Array(W);
        for(let y=0;y<H;y+=2) for(let x=0;x<W;x+=2){
          const v=helder(x,y); rijLicht[y]+=v; kolLicht[x]+=v; }
        const dr=8;
        while(x0<W*0.3&&kolLicht[x0-(x0%2)]/(H/2)<dr) x0+=2;
        while(x1>W*0.7&&kolLicht[x1-(x1%2)]/(H/2)<dr) x1-=2;
        while(y0<H*0.3&&rijLicht[y0-(y0%2)]/(W/2)<dr) y0+=2;
        while(y1>H*0.7&&rijLicht[y1-(y1%2)]/(W/2)<dr) y1-=2;
        // hoe erg is de naad tussen de linker- en rechterrand?
        let s1=0,s2=0,n=0;
        for(let y=y0;y<=y1;y+=3){
          s1+=Math.abs(helder(x0,y)-helder(x1,y));
          s2+=Math.abs(helder(x0+1,y)-helder(x0,y)); n++; }
        naad=s1/Math.max(1,n); buur=Math.max(0.5,s2/Math.max(1,n));
        // gemiddelde helderheid: bepaalt de volgorde als er geen cijfer voor de naam staat
        let som=0, tel=0;
        for(let y=y0;y<=y1;y+=9) for(let x=x0;x<=x1;x+=9){ som+=helder(x,y); tel++; }
        hel=som/Math.max(1,tel);
        if(naad>buur*3&&naad>8){
          // rand overvloeien zodat je de overgang niet ziet
          const bw=x1-x0+1, bh=y1-y0+1, K=Math.max(8,Math.round(bw*0.07));
          const c2=document.createElement('canvas'); c2.width=bw; c2.height=bh;
          const g2=c2.getContext('2d');
          g2.drawImage(img,x0,y0,bw,bh,0,0,bw,bh);
          g2.save(); g2.globalCompositeOperation='source-over';
          for(let i=0;i<K;i++){
            const f=i/(K-1);
            g2.globalAlpha=(1-f)*0.5;
            g2.drawImage(img,x1-K+i,y0,1,bh, i,0,1,bh);          // rechterrand in de linker
            g2.globalAlpha=f*0.5;
            g2.drawImage(img,x0+i,y0,1,bh, bw-K+i,0,1,bh); }     // en omgekeerd
          g2.restore();
          klaar=new THREE.CanvasTexture(c2);
          x0=0; y0=0; x1=bw-1; y1=bh-1;
          Wv=bw; Hv=bh; }                              // de nieuwe plaat is het bijgesneden stuk
      }catch(e){ /* plaat van een ander domein: dan onbewerkt */ }
      const bw=x1-x0+1, bh=y1-y0+1;
      const arb=bw/bh;
      const ru=Math.min(1,2/Math.max(0.5,arb)), rv=Math.min(1,arb/2);
      if(klaar.repeat&&klaar.offset){
        klaar.wrapS=THREE.RepeatWrapping; klaar.wrapT=THREE.ClampToEdgeWrapping;
        klaar.repeat.set((bw/Wv)*ru,(bh/Hv)*rv);
        klaar.offset.set(x0/Wv,(y0/Hv)+(bh/Hv)*(1-rv)/2);
        klaar.needsUpdate=true; }
      const nm=String(tex.__naam||'');
      // Een volgnummer is '01 lucht.png': cijfers gevolgd door een SPATIE of
      // liggend streepje. Zonder die eis leest hij '46a38d17-...' als nummer 46
      // en zet hij een willekeurige plaat vooraan.
      const mm=nm.match(/^\s*(\d{1,3})[ _-]/);
      return {tex:klaar, breed:(arb>2.4), ar:arb,
              basisU:x0/Wv, spanU:(bw/Wv)*ru, naad:naad, buur:buur,
              hel:hel, nr:mm?parseInt(mm[1],10):null, naam:nm,
              rand:(x0>0||y0>0||x1<W-1||y1<H-1)}; },

    // welke plaat en welk vak hoort bij dit scheepstype?
    plaatVoor:function(tp){
      const T=TYPE[tp];
      let P=(T.pl===12)?this.plaat12:((T.pl===13)?this.plaat13:((T.pl===6)?this.plaat6:null));
      // Elk schip houdt ZIJN EIGEN plaat: zijn tekening, zijn raket en zijn
      // vliegtrucjes horen bij elkaar. Een vangnet dat de tekening van een ander
      // schip pakt maakt daar een rommeltje van.

    // welke helft van het vak is het zwaarst? daar zit de kop van het projectiel
    // Welke kant is de kop van een LIGGEND projectiel?
    kopKant:function(d,W,k,r){
      let a=0,b=0; const mid=Math.round((k[0]+k[1])/2);
      for(let y=r[0];y<=r[1];y++){ const o=y*W*4;
        for(let x=k[0];x<=k[1];x++){ const al=d[o+x*4+3];
          if(x<mid) a+=al; else b+=al; } }
      return (a>=b)?'links':'rechts'; },

    // De tekening rondom een buis wikkelen: horizontaal loopt hij helemaal rond
    // (naad aan de achterkant), verticaal van staart naar neus.
    // Een lichaam met zijn lengte langs de vliegrichting zetten.
    richtAs:function(m,dir){
      // EIGEN geheugenplek: this.RQ is van richtQuad en heeft daar meer velden.
      // Die hier overschrijven brak het richten van alle andere projectielen.
      const R=this.RA||(this.RA={y:new THREE.Vector3(),x:new THREE.Vector3(),
        z:new THREE.Vector3(),M:new THREE.Matrix4(),op:new THREE.Vector3()});
      R.y.copy(dir).normalize();
      R.op.set(0,1,0);
      if(Math.abs(R.y.dot(R.op))>0.98) R.op.set(1,0,0);
      R.x.crossVectors(R.op,R.y).normalize();
      R.z.crossVectors(R.x,R.y).normalize();
      R.M.makeBasis(R.x,R.y,R.z);
      m.quaternion.setFromRotationMatrix(R.M); },

    vijVrij2:function(B){
      if(!B) return;
      B.live=false; B.m.visible=false;
      if(B.buis){ B.buis.visible=false; B.buis=null; }
      if(B.neus){ B.neus.visible=false; B.neus.__bezet=0; B.neus=null; }
      if(B.kop2){ B.kop2.visible=false; B.kop2.__bezet=0; B.kop2=null; } },

    buisRect:function(g,R){
      const a=g.attributes.uv;
      for(let i=0;i<a.count;i++){
        const u=a.getX(i), v=a.getY(i);
        a.setXY(i,R.u0+u*(R.u1-R.u0),R.v0+v*(R.v1-R.v0)); }
      a.needsUpdate=true; },

    // Een vrije buis pakken voor een grote raket; is er geen, dan blijft het een vlak.
    buisPak:function(B,R,mat){
      // HIER kwamen de printjes vandaan: het raketlichaam krijgt de vlootplaat
      // als textuur, met het projectielvakje erop. Zolang Sjoerds eigen koppen
      // er zijn hoeft dat lichaam er helemaal niet te zijn.

    // ---- kogel richten: staat altijd met de neus vooruit én naar de camera gekeerd ----

        M:new THREE.Matrix4()});

    fire:function(h){

    zap:function(pts,sprongen){ const a=this.zapG.attributes.position;

      this.toonMelding(raak+' HIT   '+weg+' MISSILES DOWN','#fff2c0'); },

    // De straal leeft een paar tellen: hij groeit open, brandt, en dooft. Elke
    // beurt raakt hij alles binnen zijn koker — schepen én vijandelijk vuur.
    straalTick:function(s){
      if(!(this.straalT>0)) return;
      if(!this.straal){
        const g=new THREE.CylinderGeometry(1,1,1,16,1,true);
        g.rotateX(Math.PI/2);                       // lengte langs -Z
        const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x66f0ff,
          transparent:true,opacity:0.55,depthWrite:false,side:THREE.DoubleSide,
          blending:THREE.AdditiveBlending}));
        m.renderOrder=11; m.frustumCulled=false;
        const k=new THREE.Mesh(g.clone(),new THREE.MeshBasicMaterial({color:0xffffff,
          transparent:true,opacity:0.9,depthWrite:false,side:THREE.DoubleSide,
          blending:THREE.AdditiveBlending}));
        k.renderOrder=12; k.frustumCulled=false;
        this.par.add(m); this.par.add(k);
        this.straal=m; this.straalK=k; }
      this.straalT-=s;
      const k=Math.max(0,this.straalT/STRAAL_TIJD);
      // opengroeien in het begin, uitdoven aan het eind
      const opbouw=Math.min(1,(STRAAL_TIJD-this.straalT)/0.18);
      const dik=STRAAL_DIK*opbouw*(0.75+0.25*Math.sin(this.T*40))*(0.4+k*0.6);
      const mid=this.SM||(this.SM=new THREE.Vector3());
      mid.copy(this.straalO).addScaledVector(this.straalD,STRAAL_VER/2);
      [this.straal,this.straalK].forEach(function(m,i){
        m.visible=true; m.position.copy(mid);
        m.scale.set(dik*(i?0.42:1),dik*(i?0.42:1),STRAAL_VER);
        m.material.opacity=(i?0.95:0.6)*Math.min(1,k*2.2); });
      this.straal.lookAt(this.straalO.clone().addScaledVector(this.straalD,-1));
      this.straalK.quaternion.copy(this.straal.quaternion);
      // schade: alles in de koker
      this.straalS=(this.straalS||0)-s;
      if(this.straalS<=0){ this.straalS=0.06;
        const p=this.SP2||(this.SP2=new THREE.Vector3());
        for(let i=0;i<this.enemies.length;i++){ const e=this.enemies[i];
          if(!e.live||e.dood2) continue;
          p.subVectors(e.p,this.straalO);
          const t=p.dot(this.straalD);
          if(t<0||t>STRAAL_VER) continue;
          if(p.addScaledVector(this.straalD,-t).length()>dik*0.5+e.r) continue;
          this.raak(e,STRAAL_DMG,e.p.x,e.p.y,e.p.z); }
        // en vijandelijk vuur verdampt
        for(let i=0;i<this.vij.length;i++){ const B=this.vij[i]; if(!B.live) continue;
          p.copy(B.o).addScaledVector(B.dir,B.d).sub(this.straalO);
          const t=p.dot(this.straalD);
          if(t<0||t>STRAAL_VER) continue;
          if(p.addScaledVector(this.straalD,-t).length()>dik*0.5+1.5) continue;
          const q=this.tmp.copy(B.o).addScaledVector(B.dir,B.d);
          this.vonk(q.x,q.y,q.z,0x66f0ff,4,4,0.4);
          this.vijVrij2(B); } }
      if(this.straalT<=0&&this.straal){
        this.straal.visible=false; this.straalK.visible=false; } },

    toonMelding:function(txt,kl){ const e=document.querySelector('#hudC'); if(!e) return;
      e.setAttribute('value',txt); e.setAttribute('color',kl||'#ffb03a'); this.meldC=1.6; },

    // =====================================================
    //  TREFFERS
    // =====================================================
    raak:function(e,dmg,px,py,pz){
      // Een treffer op het spook geeft VUUR en ROOK, geen tekening. Zo weet je
      // dat je raak zat zonder dat hij zichtbaar wordt.
      if(e&&e.onzicht&&!e.dood){
        this.vonk(px,py,pz,0xfff2c0,3,2.4,0.30);
        this.vonk(px,py,pz,0xff8a3d,5,3.6,0.45);
        this.rook(px,py,pz,false,1.6,1.2,1);
        // Sjoerds idee: zijn camouflage krijgt schade. Op het inslagpunt trekt
        // een golf door het veld — je ziet de klap, niet het schip.
        this.camoGolf(px,py,pz); }
      if(window.DEMO&&e===this.dDoel) this.dRaak=1;
      if(e.dood2) return;                            // gaat al ten onder
      if(e.intro){ this.vonk(px||e.p.x,py||e.p.y,pz||e.p.z,0x9fe4f5,3,6,0.5); return; }
      if(e.dood){ this.knalDood(e); return; }        // genadeschot op een wrak
      if(!e.live||e.hp<=0) return;
      e.hp-=dmg; e.flash=0.12;
      const p=(1-e.hp/e.hpM), q=e.hp/e.hpM;
      if(e.hp>0&&e.gedrag){                          // een baas laat zien waar je hem raakt
        const hx=(px!==undefined)?px:e.p.x, hy=(py!==undefined)?py:e.p.y, hz=(pz!==undefined)?pz:e.p.z;
        this.vonk(hx,hy,hz,0xfff2c0,3,5,0.6);
        if(Math.random()<0.32) this.vonk(hx,hy,hz,0xffb03a,4,6,1.0);
        if(Math.random()<0.16){ this.knal(this.tmp.set(hx,hy,hz),e.sc*0.06);
          this.brok(e,hx,hy,hz,Math.random()<0.3); }
        else if(Math.random()<0.12) this.brok(e,hx,hy,hz,false); }
      // Een moederschip laat bij elke treffer een broedsel los, met een korte
      // rustpauze zodat een mitrailleur er geen zwerm van maakt.
      if(e.hp>0&&TYPE[e.tp].prof==='moeder'){
        e.brT=(e.brT||0)-0.016;
        if(e.brT<=0){ e.brT=0.55;
          let n=0;
          for(let i=0;i<this.enemies.length;i++)
            if(this.enemies[i].live&&this.enemies[i].broed) n++;
          if(n<10){
            const v=this.spawn(BROEDSEL,{x:e.p.x+(Math.random()-0.5)*e.bw*0.7,
              y:e.p.y+(Math.random()-0.5)*e.bh*0.5, z:e.p.z+4});
            if(v){ v.broed=1; v.prof='broed'; v.ex={}; v.stijl='vrij';
              this.vonk(v.p.x,v.p.y,v.p.z,0x8fd84a,5,6,0.6); } } } }
      else if(e.hp>0&&e.bb){                         // gewone schepen laten ook wat los
        const hx=(px!==undefined)?px:e.p.x, hy=(py!==undefined)?py:e.p.y, hz=(pz!==undefined)?pz:e.p.z;
        if(Math.random()<0.30) this.brok(e,hx,hy,hz,false);
        if(Math.random()<0.22) this.vonk(hx,hy,hz,0xffb03a,2,4,0.45); }
      if(e.hp>0){ SND.hit((px||e.p.x)*0.02,p);
        const Tf=TYPE[e.tp];
        const f1=(Tf.f1!==undefined)?Tf.f1:0.66, f2=(Tf.f2!==undefined)?Tf.f2:0.33;
        const f=(q>f1)?0:((q>f2)?1:2);                // heel / beschadigd / kapot
        if(f!==e.fase){ e.fase=f;
          // Een baas heeft geen vakken op een plaat: zijn hele plaat IS zijn plaatje.
          // De uv aanpassen zou op hem als een zoom werken. Hij toont zijn schade
          // met rook en vonken in plaats van met een ander vak.
          if(e.bb&&e.gedrag){ this.baasRook(e,f); }
          // Het spook heeft geen tekening in beeld; zijn schade lees je aan de
          // kringen bij een treffer en aan het vuur dat hij oploopt. Van vak
          // wisselen zou zijn beschadigde plaatje alsnog laten zien.
          else if(e.onzicht){ }
          else if(e.onzicht){ /* spook: geen plaatje, alleen vuur en rook */ }
          else if(e.bb){ if(e.plaat) this.uvRect(e.bb.g,e.plaat.rect[e.rij][f]);
                    else if(f>=1&&!e.gedrag) this.bbCel(e.bb,Math.min(7,e.cel)+8); }
          this.vonk(e.p.x,e.p.y,e.p.z,0xffb03a,10,9,0.9); }
        this.vonk(px||e.p.x,py||e.p.y,pz||e.p.z,0xffd9a0,3,7,0.45);
        return; }
      this.kill(e); },

    // De genadeklap is niet meteen een knal: het schip draait af, rookt, stort en
    // ontploft pas na 4 seconden. Punten en combo tellen direct, anders voelt het traag.
    kill:function(e){
      e.hp=0;
      // Een spook gaat niet stilletjes: witte vuurbal, schokringen en een dikke
      // zwarte rooksliert terwijl zijn wrak neerstort.
      if(e.onzicht&&!e.spookOp){ e.spookOp=1; this.spookEinde(e); }
      const T=TYPE[e.tp];
      this.punt(e);
      // Een splitser valt bij zijn dood uiteen in twee kleinere, die zelf niet
      // meer splitsen. Anders vult het veld zich met kopieën.
      if(T.prof==='splitser'&&!e.gen&&!window.PAUSED){
        for(let k=0;k<2;k++){
          const v=this.spawn(e.tp,{x:e.p.x+(k?7:-7),y:e.p.y+(Math.random()-0.5)*5,z:e.p.z});
          if(v){ v.gen=1; v.hp=v.hpM=Math.max(1,Math.round(v.hpM*0.42));
            v.sc*=0.66; v.r*=0.66; v.bw*=0.66; v.bh*=0.66;
            if(v.bb) v.bb.m.scale.set(v.bw,v.bh,1);
            v.p.x+=(k?9:-9); }
          this.vonk(e.p.x,e.p.y,e.p.z,0xa06cff,8,9,0.9); } }
      if(T.prof==='baas'){ e.dood2=1; e.dt=0; e.hp=0;   // eigen ondergang van 5 seconden
        SND.zeg('Target destroyed'); return; }
      let bezig=0;
      for(let i=0;i<this.enemies.length;i++) if(this.enemies[i].live&&this.enemies[i].dood) bezig++;
      if(bezig>=14||!e.bb){ this.knalDood(e); return; }
      e.dood=1; e.doodT=0;
      e.fase=1;                                        // meteen naar het beschadigde plaatje
      // Een baas heeft geen vakken op zijn plaat: die houdt zijn eigen plaatje.
      // Deed hij dat niet, dan veranderde hij bij het neerstorten in een blokje.
      if(e.plaat) this.uvRect(e.bb.g,e.plaat.rect[e.rij][1]);
      else if(!e.gedrag) this.bbCel(e.bb,Math.min(7,e.cel)+8);
      const zij=(Math.random()<0.5)?-1:1;
      e.dwijs=Math.floor(Math.random()*3);                   // 0 wegdraaien, 1 duikelen, 2 tollen
      e.dv=new THREE.Vector3(zij*(0.7+Math.random()*0.6),
                             (Math.random()-0.4)*0.5,
                             -0.15-Math.random()*0.3).normalize();
      if(e.dwijs===1){ e.dv.set(zij*0.3,-1.0,-0.1).normalize(); }   // meteen naar beneden
      e.dsp=TYPE[e.tp].sp*0.55+3;                            // blijft in beeld i.p.v. weg te schieten
      e.drol=(Math.random()-0.5)*3.5;
      SND.hit(e.p.x*0.02,1); },

    // ---- de vier seconden zelf ----
    doodBaan:function(e,s){
      e.doodT+=s;
      const rook=function(zelf,dicht){ if(Math.random()<s*(dicht?16:7))
        zelf.vonk(e.p.x,e.p.y,e.p.z,dicht?0xff7a30:0x8a7a6a,1,dicht?3:2.4,dicht?0.8:0.7,true); };

      if(e.dwijs===1){
        // DUIKELEN: eerst hard naar beneden, dan optrekken en wegdraaien, dan pas de knal
        if(e.doodT<1.6){ e.p.addScaledVector(e.dv,e.dsp*1.25*s); e.dv.y-=s*0.5; e.dv.normalize();
          rook(this,0); }
        else { if(e.fase!==2){ e.fase=2;
            if(e.plaat) this.uvRect(e.bb.g,e.plaat.rect[e.rij][2]);
            const zij=(Math.random()<0.5)?-1:1;
            e.dv.set(zij*(0.8+Math.random()*0.5),0.35,-0.2).normalize();  // trekt weg
            this.vonk(e.p.x,e.p.y,e.p.z,0xffb03a,9,8,1.0); }
          e.p.addScaledVector(e.dv,e.dsp*0.9*s);
          e.dv.y-=s*0.25; e.dv.normalize();
          rook(this,1); } }

      else if(e.dwijs===2){
        // TOLLEN: raakt zijn koers kwijt, draait rond en zakt langzaam weg
        e.ex.dh=(e.ex.dh||Math.random()*6.28)+s*(1.8+e.doodT*0.9);
        e.dv.set(Math.cos(e.ex.dh)*0.8,-0.25-e.doodT*0.12,Math.sin(e.ex.dh)*0.5).normalize();
        e.p.addScaledVector(e.dv,e.dsp*0.7*s);
        if(e.doodT>=2.0&&e.fase!==2){ e.fase=2;
          if(e.plaat) this.uvRect(e.bb.g,e.plaat.rect[e.rij][2]);
          this.vonk(e.p.x,e.p.y,e.p.z,0xffb03a,7,7,0.9); }
        rook(this,e.doodT>=2.0); }

      else if(e.doodT<2.0){                            // WEGDRAAIEN: draait af, rookt
        e.p.addScaledVector(e.dv,e.dsp*s);
        e.dv.y-=s*0.10;
        rook(this,0); }
      else {
        if(e.fase!==2){ e.fase=2;                      // stort neer: laatste plaatje
          if(e.plaat) this.uvRect(e.bb.g,e.plaat.rect[e.rij][2]);
          e.dv.x+=(Math.random()-0.5)*1.4;             // en een willekeurige zwenk
          e.dv.z+=(Math.random()-0.5)*0.8;
          e.dv.normalize();
          this.vonk(e.p.x,e.p.y,e.p.z,0xffb03a,7,7,0.9); }
        e.p.addScaledVector(e.dv,e.dsp*0.8*s);
        e.dv.y-=s*0.75;                                // duikt steeds steiler
        e.dv.normalize();
        rook(this,1); }
      const b=e.bb;
      if(b){ b.m.position.copy(e.p); b.m.lookAt(this.kop);
        b.m.rotateZ(e.drol*e.doodT*(e.dwijs===2?2.2:1)); // tolt om zijn as
        b.m.scale.set(e.bw||e.sc,e.bh||e.sc,1); }
      if(e.romp) e.romp.position.copy(e.p);
      if(e.doodT>=4.0||e.p.z>22) this.knalDood(e); },

    punt:function(e){
      const T=TYPE[e.tp];
      this.gedood++; this.combo++; this.laatst=this.T;
      if(this.combo>this.beste) this.beste=this.combo;
      const bonus=Math.floor(T.pt*Math.min(9,this.combo/10));
      this.punten+=T.pt+bonus; this.ultPt+=T.pt+bonus;
      while(this.ultPt>=25000){ this.ultPt-=25000; this.ults++; SND.zeg('Extra ult'); } },

    knalDood:function(e){
      e.live=false; e.dood=0; e.hp=0;
      if(e.romp){ e.romp.visible=false; e.romp=null; }
      SND.kill(e.p.x*0.02,e.sc/7); SND.boom(e.p.x*0.02,e.bw>=16);
      this.vonk(e.p.x,e.p.y,e.p.z,0xfff2c0,14,7,1.7);      // witte kern
      this.vonk(e.p.x,e.p.y,e.p.z,0xffb03a,22,15,1.5);     // oranje wolk
      this.vonk(e.p.x,e.p.y,e.p.z,0xff5a2a,16,22,1.1);     // rode scherven ver weg
      this.vonk(e.p.x,e.p.y,e.p.z,0x6a6a6a,10,9,2.2);      // rook
      // Hij spat uiteen: echte stukken van zijn eigen plaatje, met vuur en rook
      // die met de brokken mee naar buiten vliegen. Een flits alleen is te schoon
      // voor een schip dat zojuist uit elkaar is geslagen.
      const nb=Math.min(BROKKNAL,2+Math.round(e.bw*0.35));
      for(let k=0;k<nb;k++) this.brok(e,e.p.x,e.p.y,e.p.z,Math.random()<0.35,1);
      for(let k=0;k<3;k++){
        const hk=Math.random()*6.283, af=e.sc*(0.3+Math.random()*0.7);
        const sx=e.p.x+Math.cos(hk)*af, sy=e.p.y+Math.sin(hk)*af*0.7,
              sz=e.p.z+(Math.random()-0.5)*af;
        this.vonk(sx,sy,sz,0xffd070,5,7,0.9);              // wegspattend vuur
        this.vonk(sx,sy,sz,0x5a5a5a,4,5,2.4); }            // en zijn rookje
      this.knal(e.p,e.sc);
      this.bbVrij(e.bb); e.bb=null;
      if(TYPE[e.tp].prof==='baas'){ this.baas=null; } },

    // De open schokring: een dun cirkeltje dat uitdijt en vervaagt, met een gat
    // erin op een willekeurige plek. Een gesloten ring oogt als een hoepel; juist
    // die opening maakt het een klap.
    schokRing:function(p){
      if(!this.ringen){
        this.ringen=[];
        for(let i=0;i<RINGEN;i++){
          const g=new THREE.BufferGeometry();
          g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(3*(RINGPT+1)),3));
          const m=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffd9a0,
            transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
          m.frustumCulled=false; m.renderOrder=9; m.visible=false;
          this.par.add(m); this.ringen.push({m:m,g:g,live:false,t:0,
            gat:0,gr:0,kant:new THREE.Quaternion()}); } }
      for(let i=0;i<this.ringen.length;i++){ const R=this.ringen[i]; if(R.live) continue;
        R.live=true; R.t=0;
        R.gat=Math.random()*6.283;                     // waar de opening zit
        R.gr=(0.35+Math.random()*0.45)*1.57;           // hoe groot het gat is
        R.m.position.copy(p);
        // een willekeurige kanteling, zodat niet elke klap er hetzelfde uitziet
        R.m.rotation.set(Math.random()*3.14,Math.random()*3.14,Math.random()*3.14);
        R.m.visible=true; R.m.material.opacity=0.95;
        return; } },

    ringTick:function(s){
      if(!this.ringen) return;
      for(let i=0;i<this.ringen.length;i++){ const R=this.ringen[i]; if(!R.live) continue;
        R.t+=s;
        const k=R.t/RINGTIJD;
        if(k>=1){ R.live=false; R.m.visible=false; continue; }
        const straal=RAKETBLAST*(0.15+k*1.15);
        const a=R.g.attributes.position;
        for(let q=0;q<=RINGPT;q++){
          // het gat overslaan: die punten leggen we op de rand van de opening
          let hoek=R.gat+R.gr+(6.283-R.gr*2)*(q/RINGPT);
          a.setXYZ(q,Math.cos(hoek)*straal,Math.sin(hoek)*straal,0); }
        a.needsUpdate=true;
        R.m.material.opacity=0.95*(1-k)*(1-k); } },

    knal:function(p,sc){                                   // korte lichtbol op de plek van de klap
      const K=this.blast; if(!K) return;
      K.visible=true; K.position.copy(p); K.material.opacity=0.95;
      K.scale.setScalar(sc*0.35); this.blastT=0.45; this.blastS=sc; },

    // Rook is geen vonk: vonken worden OPTELLEND getekend en dan voegt zwart
    // niets toe — je zag dus nooit donkere rook, hoe donker ik hem ook maakte.
    // Rook krijgt daarom zijn eigen deeltjes die het beeld juist verdonkeren.
    // spoor=1 → raketrook: lichtgrijs, anders dan de zwarte rook van een schip
    rook:function(x,y,z,zwart,sz,leven,spoor){
      if(!this.rookP) return;
      for(let i=0;i<this.rookP.length;i++){ const R=this.rookP[i]; if(R.live) continue;
        R.live=true; R.life=1; R.leven=leven||1;
        R.sz=(sz||2)*(0.6+Math.random()*0.7);
        R.m.material.color.setHex(spoor?0xa8adb4:(zwart?0x141414:0x585858));
        R.m.material.opacity=spoor?0.42:(zwart?0.85:0.55);
        R.m.position.set(x,y,z); R.m.visible=true;
        R.vx=(Math.random()-0.5)*1.6; R.vy=0.5+Math.random()*1.2;
        R.vz=(Math.random()-0.5)*1.6;
        R.m.scale.setScalar(R.sz);
        return; } },

    vonk:function(x,y,z,col,n,spr,sz,staart){
      // Dit telde ELKE keer alle 300 deeltjes af om te kijken hoeveel er vrij
      // zijn — voor elk brandend schip, elke beurt. Dat was de hapering. De
      // teller wordt nu bijgehouden in plaats van steeds opnieuw geteld.
      if(staart&&(this.vonkVrij||0)<45) return;
      for(let k=0;k<n;k++){
        for(let i=0;i<this.vonken.length;i++){ const F=this.vonken[i]; if(F.live) continue;
          F.live=true; this.vonkVrij=(this.vonkVrij||0)-1;
          F.life=1; F.sz=(sz||1)*(0.5+Math.random()*0.9);
          F.m.material.color.setHex(col); F.m.material.opacity=1;
          F.m.position.set(x,y,z); F.m.visible=true;
          F.vx=(Math.random()-0.5)*spr; F.vy=(Math.random()-0.5)*spr; F.vz=(Math.random()-0.5)*spr;
          break; } } },

    raakMij:function(dmg){
      if(window.PAUSED||this.hurtCd>0) return;
      this.hurtCd=0.6;
      this.power=Math.max(0,this.power-dmg);
      this.rood=Math.min(0.75,this.rood+dmg*0.020);
      this.combo=0;
      if(this.power<=0) this.gameOver(); },

    // =====================================================
    //  VIJANDEN

    // nadert in drie haltes: 60m schieten, 40m schieten, 20m schieten, dan blijven hangen

    // =====================================================
    //  DE BAAS
    // =====================================================
    baasBaan:function(e,s,naar,afst){
      const T=TYPE[e.tp];

      if(e.intro){ this.baasIntro(e,s); return; }
      if(e.rijst){ this.reusRijst(e,s); return; }
      if(e.fase>=1){                                   // blijft nasmeulen
        e.rookT=(e.rookT||1.1)-s;
        if(e.rookT<=0){ e.rookT=(e.fase>=2)?0.55:1.1;
          const px=e.p.x+(Math.random()-0.5)*e.bw*0.7;
          const py=e.p.y+(Math.random()-0.5)*e.bh*0.6;
          this.vonk(px,py,e.p.z+2,(e.fase>=2)?0xff5a3c:0xffb03a,4,6,1.0);
          this.vonk(px,py,e.p.z+2,0x707070,3,3,1.9); } }
      const reus=(e.gedrag==='reus');
      const zijPlek=(e.trioI!==undefined&&e.trioI!==null)?((e.trioI-1)*46):0;
      const hoogte=(e.trioI!==undefined&&e.trioI!==null)?((e.trioI-1)*9):0;

      const R=DANS[e.baasNaam]||TRIPS[e.gedrag]||TRIPS.schip;

      // de klok elke beurt terug. Een eigen vlag lost dat op.

      e.tripT-=s;
      if(e.tripT<=0){ e.trip=(e.trip+1)%R.length; e.tripT=R[e.trip].t*(0.85+Math.random()*0.3);
        if(R[e.trip].zeg) this.toonMelding(R[e.trip].zeg,'#ff8aa6');
        // de aanval die bij deze plek hoort, na een korte aankondiging
        if(R[e.trip].aanval&&!e.intro&&!e.dood&&!e.dood2){
          const wat=R[e.trip].aanval, self=this;
          if(wat!=='niets'){

            this.sigNa(DANS_MELD,function(){

      const F=R[e.trip];

      // Vol vooruit of vol achteruit schoot telkens voorbij zijn doel; dat gaf

      // en loopt zijn snelheid soepel op in plaats van in één klap.

      e.p.addScaledVector(naar,e.vv*s);

            {soort:2,sp:soort.sp,hp:JACHT_HP,dmg:JACHT_DMG,zoek:1,draai:soort.draai,

          // geen geslinger: het jachtsalvo stuurt strak en mikt vooruit
          if(B&&extra){ B.waaier=extra.w||0; B.wh=extra.h||0; } }); };
      switch(soort.vorm){
        case 'ketting':                    // achter elkaar aan, als een sliert
          for(let i=0;i<n;i++) zet(0.10*Math.sin(i*1.7),0.03,i*0.13);
          break;
        case 'schaar':                     // twee groepen die elkaar kruisen
          for(let i=0;i<n;i++){ const l=(i%2)?1:-1;
            zet(l*0.55,0.05,Math.floor(i/2)*0.16,{w:0.5,h:l>0?0:3.14}); }
          break;
        case 'regen':                      // van boven naar beneden op je af
          for(let i=0;i<n;i++) zet(((i/(n-1))-0.5)*0.7,0.55,i*0.09);
          break;
        case 'bloem':                      // eerst helemaal open, dan naar binnen
          for(let i=0;i<n;i++){ const hk=(i/n)*6.283;

          break;

          for(let i=0;i<n;i++) zet(((i/Math.max(1,n-1))-0.5)*0.45,0.04,i*0.10); }
      this.sigMeld(e,soort.roep,'#ff6a3d'); },

    // ---- DE VIERDE AANVAL: trage, zware zoekers ----
    // Weinig raketten, maar groot, hard en taai. Ze komen langzaam aan, dus je
    // kunt ze zien en kapotschieten — maar laat je er één door, dan voel je het.
    sigZwaar:function(e,twee){
      const Z=ZWAAR[e.baasNaam]||ZWAAR._;
      const n=Z.n+(twee?Z.meer:0);
      const self=this;
      for(let i=0;i<n;i++){
        const zij=((i/Math.max(1,n-1))-0.5)*Z.spreid;
        this.sigNa(i*Z.na,function(){
          if(!e.live||e.dood) return;
          const B=self.sigSchot(e,self.sigRicht(e,zij,0.05),
            {soort:3,sp:Z.sp,hp:Z.hp,dmg:Z.dmg,zoek:1,draai:Z.draai,zwaar:1,
             groot:Z.groot,neus:1,kleur:Z.kl,
             splijt:Z.splijt||0,sptijd:Z.splijt?1.6:0});
          if(B) B.rT=0; }); }
      this.sigMeld(e,Z.roep,'#ff2a3d');
      SND.alarm&&SND.alarm(e.p.x*0.02); },

    // ---- DE VIJFDE AANVAL: de eigen specialiteit van elke baas ----
    // Hier mag elke baas iets doen wat geen ander doet.
    sigSpeciaal:function(e,twee){
      const naam=e.baasNaam||'', self=this;
      const kl=0xffd0a0;
      if(naam==='DREADNOUGHT'||naam==='THE WALKER'){
        // MUUR: een brede rij die tegelijk vertrekt en samen op je afdraait
        const n=twee?14:10;
        for(let i=0;i<n;i++)
          this.sigSchot(e,this.sigRicht(e,((i/(n-1))-0.5)*0.9,0.02),
            {sp:15,hp:2,dmg:6,zoek:1,draai:1.1,groot:0.9,neus:2,kleur:0xff7040});
        this.sigMeld(e,'WALL','#ff7040'); return; }
      if(naam==='WARDEN'||naam==='IRONCLAD'){
        // MIJNENVELD: trage bollen die blijven hangen en dan losbarsten
        const n=twee?8:6;
        for(let i=0;i<n;i++){
          const hk=(i/n)*6.283;
          const B=this.sigSchot(e,this.sigRicht(e,Math.cos(hk)*0.55,Math.sin(hk)*0.45),
            {sp:6,hp:6,dmg:9,groot:1.5,neus:1,kleur:0xc0c8d0,
             splijt:5,sptijd:2.4});
          if(B) B.md=170; }
        this.sigMeld(e,'MINEFIELD','#c0c8d0'); return; }
      if(naam==='LANCE'||naam==='SERAPH'){
        // SPEER: één zware kop met een sliert kleintjes erachteraan
        this.sigSchot(e,this.sigRicht(e,0,0.04),
          {sp:12,hp:12,dmg:14,zoek:1,draai:2.0,zwaar:1,groot:2.1,neus:1,kleur:0xffe8b0});
        for(let i=0;i<(twee?9:6);i++)
          this.sigNa(0.10+i*0.08,function(){ if(!e.live) return;
            self.sigSchot(e,self.sigRicht(e,(Math.random()-0.5)*0.3,0.03),
              {sp:30,hp:1,dmg:5,streep:1,groot:0.7,neus:0,kleur:0xcfe8ff}); });
        this.sigMeld(e,'SPEAR','#ffe8b0'); return; }
      if(naam==='THE WHEEL'||naam==='THE CORE'){
        // SPIRAAL: ze vertrekken op een cirkel die om je heen krimpt
        const n=twee?16:11;
        for(let i=0;i<n;i++){
          const hk=(i/n)*6.283;
          this.sigNa(i*0.05,function(){ if(!e.live) return;
            self.sigSchot(e,self.sigRicht(e,Math.cos(hk)*0.62,Math.sin(hk)*0.52),
              {sp:16,hp:2,dmg:6,groot:0.9,neus:2,kleur:0x40e0ff,
               draaiOm:(i%2?1:-1),hoekS:1.7,hoek0:hk,straal0:1}); }); }
        this.sigMeld(e,'SPIRAL','#40e0ff'); return; }
      if(naam==='RAVEN'||naam==='DEATHS HEAD'){
        // SCHADUW: ze zwenken ver weg en komen van ACHTEREN terug
        const n=twee?8:5;
        for(let i=0;i<n;i++){
          const l=(i%2)?1:-1;
          const B=this.sigSchot(e,this.sigRicht(e,l*1.5,0.1),
            {sp:23,hp:3,dmg:8,zoek:1,draai:2.0,groot:1.1,neus:1,kleur:0xc060ff});
          if(B){ B.waaier=1.1; B.wh=(l>0?0:3.14); } }
        this.sigMeld(e,'FLANK  -  BEHIND YOU','#c060ff'); return; }
      if(naam==='THE EYES'||naam==='ARACHNID'){
        // NET: langzame kogels die een raster vormen waar je doorheen moet
        const n=twee?15:10;
        for(let i=0;i<n;i++){
          const rij=Math.floor(i/5), kol2=i%5;
          const B=this.sigSchot(e,this.sigRicht(e,(kol2-2)*0.22,(rij-0.5)*0.30),
            {sp:9,hp:2,dmg:6,groot:1.0,neus:2,kleur:0x90ff40});
          if(B) B.md=200; }
        this.sigMeld(e,'THE NET','#90ff40'); return; }
      // TITAN PRIME en de rest: alles tegelijk
      this.sigZwaar(e,twee);
      this.sigNa(0.8,function(){ if(e.live) self.sigJacht(e,twee); });
      this.sigMeld(e,'OVERWHELM','#ff3d55'); },

    // ---- DE SPIRAALWERPER: een zware vijand vanaf level 4 ----
    // Hij staat stil terwijl hij vuurt, spreidt acht zoekers vanuit zijn midden
    // naar buiten, en die draaien slingerend en spiralend op je af. Daarna
    // sprint hij naar een nieuwe plek. Taai genoeg om acht tellen mitrailleur
    // te verdragen.
    // Zijn kracht in drieën: gaaf, gehavend, bijna op. Bij elke stap brandt en
    // rookt hij heftiger — dat spoor is hoe je hem vindt en volgt.
    // Een rimpeling in de camouflage: een dun ringetje dat opengaat en vervaagt,
    // altijd naar je toe gekeerd. Zo weet je dat je raak zat.
    camoGolf:function(x,y,z){
      if(!this.camo){
        this.camo=[];
        const g=new THREE.RingGeometry(0.62,0.78,20);
        for(let i=0;i<CAMO_N;i++){
          const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x9fe4f5,
            transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,
            blending:THREE.AdditiveBlending}));
          m.renderOrder=10; m.visible=false; m.frustumCulled=false;
          this.par.add(m); this.camo.push({m:m,live:false,t:0}); } }
      for(let i=0;i<this.camo.length;i++){ const C2=this.camo[i];
        if(C2.live) continue;
        C2.live=true; C2.t=CAMO_TIJD;
        C2.m.position.set(x,y,z); C2.m.visible=true;
        return; } },

    camoTick:function(s){
      if(!this.camo) return;
      const eye=this.kop;
      for(let i=0;i<this.camo.length;i++){ const C2=this.camo[i]; if(!C2.live) continue;
        C2.t-=s;
        if(C2.t<=0){ C2.live=false; C2.m.visible=false; continue; }
        const k=1-C2.t/CAMO_TIJD;                    // 0 = net geraakt
        C2.m.scale.setScalar(CAMO_MAAT*(0.25+k*1.5));
        C2.m.material.opacity=0.85*(1-k)*(1-k);
        C2.m.lookAt(eye); } },

    // Hij blijft niet eindeloos rondzweven. Duurt het te lang, dan trekt hij
