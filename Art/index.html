<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Gallery</title>
<style>
    *{box-sizing:border-box}
    body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
    header{position:sticky;top:0;z-index:10;background:#181818;padding:15px;
           text-align:center;border-bottom:1px solid #333}
    h1{margin:0 0 10px;font-size:22px}
    #count{color:#aaa;font-size:14px}
    nav{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    nav button{position:static;width:auto;height:auto;border-radius:16px;
      font-size:13px;padding:6px 14px;background:#222;border:1px solid #333;
      color:#bbb;cursor:pointer}
    nav button.aan{background:#ffb03a;border-color:#ffb03a;color:#111;font-weight:bold}
    .gallery{padding:15px;display:grid;
             grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}
    .item{background:#1d1d1d;border-radius:10px;padding:8px;cursor:pointer;
          transition:transform .15s;position:relative}
    .item:hover{transform:scale(1.03)}
    .item img{width:100%;height:180px;object-fit:contain;display:block;
      background:repeating-conic-gradient(#333 0% 25%,#222 0% 50%) 50%/20px 20px;
      border-radius:6px}
    .name{padding:8px 3px 3px;font-size:13px;color:#ccc;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
    /* het levelmerk linksboven op de plaat */
    .lv{position:absolute;top:14px;left:14px;background:#ffb03a;color:#111;
        font-weight:900;font-style:italic;font-size:15px;padding:3px 10px;
        border-radius:6px;letter-spacing:.02em}
    .lv.geen{background:#2a3648;color:#7d93ad;font-weight:normal;font-style:normal;
             font-size:12px}
    .uitleg{max-width:760px;margin:0 auto;padding:0 15px 6px;color:#888;
            font-size:13px;line-height:1.6}
    #viewer{display:none;position:fixed;inset:0;z-index:100;
            background:rgba(0,0,0,.92);align-items:center;justify-content:center;
            flex-direction:column;padding:20px}
    #viewer img{max-width:95vw;max-height:80vh;object-fit:contain}
    #viewerName{margin-top:12px;color:#ccc;text-align:center}
    button{position:absolute;border:none;background:rgba(255,255,255,.15);
      color:#fff;font-size:35px;width:55px;height:55px;border-radius:50%;cursor:pointer}
    #close{top:15px;right:15px}  #prev{left:15px;top:50%}  #next{right:15px;top:50%}
    #loading{text-align:center;padding:40px;color:#aaa}
</style>
</head>
<body>
<header>
    <h1>&#127912; Art Gallery</h1>
    <div id="count">Afbeeldingen laden...</div>
    <nav>
      <button id="fAlles" class="aan">alles</button>
      <button id="fHemels">achtergronden</button>
      <button id="fVloot">schepen</button>
      <button id="fBaas">bazen</button>
      <button id="fObject">objecten</button>
    </nav>
</header>
<div class="uitleg" id="uitleg"></div>
<div id="loading">Even laden...</div>
<div class="gallery" id="gallery"></div>
<div id="viewer">
    <button id="close">&times;</button>
    <button id="prev">&lsaquo;</button>
    <img id="viewerImg" src="" alt="">
    <button id="next">&rsaquo;</button>
    <div id="viewerName"></div>
</div>
<script>
const OWNER="umop3p1sdn", REPO="Cosmic";
const PADEN=["Art","art","ART"];

// ---- DE SELECTIEMETHODE VAN HET SPEL, VOLLEDIG ----
// Ik had eerst alleen naar de breedte gekeken; daardoor kwamen er vliegtuigen
// tussen de achtergronden. Het spel kijkt in deze volgorde:
//
//  1. VASTGELEGD NUMMER wint van alles. Het spel heeft een lijst van 56
//     bestandsnummers met hun rol (schip, baas, hemel, object, planeet).
//  2. DE MAPNAAM daarna: staat een plaat in een map met 'achtergrond', 'hemel',
//     'sky' of 'background' in de naam, dan is het een hemel. Idem 'vijand',
//     'schepen', 'fleet', 'enem' voor de vloot, 'baas'/'boss', en
//     'object'/'planeet'/'prop'.
//  3. DE KOPPENPLAAT (537ED456...) doet nergens aan mee.
//  4. Pas als niets daarvan past RAADT het spel op vorm:
//       breedte/hoogte >= 1,7  EN  minder dan 12% doorzichtig  -> ACHTERGROND
//       0,55 tot 1,05 breed    EN  minstens 5% doorzichtig     -> VLOOT
//       al het andere                                          -> object
const NUMMERS={"9510":"hemel","9516":"hemel","9523":"hemel","9531":"object","9532":"planeet","9533":"planeet","9534":"planeet","9544":"baas","9550":"baas","9551":"baas","9559":"baas","9563":"baas","9564":"baas","9565":"baas","9573":"baas","9580":"baas","9822":"hemel","9823":"hemel","9835":"schip","9840":"schip","9841":"schip","9858":"schip","9860":"schip","9868":"schip","9872":"schip","9873":"schip","9874":"schip","9875":"schip","9879":"schip","9880":"schip","9881":"schip","9889":"schip","9891":"schip","9892":"schip","9893":"schip","9895":"schip","9897":"schip","9898":"schip","9899":"schip","9904":"schip","9905":"schip","9907":"schip","9910":"schip","9913":"schip","9916":"schip","9918":"schip","9922":"schip","9923":"baas","9937":"baas","9940":"baas","9969":"sleep","0127":"schip","0196":"schip","0005":"baas","0007":"baas","0006":"baas"};
const KOPPEN="537ED456";
const AR_MIN=1.7, LEEG_MAX=0.12, LEVELS=11;

// hoeveel van de plaat is doorzichtig? Zelfde meting als het spel: 96x96.
function doorzichtig(img){
  try{
    const c=document.createElement("canvas"); c.width=96; c.height=96;
    const g=c.getContext("2d"); g.clearRect(0,0,96,96);
    g.drawImage(img,0,0,96,96);
    const d=g.getImageData(0,0,96,96).data;
    let leeg=0;
    for(let i=3;i<d.length;i+=4) if(d[i]<40) leeg++;
    return leeg/(96*96);
  }catch(e){ return 0; } }

function nummer(naam){
  const m=String(naam).match(/(\d{4})(?!.*\d{4})/);
  return m?m[1]:null; }

function mapSoort(pad){
  const n=String(pad||"").toLowerCase();
  if(/achtergrond|hemel|sky|background/.test(n)) return "hemel";
  if(/vijand|schepen|fleet|enem/.test(n))        return "vloot";
  if(/baas|boss/.test(n))                        return "baas";
  if(/object|planeet|planet|prop/.test(n))       return "object";
  return null; }

// de rol van een plaat, in dezelfde volgorde als het spel
function rolVan(f){
  if(String(f.name).indexOf(KOPPEN)===0) return "koppen";
  const nr=nummer(f.name);
  if(nr&&NUMMERS[nr]) return NUMMERS[nr];          // 1. vastgelegd
  const ms=mapSoort(f.map);
  if(ms) return ms;                                // 2. mapnaam
  if(f.ar>=AR_MIN&&f.leeg<LEEG_MAX) return "hemel";       // 3. raden op vorm
  if(f.ar>=0.55&&f.ar<=1.05&&f.leeg>=0.05) return "vloot";
  return "object"; }

let images=[], current=0, filter="alles";


function nummer(naam){
  const m=String(naam).match(/(\d{4})(?!.*\d{4})/);
  return m?parseInt(m[1],10):9999; }

async function maten(list){
  // elke plaat inladen: breedte, hoogte EN hoeveel ervan doorzichtig is
  await Promise.all(list.map(f=>new Promise(res=>{
    const im=new Image();
    im.crossOrigin="anonymous";
    im.onload=()=>{ f.w=im.naturalWidth; f.h=im.naturalHeight;
      f.ar=f.h?(f.w/f.h):0; f.leeg=doorzichtig(im); res(); };
    im.onerror=()=>{ f.ar=0; f.leeg=0; res(); };
    im.src=f.download_url; })));
}

async function loadImages(){
  let wortel=null, gebruikt="";
  for(const p of PADEN){
    try{ const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+p);
      if(r.ok){ wortel=await r.json(); gebruikt=p; break; } }catch(e){}
  }
  if(!wortel){ document.getElementById("loading").textContent=
    "\u274c Map niet gevonden (geprobeerd: "+PADEN.join(", ")+")"; return; }

  // ook de SUBMAPPEN inlezen: hun naam bepaalt mee wat een plaat is
  let alles=[];
  for(const q of wortel){
    if(q.type==="file") { q.map=""; alles.push(q); }
    else if(q.type==="dir"){
      try{ const r2=await fetch(q.url);
        if(r2.ok){ const kids=await r2.json();
          kids.forEach(k=>{ if(k.type==="file"){ k.map=q.name; alles.push(k); } }); } }catch(e){}
    } }

  images=alles.filter(f=>/\.(png|jpg|jpeg|webp)$/i.test(f.name))
              .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));

  document.getElementById("loading").textContent="Maten meten...";
  await maten(images);

  // de rol bepalen, precies zoals het spel dat doet
  images.forEach(f=>{ f.rol=rolVan(f); });

  // alleen de ECHTE achtergronden, op nummer gesorteerd zoals het spel
  const hemels=images.filter(f=>f.rol==="hemel")
    .sort((a,b)=>{ const na=nummer(a.name)||"9999", nb=nummer(b.name)||"9999";
      return parseInt(na,10)-parseInt(nb,10); });
  hemels.forEach((f,i)=>{ if(i<LEVELS) f.level=i+1; });

  document.getElementById("loading").style.display="none";
  const tel={};
  images.forEach(f=>{ tel[f.rol]=(tel[f.rol]||0)+1; });
  document.getElementById("count").textContent=
    images.length+" afbeeldingen  \u00b7  "+
    (tel.hemel||0)+" achtergronden, "+(tel.vloot||0)+" schepen, "+
    (tel.baas||0)+" bazen, "+(tel.object||0)+" objecten  \u00b7  /"+gebruikt;
  document.getElementById("uitleg").innerHTML=
    "Het spel kijkt eerst naar het <b>vastgelegde nummer</b> (56 platen hebben een "+
    "vaste rol), dan naar de <b>mapnaam</b>, en pas daarna naar de vorm: "+
    AR_MIN+"\u00d7 zo breed als hoog \u00e9n minder dan 12% doorzichtig. "+
    "De achtergronden worden op nummer gesorteerd; de eerste "+LEVELS+
    " krijgen level 1 t/m "+LEVELS+". "+
    (hemels.length<LEVELS
      ? "<b style='color:#ff8a6a'>Je hebt er "+hemels.length+", dus "+(LEVELS-hemels.length)+
        " levels moeten een plaat delen.</b>"
      : "Wil je een andere volgorde, hernoem dan de bestanden.");
  teken();
}

function teken(){
  const g=document.getElementById("gallery");
  g.innerHTML="";
  let lijst=images;
  if(filter==="hemel") lijst=images.filter(f=>f.rol==="hemel")
    .sort((a,b)=>(parseInt(nummer(a.name)||"9999",10))-(parseInt(nummer(b.name)||"9999",10)));
  else if(filter!=="alles") lijst=images.filter(f=>f.rol===filter);
  lijst.forEach(f=>{
    const item=document.createElement("div");
    item.className="item";
    if(f.rol==="hemel"){
      const b=document.createElement("div");
      b.className="lv"+(f.level?"":" geen");
      b.textContent=f.level?("LEVEL "+f.level):"reserve";
      item.appendChild(b); }
    else if(f.rol&&f.rol!=="object"){
      const b=document.createElement("div");
      b.className="lv geen"; b.textContent=f.rol;
      item.appendChild(b); }
    const img=document.createElement("img");
    img.src=f.download_url; img.loading="lazy"; img.alt=f.name;
    const nm=document.createElement("div");
    nm.className="name";
    nm.textContent=f.name+(f.w?("  \u00b7  "+f.w+"\u00d7"+f.h):"");
    item.appendChild(img); item.appendChild(nm);
    item.onclick=()=>openViewer(images.indexOf(f));
    g.appendChild(item); });
}

[["fAlles","alles"],["fHemels","hemel"],["fVloot","vloot"],
 ["fBaas","baas"],["fObject","object"]].forEach(function(q){
  document.getElementById(q[0]).onclick=function(){
    filter=q[1];
    ["fAlles","fHemels","fVloot","fBaas","fObject"].forEach(function(id){
      document.getElementById(id).classList.remove("aan"); });
    this.classList.add("aan"); teken(); }; });

function openViewer(i){ current=i;
  document.getElementById("viewer").style.display="flex"; updateViewer(); }
function updateViewer(){ const f=images[current];
  document.getElementById("viewerImg").src=f.download_url;
  document.getElementById("viewerName").textContent=
    (current+1)+" / "+images.length+" \u2014 "+f.name+
    (f.level?("   \u2014  LEVEL "+f.level):""); }
function closeViewer(){ document.getElementById("viewer").style.display="none"; }
function previous(){ current=(current-1+images.length)%images.length; updateViewer(); }
function next(){ current=(current+1)%images.length; updateViewer(); }
document.getElementById("close").onclick=closeViewer;
document.getElementById("prev").onclick=previous;
document.getElementById("next").onclick=next;
document.getElementById("viewer").onclick=function(e){ if(e.target===this) closeViewer(); };
document.addEventListener("keydown",function(e){
  if(document.getElementById("viewer").style.display!=="flex") return;
  if(e.key==="Escape") closeViewer();
  if(e.key==="ArrowLeft") previous();
  if(e.key==="ArrowRight") next(); });
let tx=0;
document.getElementById("viewer").addEventListener("touchstart",e=>{tx=e.changedTouches[0].screenX;});
document.getElementById("viewer").addEventListener("touchend",e=>{
  const d=e.changedTouches[0].screenX-tx;
  if(Math.abs(d)>50){ d>0?previous():next(); } });

loadImages();
</script>
</body>
</html>
